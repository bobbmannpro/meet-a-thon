    <style>
      /* ── Sunlight design tokens ──────────────────────────────────────────────
         Built for phones in direct sun. Glare turns a dark screen into a grey
         wash and makes thin strokes and pale text vanish, so: white ground,
         near-black ink, heavy weights, big type, 2–3px borders. Mirrored in the
         JS object TM so inline styles can name a token instead of a hex. */
      :root {
        --tm-bg:          #FFFFFF;   /* page ground — maximum reflectance, never tinted */
        --tm-bg-alt:      #EFEDE8;   /* section bands, inset panels, input wells */
        --tm-ink:         #0B0D10;   /* all primary text, 19:1 on white */
        --tm-ink-muted:   #3D434B;   /* secondary text only, 10:1 — never lighter */
        --tm-line:        #C9C5BC;   /* borders, always 2px or 3px */
        --tm-swim:        #0B3FCC;   /* cobalt — white text 8.0:1 */
        --tm-bike:        #B44A00;   /* deep orange — white text 5.4:1 */
        --tm-run:         #04613F;   /* deep green — white text 7.8:1 */
        --tm-live:        #B3001B;   /* LIVE badges, recording, alerts */
        --tm-warn:        #8A5A00;   /* warnings — white text 5.6:1 */
        --tm-font:        'Archivo', 'Arial Black', Arial, sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body { background: var(--tm-bg); color: var(--tm-ink); font-family: var(--tm-font);
             font-size: 16px; font-weight: 500; }
      button, input, select, textarea { font-family: inherit; }
      /* Every control is a >=46px target — this is used with wet hands. */
      button { min-height: 46px; font-weight: 800; }
      input, select, textarea { min-height: 46px; font-size: 16px; font-weight: 600;
                                color: var(--tm-ink); background-color: #FFFFFF; border-radius: 6px; }
      input:not([type]), input[type="text"], input[type="email"], input[type="password"], input[type="search"],
      input[type="tel"], input[type="url"], input[type="date"], input[type="time"], select, textarea {
        font-size: 16px !important; min-height: 46px;
      }
      input[type="number"] { font-size: 28px !important; font-weight: 800 !important;
                             font-variant-numeric: tabular-nums; min-height: 46px; padding-top: 4px !important; padding-bottom: 4px !important;
                             /* Three 28px digits always fit, whatever width an inline style asks for. */
                             min-width: 78px; appearance: textfield; -moz-appearance: textfield; }
      /* Desktop spin arrows eat ~15px of a narrow box and are too small to tap
         with wet hands anyway — everyone types the number. */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="checkbox"], input[type="radio"] { min-height: 0; width: 22px; height: 22px;
                                                    accent-color: var(--tm-ink); }
      input[type="range"], input[type="file"], input[type="color"] { min-height: 0; accent-color: var(--tm-ink); }

      .tm-ride-full .leaflet-top { top: 78px; }
      .tm-follow-map .leaflet-top.leaflet-left { top: 74px; }
      input::placeholder, textarea::placeholder { color: #9AA0A8; opacity: 1; font-style: italic; font-weight: 400;

      input:focus, select:focus, textarea:focus { outline: 3px solid var(--tm-ink); outline-offset: 1px; }

    <script>
      // Loading screen: the water in the stopwatch keeps moving until the app is ready.
      (function () {
        var waves = document.querySelectorAll("#splash-mark .spl-wave");
        window.__splashStart = performance.now(); window.__splashLoop = 1500; window.__splashEnd = 1;
        var t0 = window.__splashStart;
        function frame(now) {
          if (!document.getElementById("splash")) return;
          var x = ((now - t0) % 1500) / 1500 * 18;
          waves[0].setAttribute("transform", "translate(" + x + " 0)");
          waves[1].setAttribute("transform", "translate(" + (-x) + " 0)");
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();

      // LOGO_B64 is defined in the preceding plain <script> tag (keeps Babel fast)


      // ── Race codes people can say out loud ───────────────────────────────────
      // Four characters at most, so a code is quick to type on a phone and fits
      // anywhere it's shown: a short word and a digit ("FOX7") or a 4-letter word
      // ("WOLF"). All kid-safe; no 0 or 1, which read like O and I.
      const CODE_MAX = 4;
      const FRIENDLY_WORDS3 = ["FOX","OWL","CUB","BEE","ANT","ELK","YAK","EMU","BAT","RAM","HEN","JAY","COD","EEL","KOI",
        "APE","DOG","CAT","PIG","COW","SUN","SKY","ICE","GEM","ACE","JET","ZAP","POP","FUN","ZIP","SEA","BAY","OAK","FIN"];
      const FRIENDLY_WORDS4 = ["WOLF","HAWK","LION","ORCA","PUMA","STAR","WAVE","BEAR","LAKE","FROG","DUCK","SEAL","KITE",
        "MOON","SWIM","BIKE","RACE","ZOOM","DASH","GOAL","LEAP","TIDE","REEF","DOVE","LYNX","TUNA","CRAB","MOTH","WREN"];
      // Codes the app suggested (not typed) — if one turns out to be taken,
      // the code check quietly swaps in another.
      const SUGGESTED_CODES = new Set();
      function friendlyCode() {
        const pick = (a) => a[Math.floor(Math.random() * a.length)];
        const c = Math.random() < 0.6 ? pick(FRIENDLY_WORDS3) + String(2 + Math.floor(Math.random() * 8)) : pick(FRIENDLY_WORDS4);
        SUGGESTED_CODES.add(c);
        return c;
      }
      // What people type is forgiving: "tigers 24", "Tigers-24" and "TIGERS24"

      function normCode(s) { return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12); }

        if (c.length < 3) return "At least 3 letters or numbers.";

        return null;

      function calcAge(dob) {
        if (!dob) return null;
        const d = new Date(dob), today = new Date();
        let age = today.getFullYear() - d.getFullYear();
        if (today.getMonth() - d.getMonth() < 0 || (today.getMonth() === d.getMonth() && today.getDate() < d.getDate())) age--;
        return age;
      }

      function placeSuffix(n) {
        if (n === 11 || n === 12 || n === 13) return `${n}th`;
        const s = ["th","st","nd","rd"];
        return `${n}${s[n % 10] || s[0]}`;
      }

      

      function totalChipTime(athlete) {
        if (athlete.dnf) return null;   // did not finish: no time, no place
        const last = athlete.splits[SEGMENTS.length - 1];
        if (last === null || athlete.startOffset === null) return null;
        return last - athlete.startOffset;
      }

      

      // Firebase doesn't store empty lists, and can hand a list back as an object,
      // so a race saved with no athletes comes back with no "athletes" at all.
      // Everything that reads saved races and meets goes through these first.
      function asList(x) {
        if (Array.isArray(x)) return x.filter(v => v != null);
        return (x && typeof x === "object") ? Object.values(x).filter(v => v != null) : [];
      }
      
      function normSavedMeets(list) {
        return asList(list).map(m => ({ ...m,
          events: asList(m.events).map(ev => ({ ...ev, heats: asList(ev.heats).map(h => ({ ...h, lanes: asList(h.lanes) })) })),
          meetEntries: asList(m.meetEntries) }));
      }

      
      
      
      

      
      
      

      
      

      

      // ── Swim meet helpers ─────────────────────────────────────────────────────
      function formatSwimTime(ms) {
        if (ms == null) return "--:--.--";
        const totalSec = Math.floor(ms / 1000);
        const mins = Math.floor(totalSec / 60);
        const secs = totalSec % 60;
        const hh   = Math.floor((ms % 1000) / 10);
        if (mins > 0) return `${mins}:${String(secs).padStart(2,"0")}.${String(hh).padStart(2,"0")}`;
        return `:${String(secs).padStart(2,"0")}.${String(hh).padStart(2,"0")}`;
      }

      function parseSeedTime(str) {
        if (!str || str === "NT" || str === "") return null;
        const clean = str.trim().replace(/^:/, "0:");
        const m1 = clean.match(/^(\d+):(\d{2})\.(\d{2})$/);
        if (m1) return (parseInt(m1[1])*60 + parseInt(m1[2]))*1000 + parseInt(m1[3])*10;
        const m2 = clean.match(/^(\d{1,2})\.(\d{2})$/);
        if (m2) return parseInt(m2[1])*1000 + parseInt(m2[2])*10;
        return null;
      }

      function genderLabel(g) {
        if (g === "F" || g === "f") return "Girls";
        if (g === "M" || g === "m") return "Boys";
        return "Mixed";
      }

      function ageGroupLabel(min, max) {
        if (max <= 8) return "8 & Under";
        if (min >= 9 && max <= 10) return "9-10";
        if (min >= 11 && max <= 12) return "11-12";
        if (min >= 13 && max <= 14) return "13-14";
        if (min >= 15 && max <= 18) return "15-18";
        return "Open";
      }

      function strokeLabel(s) {
        const map = { "1":"Freestyle","F":"Freestyle","2":"Backstroke","B":"Backstroke",
          "3":"Breaststroke","R":"Breaststroke","4":"Butterfly","Y":"Butterfly",
          "5":"IM","I":"IM","6":"Medley Relay","M":"Medley Relay" };
        return map[s] || s || "Freestyle";
      }

      function courseLabel(c) {
        if (c === "Y" || c === "y") return "25y";
        if (c === "S" || c === "s") return "25m";
        if (c === "M" || c === "m") return "50m";
        return c || "25y";
      }

      function parseHy3(text) {
        const lines = text.split(/\r?\n/);
        let meetName = "";
        const events = {};
        const swimmers = {}; // key: "firstName|lastName|team"
        let idCounter = 0;
        for (const line of lines) {
          if (line.length < 2) continue;
          const rec = line.substring(0, 2);
          if (rec === "A0") {
            meetName = line.substring(2, 32).trim();
          } else if (rec === "B1") {
            const eventNum  = parseInt(line.substring(2, 6).trim(), 10);
            const gender    = line.substring(6, 7);
            const minAge    = parseInt(line.substring(7, 9).trim() || "0", 10);
            const maxAge    = parseInt(line.substring(9, 11).trim() || "99", 10);
            const distance  = parseInt(line.substring(11, 15).trim(), 10);
            const course    = line.substring(15, 16);
            const strokeCode = line.substring(16, 17);
            if (!isNaN(eventNum)) {
              events[eventNum] = {
                eventNum, gender: genderLabel(gender),
                ageGroup: ageGroupLabel(minAge, maxAge),
                distance: isNaN(distance) ? 100 : distance,
                course: courseLabel(course),
                stroke: strokeLabel(strokeCode),
                heats: {}
              };
            }
          } else if (rec === "C1") {
            const lastName  = line.substring(2, 22).trim();
            const firstName = line.substring(22, 37).trim();
            const age       = parseInt(line.substring(38, 40).trim() || "0", 10);
            const team      = line.substring(40, 62).trim();
            const eventNum  = parseInt(line.substring(62, 66).trim(), 10);
            const heatNum   = parseInt(line.substring(66, 68).trim(), 10);
            const lane      = parseInt(line.substring(68, 70).trim(), 10);
            const seedRaw   = line.substring(70, 78).trim();
            const seedMs    = seedRaw ? parseInt(seedRaw, 10) * 10 : null;
            const seedTime  = seedMs ? formatSwimTime(seedMs) : "NT";
            if (!events[eventNum]) continue;
            if (!events[eventNum].heats[heatNum]) events[eventNum].heats[heatNum] = { heatNum, lanes: [] };
            events[eventNum].heats[heatNum].lanes.push({
              lane: isNaN(lane) ? 1 : lane, lastName, firstName,
              name: `${firstName} ${lastName}`.trim(),
              age: isNaN(age) ? 0 : age,
              team, seedTime, seedMs, finalMs: null, dq: false, scratch: false
            });
            // Build meet roster entry
            const swKey = `${firstName}|${lastName}|${team}`;
            if (!swimmers[swKey]) {
              swimmers[swKey] = {
                id: `me_imp_${++idCounter}`,
                athleteId: null,
                name: `${firstName} ${lastName}`.trim(),
                firstName, lastName, team,
                age: isNaN(age) ? 0 : age,
                gender: events[eventNum]?.gender || "Girls",
                ageGroup: events[eventNum]?.ageGroup || "Open",
                events: []
              };
            }
            if (!swimmers[swKey].events.some(e => e.eventNum === eventNum)) {
              swimmers[swKey].events.push({ eventNum, seedMs, seedTime });
            }
          }
        }
        return {
          meetName,
          events: Object.values(events).map(ev => ({
            ...ev,
            heats: Object.values(ev.heats).sort((a,b) => a.heatNum - b.heatNum)
          })).sort((a,b) => a.eventNum - b.eventNum),
          meetEntries: Object.values(swimmers)
        };
      }

      // ── Hy-Tek meet events (.hyv) ─────────────────────────────────────────────
      // The "Meet Events" file Meet Manager sends out (inside a .zip, next to an
      // .ev3): one header line, then one line per event, ";"-separated:
      //   header: name;start;end;age-up date;course (Y/S/L);facility;;software;version;CN;check
      //   event:  number (may be "9A");F;F/M/X;I/R;min age;max age;distance;stroke 1-5;…
      // Stroke 1 Free, 2 Back, 3 Breast, 4 Fly, 5 IM (on a relay, 1 = free relay,
      // 5 = medley relay). Min age 0 means "& under"; max age 0 means "& over"
      // (0 and 0 = open).
      // Events keep Hy-Tek's label ("9A") for display; eventNum stays a plain
      // 1, 2, 3… in file order, because it's used in keys and sorting.
      const HY_STROKES = { 1: "Freestyle", 2: "Backstroke", 3: "Breaststroke", 4: "Butterfly", 5: "IM" };
      function hyAgeLabel(min, max) {
        if (!(min > 0) && !(max > 0 && max < 99)) return "Open";
        if (!(min > 0)) return `${max} & Under`;
        if (!(max > 0) || max >= 99) return `${min} & Over`;
        return min === max ? String(min) : `${min}-${max}`;
      }
      function ageRangeOf(label) {
        const t = String(label || "").toLowerCase();
        let m;
        if ((m = t.match(/(\d+)\s*(&|and)\s*under/))) return [0, +m[1]];
        if ((m = t.match(/(\d+)\s*(&|and)\s*(over|up)/))) return [+m[1], 109];
        if ((m = t.match(/(\d+)\s*-\s*(\d+)/))) return [+m[1], +m[2]];
        if ((m = t.match(/^\s*(\d+)\s*$/))) return [+m[1], +m[1]];
        return [0, 109];
      }
      function evLabel(ev) { return ev ? (ev.eventLabel || String(ev.eventNum)) : ""; }
      function parseHyv(text) {
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (!lines.length) throw new Error("That file is empty.");
        const h = lines[0].split(";");
        const usDate = d => { const m = String(d || "").match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? `${m[3]}-${m[1]}-${m[2]}` : ""; };
        const course = { Y: "25y", S: "25m", L: "50m" }[(h[4] || "").trim().toUpperCase()] || "25y";
        const events = [];
        for (const line of lines.slice(1)) {
          const c = line.split(";");
          const label = (c[0] || "").trim();
          if (!/^\d+[A-Za-z]?$/.test(label)) continue;
          const relay = (c[3] || "").trim().toUpperCase() === "R";
          const min = parseInt(c[4], 10) || 0, max = parseInt(c[5], 10) || 0;
          const strokeNum = parseInt(c[7], 10) || 1;
          const stroke = relay ? (strokeNum === 5 ? "Medley Relay" : "Freestyle Relay") : (HY_STROKES[strokeNum] || "Freestyle");
          events.push({ eventNum: events.length + 1, eventLabel: label,
            gender: genderLabel((c[2] || "").trim()), ageGroup: hyAgeLabel(min, max), minAge: min, maxAge: max,
            distance: parseInt(c[6], 10) || 25, stroke, relay, course, heats: [], entries: [] });
        }
        if (!events.length) throw new Error("No events found in that file. Pick the Meet Events file (.hyv, or the .zip it came in).");
        return { meetName: (h[0] || "").trim(), date: usDate(h[1]), ageUpDate: usDate(h[3]), facility: (h[5] || "").trim(), course, events };
      }
      // A Hy-Tek-style events file from this meet, so another host (or Meet
      // Manager) can start from the same events. Events only — no swimmers.
      function buildHyv(meet) {
        const d = (meet.date || new Date().toLocaleDateString("en-CA")).split("-");   // en-CA = YYYY-MM-DD, local day
        const us = `${d[1]}/${d[2]}/${d[0]}`;
        const clean = v => String(v == null ? "" : v).replace(/[;\r\n]/g, " ").trim();
        const courseCode = { "25y": "Y", "25m": "S", "50m": "L" }[meet.pool || "25y"] || "Y";
        const strokeCode = st => {
          const t = String(st || "").toLowerCase();
          if (t.includes("medley")) return 5;
          if (t.includes("relay")) return 1;
          return { freestyle: 1, backstroke: 2, breaststroke: 3, butterfly: 4, im: 5 }[t] || 1;
        };
        const sex = g => /^g|^w|^f/i.test(g || "") ? "F" : /^b|^m(?!ix)/i.test(g || "") ? "M" : "X";
        const out = [[clean(meet.meetName) || "Swim Meet", us, us, us, courseCode, clean(meet.facility), "", "swimmeet.studio", "1.0", "CN", "0000"].join(";")];
        meet.events.forEach(ev => {
          const [min, max] = ev.minAge != null ? [ev.minAge, ev.maxAge] : ageRangeOf(ev.ageGroup);
          const relay = ev.relay || /relay/i.test(ev.stroke || "");
          out.push([evLabel(ev), "F", sex(ev.gender), relay ? "R" : "I", min || 0, max >= 99 ? 0 : (max || 0), ev.distance || 25, strokeCode(ev.stroke), "", "", "", "0", "", "", "", "", "", ""].join(";"));
        });
        return out.join("\r\n") + "\r\n";
      }
      // Ready-made meets: events only, from the league's own Hy-Tek meets with
      // club and pool names taken out, plus a few simple formats. Each is also
      // a .hyv in meet-templates/ for coaches to download. "events" holds the

        })));
        let k = 0;
        const nth = { Girls: 0, Boys: 0 };   // each girl and boy gets a different first name
        groups.forEach(([ag, , , , ages]) => ["Girls", "Boys"].forEach(g => {
          for (let i = 0; i < 5; i++, k++) {
            const gi = nth[g]++;
            const fn = first[g][gi], ln = last[(gi * 3) % 10];

              const [lo, hi] = seedRange[ag][ev.stroke];
              const ms = i === 4 && ev.stroke === "Backstroke" ? null : Math.round((lo + rnd() * (hi - lo)) * 100) * 10;
              return { eventNum: ev.eventNum, seedMs: ms, seedTime: ms ? formatSwimTime(ms) : "NT" };

        const lanes = 6;
        events.forEach(ev => {
          ev.entries = entries.filter(s => s.events.some(e => e.eventNum === ev.eventNum)).map(s => {
            const e = s.events.find(x => x.eventNum === ev.eventNum);
            return { name: s.name, firstName: s.firstName, lastName: s.lastName, team: s.team, age: s.age, seedMs: e.seedMs, seedTime: e.seedTime };

          ev.heats = autoSeedEvent(ev, lanes);

      }

      // Meet Manager hands out events as a .zip: open it in the browser and
      // take the .hyv (or entries .hy3/.cl2) inside.
      function loadJSZip() {
        if (window.JSZip) return Promise.resolve(window.JSZip);
        return new Promise((res, rej) => {
          const sc = document.createElement("script");
          sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
          sc.onload = () => res(window.JSZip); sc.onerror = () => rej(new Error("Couldn't open .zip files right now — unzip it and pick the .hyv inside."));

      async function fileFromZip(file) {
        const JSZip = await loadJSZip();
        const zip = await JSZip.loadAsync(file);
        const names = Object.keys(zip.files).filter(n => !zip.files[n].dir);
        const pick = names.find(n => /\.hyv$/i.test(n)) || names.find(n => /\.hy3$/i.test(n)) || names.find(n => /\.cl2$/i.test(n));
        if (!pick) throw new Error("That .zip has no Hy-Tek meet file in it (.hyv, .hy3 or .cl2).");
        return { name: pick.split("/").pop(), text: await zip.files[pick].async("string") };
      }

      function parseSwimCsv(text) {
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length < 2) return { meetName: "Imported Meet", events: [], meetEntries: [] };
        // Header names vary between Hy-Tek/TM exports ("Event" vs "Event Num",
        // "Last Name" vs "lastname"), so match on a space/underscore-stripped form
        // and accept a list of aliases per field.
        const norm = (s) => s.trim().toLowerCase().replace(/[\s_#]+/g, "");
        const headers = lines[0].split(",").map(norm);
        const events = {};
        const swimmers = {};
        let idCounter = 0;
        const autoEventNums = {};   // composite event key → assigned event number
        let autoEventCount = 0;
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(",").map(c => c.trim());
          const get = (...names) => {
            for (const n of names) {
              const j = headers.indexOf(norm(n));
              if (j >= 0 && cols[j]) return cols[j];
            }
            return "";
          };
          const heatNum  = parseInt(get("heat", "heatnum", "heatnumber"), 10) || 1;
          const lane     = parseInt(get("lane"), 10) || 1;
          const seedTimeStr = get("seedtime", "seed");
          const seedMs = parseSeedTime(seedTimeStr);
          const lastName  = get("lastname", "last");
          const firstName = get("firstname", "first");
          const team      = get("team", "club", "school");
          const age       = parseInt(get("age"), 10) || 0;
          const seedTime  = seedMs ? formatSwimTime(seedMs) : (seedTimeStr || "NT");
          const gender    = get("gender", "sex") || "Mixed";
          const ageGroup  = get("agegroup", "division", "div") || "Open";
          const distance  = parseInt(get("distance", "dist"), 10) || 100;
          const stroke    = get("stroke") || "Freestyle";
          const course    = get("course") || "25y";
          // Prefer an explicit event number; otherwise group rows by the event's
          // defining fields so a CSV without an event column doesn't produce one
          // event per swimmer.
          let eventNum = parseInt(get("event", "eventnum", "eventnumber"), 10);
          if (!eventNum) {
            const key = [gender, ageGroup, distance, stroke, course].join("|");
            if (!autoEventNums[key]) autoEventNums[key] = ++autoEventCount;
            eventNum = autoEventNums[key];
          }
          if (!events[eventNum]) {
            events[eventNum] = {
              eventNum, gender, ageGroup, distance, stroke, course,
              heats: {}
            };
          }
          if (!events[eventNum].heats[heatNum]) events[eventNum].heats[heatNum] = { heatNum, lanes: [] };
          events[eventNum].heats[heatNum].lanes.push({
            lane, lastName, firstName,
            name: `${firstName} ${lastName}`.trim(),
            age, team, seedTime, seedMs, finalMs: null, dq: false, scratch: false
          });
          // Build roster entry
          const swKey = `${firstName}|${lastName}|${team}`;
          if (!swimmers[swKey]) {
            swimmers[swKey] = {
              id: `me_imp_${++idCounter}`,
              athleteId: null,
              name: `${firstName} ${lastName}`.trim(),
              firstName, lastName, team, age,
              gender, ageGroup,
              events: []
            };
          }
          if (!swimmers[swKey].events.some(e => e.eventNum === eventNum)) {
            swimmers[swKey].events.push({ eventNum, seedMs, seedTime });
          }
        }
        return {
          meetName: "Imported Meet",
          events: Object.values(events).map(ev => ({
            ...ev,
            heats: Object.values(ev.heats).sort((a,b) => a.heatNum - b.heatNum)
          })).sort((a,b) => a.eventNum - b.eventNum),
          meetEntries: Object.values(swimmers)
        };
      }

      function computeTeamScores(events) {
        const scores = {};
        const pts = [6, 4, 3, 2, 1];
        for (const ev of resultEvents(events)) {
          const allSwimmers = ev.heats.flatMap(h => h.lanes);
          const finishers = allSwimmers
            .filter(s => s.finalMs != null && !s.dq && !s.scratch)
            .sort((a,b) => a.finalMs - b.finalMs);
          finishers.forEach((s, i) => {
            if (i < pts.length) {
              scores[s.team] = (scores[s.team] || 0) + pts[i];
            }
          });
        }
        return Object.entries(scores).sort((a,b) => b[1] - a[1]);
      }

      // Every phone times against Firebase's clock, not its own: the host
      // stamps the start in server time and each lane phone measures from it
      // in server time, so a phone whose clock is a second off still gets the
      // right swim time. (Firebase keeps the offset to its clock up to date.)
      const SERVER_CLOCK = { offset: 0 };
      try { rtdb.ref(".info/serverTimeOffset").on("value", sn => { if (!SERVER_CLOCK.synced) SERVER_CLOCK.offset = sn.val() || 0; }); } catch (_) {}
      function serverNow() { return Date.now() + SERVER_CLOCK.offset; }
      
      
      // Connection lights. Each side writes a heartbeat (server time) every
      // second; the other side shows green only while the latest heartbeat is
      // under HEARTBEAT_STALE_MS old by the shared clock, re-checked 4× a
      // second — so a dropped phone or host goes grey within ~3.5 s on both ends,
      // even on the side that lost signal and can't hear anything. One late
      // beat (a busy phone, a slow write) doesn't flip the light.
      const HEARTBEAT_STALE_MS = 3500;
      SERVER_CLOCK.connected = false;
      try { rtdb.ref(".info/connected").on("value", sn => { SERVER_CLOCK.connected = !!sn.val(); }); } catch (_) {}
      function heartbeatFresh(at) { return !!at && SERVER_CLOCK.connected && serverNow() - at < HEARTBEAT_STALE_MS; }
      // Re-render every 250 ms while some screen needs live connection lights.
      function useTicker(on, ms = 250) {
        const [, setT] = useState(0);
        useEffect(() => { if (!on) return; const id = setInterval(() => setT(t => t + 1), ms); return () => clearInterval(id); }, [on, ms]);
      }
      // Firebase's own offset is a one-shot guess that can be off by the network
      // delay. This measures it: write the server's timestamp, note how long the
      // round trip took, and keep the quickest of six tries. The server's time
      // falls inside that round trip, so the offset is good to half of it
      // (SERVER_CLOCK.err, usually 10-30 ms on deck Wi-Fi or LTE).
      async function syncServerClock(path) {
        let best = null;
        const ref = rtdb.ref(path);
        for (let i = 0; i < 6; i++) {
          const t0 = Date.now();
          try { await ref.set(firebase.database.ServerValue.TIMESTAMP); } catch (_) { return null; }
          const t1 = Date.now();
          const v = await ref.once("value").then(sn => sn.val()).catch(() => null);
          if (typeof v !== "number" || v < 1e12) return null;
          const rtt = t1 - t0;
          if (!best || rtt < best.rtt) best = { rtt, off: v - (t0 + t1) / 2 };
        }
        ref.remove().catch(() => {});
        const err = Math.max(1, Math.round(best.rtt / 2));

        const keepOld = SERVER_CLOCK.synced && Date.now() - SERVER_CLOCK.synced < 15 * 60000 && SERVER_CLOCK.err && SERVER_CLOCK.err < err;

      }

      // The start: "Take your marks" spoken from the host device, then the
      // start tone out of its speaker at the moment the clock starts. The audio
      // context is opened on the first tap so the tone isn't delayed or blocked.
      let startAudio = null;
      function primeStartAudio() {

          if (startAudio.state === "suspended") startAudio.resume();
        } catch (_) {}
      }

          u.rate = 0.85; u.pitch = 0.9; u.volume = 1;
          window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
        } catch (_) {}

      // Start sounds. Electronic start systems play one steady, clean tone (no
      // buzz) that starts and stops sharply. Each sound here is built from sine
      // waves, kept just under full scale so it's as loud as the speaker allows
      // without the crackle of clipping, with a 5 ms fade in/out so it doesn't click.
      const START_SOUNDS = {
        classic: { label: "Electronic start", parts: [[1000, 0.62], [2000, 0.16], [3000, 0.07]], secs: 0.75 },
        horn:    { label: "Deep horn",        parts: [[440, 0.5], [880, 0.24], [1320, 0.12], [1760, 0.06]], secs: 0.9 },
        bright:  { label: "Bright beep",      parts: [[1400, 0.7], [2800, 0.12]], secs: 0.6 },
      };

        try { const k = localStorage.getItem("swim-start-sound"); return START_SOUNDS[k] ? k : "classic"; } catch (_) { return "classic"; }
      }

        primeStartAudio();

          const snd = START_SOUNDS[kind || startSoundChoice()] || START_SOUNDS.classic;

          const out = ctx.createGain();
          const comp = ctx.createDynamicsCompressor();   // catches any peak before it clips
          comp.threshold.value = -3; comp.knee.value = 0; comp.ratio.value = 20; comp.attack.value = 0.001; comp.release.value = 0.05;

          out.gain.linearRampToValueAtTime(0, t + snd.secs);

      }

      function playSwimBeep() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.9, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 1.2);
        } catch(e) {}
      }

      function generateSwimCode() {
        return friendlyCode();

      function getLaneOrder(numLanes) {
        const order = [];
        const center = Math.ceil(numLanes / 2);
        order.push(center);
        let left = center - 1, right = center + 1;
        while (order.length < numLanes) {
          if (right <= numLanes) { order.push(right); right++; }
          if (left >= 1 && order.length < numLanes) { order.push(left); left--; }
        }
        return order;
      }

      function autoSeedEvent(event, numLanes) {
        let rawEntries;
        if (event.entries && event.entries.length > 0) {
          rawEntries = event.entries;
        } else {
          rawEntries = event.heats.flatMap(h => h.lanes).filter(l => l.name && l.name.trim());
        }
        if (rawEntries.length === 0) return event.heats;

        const timed = rawEntries.filter(e => e.seedMs != null).sort((a, b) => a.seedMs - b.seedMs);
        const nt = rawEntries.filter(e => e.seedMs == null).sort(() => Math.random() - 0.5);
        const allSorted = [...nt, ...[...timed].reverse()];

        const numHeats = Math.max(1, Math.ceil(allSorted.length / numLanes));
        const laneOrder = getLaneOrder(numLanes);
        const heats = [];

        for (let hi = 0; hi < numHeats; hi++) {
          const chunk = allSorted.slice(hi * numLanes, (hi + 1) * numLanes);
          const sortedChunk = [...chunk].sort((a, b) => (a.seedMs ?? Infinity) - (b.seedMs ?? Infinity));
          const lanes = sortedChunk.map((sw, idx) => ({
            lane: laneOrder[idx],
            name: sw.name || `${sw.firstName||""} ${sw.lastName||""}`.trim(),
            firstName: sw.firstName || (sw.name||"").split(" ")[0] || "",
            lastName: sw.lastName || (sw.name||"").split(" ").slice(1).join(" ") || "",
            team: sw.team || "",
            age: sw.age || 0,
            seedTime: sw.seedMs ? formatSwimTime(sw.seedMs) : "NT",
            seedMs: sw.seedMs || null,
            entryId: sw.id || null, legs: sw.legs || null, fromEvent: sw.fromEvent || null,
            finalMs: null, dq: false, scratch: false
          })).sort((a, b) => a.lane - b.lane);
          heats.push({ heatNum: hi + 1, lanes });
        }
        return heats;
      }

      function eventKey(ev) {
        return `${ev.distance}_${ev.stroke}_${ev.course||"25y"}`;

      function btnStyle(color, outline = false) {
        const meaningful = color === TM.live || color === TM.warn || color === TM.bike;
        const c = meaningful ? color : TM.ink;

          border: `3px solid ${c}`,
          color: outline ? c : "#FFFFFF",
          minHeight: outline ? 46 : 56,
          padding: "8px 20px",
          borderRadius: 6,
          fontFamily: "var(--tm-font)",
          fontWeight: 800,
          fontSize: 17,

      // ── App ──────────────────────────────────────────────────────────────────
      // ── Swim meet entries: teams, swimmers, relays, files, printouts ──────────
      // A meet carries:
      //   teams     [{ code: "COOP", name: "Cooper Cyclones" }]  (code = short name)
      //   ageUpDate "YYYY-MM-DD" — swimmers' ages count as of this day
      //   meetEntries [{ id, athleteId, name, team (code), gender, age, dob, events: [{ eventNum, seedMs, seedTime }] }]
      //   relays    [{ id, eventNum, team, letter, legs: [{ id, name, age }], seedMs, seedTime }]
      //   meetUid   random id, so entry files from coaches match the right meet
      // Each event's `entries` are rebuilt from meetEntries + relays whenever
      // they change, so 🌱 Seed always seeds what's entered.

      function swimAgeOn(sw, dateStr) {
        if (sw && sw.dob && dateStr) {
          const b = new Date(sw.dob + "T12:00:00"), d = new Date(dateStr + "T12:00:00");
          if (!isNaN(b) && !isNaN(d)) {
            let a = d.getFullYear() - b.getFullYear();
            if (d.getMonth() < b.getMonth() || (d.getMonth() === b.getMonth() && d.getDate() < b.getDate())) a--;
            return a;

      function evAgeRange(ev) {
        if (ev.minAge != null || ev.maxAge != null) return [ev.minAge || 0, ev.maxAge && ev.maxAge < 99 ? ev.maxAge : 0];
        const [lo, hi] = ageRangeOf(ev.ageGroup);
        return [lo || 0, hi >= 99 ? 0 : hi];
      }

        const age = swimAgeOn(sw, ageDate);
        if (age == null) return true;   // no age on file: let the coach decide
        const [lo, hi] = evAgeRange(ev);

            legs: r.legs || [], seedMs: r.seedMs || null, seedTime: r.seedMs ? formatSwimTime(r.seedMs) : "NT" }));

          const e = s.events.find(x => x.eventNum === ev.eventNum);
          return { id: s.id, name: s.name, firstName: s.firstName || "", lastName: s.lastName || "", team: s.team || "",

      }

      // ── Meet-day changes: no-shows, scratches, added events, relay swaps, combined events ──
      const laneSwum = l => l.finalMs != null || !!l.dq;

      // `hold` = { eventNum, heatNum } the host has open: that heat is never moved.
      function applyRosterChanges(meet, hold) {

                      {!newSw.dob && (
                        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                          <span style={TM_CAPTION}>No birthday handy? Age for now:</span>

                        <button onClick={() => setNewSw(null)} style={{ ...btnStyle(TM.ink, true), fontSize: 15, padding: "0 16px" }}>Cancel</button>
                      </div>
                    </div>
                  ) : (
                    <button onClick={() => setNewSw({ name: "", gender: "Girls", age: "", dob: "" })} style={{ ...btnStyle(TM.ink, true), width: "100%", fontSize: 15 }}>+ New {cur} swimmer</button>
                  )}
                </div>
              )}

              {tab === "events" && (
                <div>
                  <select value={evPick ?? ""} onChange={e => setEvPick(e.target.value ? +e.target.value : null)} aria-label="Event" style={{ ...input, marginBottom: 10 }}>
                    <option value="">Pick an event…</option>
                    {indivEvents.map(ev => <option key={ev.eventNum} value={ev.eventNum}>#{evLabel(ev)} {ev.gender} {ev.ageGroup} {ev.distance} {ev.stroke}</option>)}

              {tab === "relays" && (

                  {relayEvents.length === 0 ? <div style={{ ...rowStyle(), ...TM_CAPTION }}>This meet has no relay events.</div> : (<>
                    <select value={relayPick ?? ""} onChange={e => setRelayPick(e.target.value ? +e.target.value : null)} aria-label="Relay event" style={{ ...input, marginBottom: 10 }}>
                      <option value="">Pick a relay…</option>
                      {relayEvents.map(ev => <option key={ev.eventNum} value={ev.eventNum}>#{evLabel(ev)} {ev.gender} {ev.ageGroup} {ev.distance} {ev.stroke}</option>)}
                    </select>
                    <label style={{ display: "flex", alignItems: "center", gap: 10, ...rowStyle(ageUp ? TM.warn : undefined), marginBottom: 10, cursor: "pointer" }}>
                      <input type="checkbox" checked={ageUp} onChange={e => setAgeUp(e.target.checked)} style={{ width: 22, height: 22 }} />
                      <span><b>Age up</b><span style={{ display: "block", ...TM_CAPTION }}>Let younger swimmers fill an older relay</span></span>
                    </label>
                    {relayPick != null && (() => {
                      const ev = meet.events.find(x => x.eventNum === relayPick);
                      if (!ev) return null;
                      const elig = roster.filter(r => swimQualifies(r.sw, ev, ageDate, ageUp));
                      const mine = (meet.relays || []).filter(r => r.eventNum === ev.eventNum && r.team === cur);
                      const setRelay = (id, fn) => update(m => ({ ...m, relays: (m.relays || []).map(r => r.id === id ? fn(r) : r) }));
                      return (<>
                        {mine.map(r => {
                          const used = new Set(mine.flatMap(x => x.legs.map(l => l && l.id)).filter(Boolean));
                          return (
                            <div key={r.id} style={{ ...rowStyle(TM.swim), marginBottom: 8 }}>
                              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                <b style={{ flex: 1, fontSize: 16 }}>{cur} {r.letter}</b>
                                <button onClick={() => update(m => ({ ...m, relays: (m.relays || []).filter(x => x.id !== r.id) }))} style={{ ...btnStyle(TM.live, true), minHeight: 36, fontSize: 14, padding: "0 10px" }}>Remove</button>
                              </div>
                              {[0, 1, 2, 3].map(i => (
                                <select key={i} value={(r.legs[i] && r.legs[i].id) || ""} aria-label={`Leg ${i + 1}`}
                                  onChange={e => { const s = elig.find(x => x.key === e.target.value); setRelay(r.id, x => { const legs = [...x.legs]; legs[i] = s ? { id: s.key, name: s.sw.name, age: swimAgeOn(s.sw, ageDate) } : null; return { ...x, legs }; }); }}
                                  style={{ ...input, marginTop: 6 }}>
                                  <option value="">Leg {i + 1} — pick a swimmer</option>
                                  {elig.filter(s => !used.has(s.key) || (r.legs[i] && r.legs[i].id === s.key)).map(s => <option key={s.key} value={s.key}>{s.sw.name} ({swimAgeOn(s.sw, ageDate) ?? "?"})</option>)}
                                </select>
                              ))}
                              <input defaultValue={r.seedMs ? formatSwimTime(r.seedMs) : ""} placeholder="Relay seed time (NT)" aria-label="Relay seed time"
                                onBlur={e => { const ms = parseSeedTime(e.target.value) || null; setRelay(r.id, x => ({ ...x, seedMs: ms, seedTime: ms ? formatSwimTime(ms) : "NT" })); }}
                                style={{ ...input, marginTop: 6 }} />
                            </div>
                          );
                        })}
                        <button onClick={() => update(m => ({ ...m, relays: [...(m.relays || []), { id: newId("rl"), eventNum: ev.eventNum, team: cur,
                            letter: String.fromCharCode(65 + mine.length), legs: [null, null, null, null], seedMs: null, seedTime: "NT" }] }))}
                          style={{ ...btnStyle(TM.ink, true), width: "100%", fontSize: 15 }}>+ {cur} relay {String.fromCharCode(65 + mine.length)}</button>
                        <div style={{ ...TM_CAPTION, marginTop: 6 }}>{elig.length} {cur} swimmer{elig.length === 1 ? "" : "s"} can swim this relay{ageUp ? " with age-up" : ""}.</div>
                      </>);
                    })()}
                  </>)}
                </div>
              )}
            </>)}
          </div>
        );
      }

      // ── Send / receive files and print (phone-first) ──
      function SwimShareCard({ meet, setMeet, onImport, onSeed, onOpenFiles }) {
        const teams = meet.teams || [];
        const [team, setTeam] = useState(() => { try { return localStorage.getItem("swim-my-team") || ""; } catch (_) { return ""; } });
        const cur = teams.find(t => t.code === team) ? team : (teams[0] ? teams[0].code : "");
        const [msg, setMsg] = useState(null);
        const fileRef = useRef(null);
        const seeded = meet.events.some(ev => ev.heats.some(h => h.lanes.some(l => l.name)));
        const nm = safeFileName(meet.meetName);
        const ensureUid = () => { if (meet.meetUid) return meet; const m = { ...meet, meetUid: newId("meet") }; setMeet(() => m); return m; };
        const send = async (kind) => {
          const m = ensureUid();
          const label = kind === "meet" ? "events" : kind === "entries" ? `${cur} entries` : "program";
          const how = await shareOrDownload(`${nm} - ${label}.json`, meetFileText(m, kind, cur));
          if (how !== "cancelled") setMsg({ ok: true, text: how === "shared" ? `Shared the ${label} file.` : `Saved “${nm} - ${label}.json” — send it by text or email.` });
        };
        const btn = (primary) => ({ ...btnStyle(TM.ink, !primary), width: "100%", fontSize: 15, minHeight: 48 });
        const step = { fontSize: 13, fontWeight: 800, letterSpacing: 1, textTransform: "uppercase", color: TM.inkMuted, margin: "12px 0 6px" };
        return (
          <div style={{ ...rowStyle(TM.swim), display: "flex", flexDirection: "column", gap: 8 }}>
            <div style={{ fontSize: 17, fontWeight: 900 }}>Files &amp; printouts</div>
            <button onClick={onOpenFiles} style={btn(true)}>📁 Import &amp; export — swimmers, events, entries, program, results</button>
            <button onClick={() => { onSeed(); setMsg({ ok: true, text: "Heats and lanes are set from everyone's entries." }); }} disabled={!meet.events.length} style={btn(false)}>🌱 Seed heats from all entries</button>
            {msg && <div role="status" style={{ ...rowStyle(msg.ok ? TM.run : TM.live), fontSize: 15, fontWeight: 700 }}>{msg.ok ? "✓ " : "✕ "}{msg.text}</div>}
            <div style={step}>Print (opens a page to print or save as PDF)</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button disabled={!seeded} onClick={() => openPrintout(`${meet.meetName || "Swim Meet"} — Heat sheet`, meetSubtitle(meet), heatSheetHtml(meet))} style={{ ...btn(false), flex: "1 1 45%", opacity: seeded ? 1 : 0.5 }}>Heat sheet</button>
              <button onClick={() => openPrintout(`${meet.meetName || "Swim Meet"} — Psych sheet`, meetSubtitle(meet), psychSheetHtml(meet))} style={{ ...btn(false), flex: "1 1 45%" }}>Psych sheet</button>
              <button disabled={!seeded} onClick={() => openPrintout(`${meet.meetName || "Swim Meet"} — Lane timer sheets`, meetSubtitle(meet), laneSheetsHtml(meet))} style={{ ...btn(false), flex: "1 1 45%", opacity: seeded ? 1 : 0.5 }}>Lane timer sheets</button>
              <button disabled={!seeded || !cur} onClick={() => openPrintout(`${swimTeamName(meet, cur)} — events, heats & lanes`, meet.meetName || "", teamListHtml(meet, cur))} style={{ ...btn(false), flex: "1 1 45%", opacity: seeded && cur ? 1 : 0.5 }}>{cur || "Team"} list</button>
            </div>

      // ── Typing in times from the timers' sheets ──────────────────────────────
      // Digits only is quickest on a keypad: 2345 → 23.45, 10345 → 1:03.45.
      // "23.45" and "1:03.45" work too.
      function parseTypedTime(str) {
        const s = String(str || "").trim();
        if (!s) return null;
        if (/[:.]/.test(s)) return parseSeedTime(s) || null;
        const d = s.replace(/\D/g, "");
        if (!d) return null;
        const hund = +d.slice(-2), rest = d.slice(0, -2) || "0";
        const secs = +rest.slice(-2), mins = +(rest.slice(0, -2) || "0");
        if (secs >= 60) return null;
        return ((mins * 60 + secs) * 100 + hund) * 10;
      }
      // Official time from the watches: one watch is the time; two are averaged
      // and cut to the hundredth; three use the middle time.
      function officialTime(watches) {
        const w = watches.filter(x => x != null).sort((a, b) => a - b);
        if (!w.length) return null;
        if (w.length === 1) return w[0];
        if (w.length === 2) return Math.floor((w[0] + w[1]) / 2 / 10) * 10;
        return w[1];
      }
      function SwimTimeBox({ value, label, onCommit, idx }) {
        const [txt, setTxt] = useState(value != null ? formatSwimTime(value) : "");
        const commit = () => { const ms = parseTypedTime(txt); setTxt(ms != null ? formatSwimTime(ms) : ""); if (ms !== value) onCommit(ms); };
        return <input value={txt} inputMode="numeric" placeholder="—" aria-label={label} data-timebox={idx}
          onChange={e => setTxt(e.target.value)} onBlur={commit}
          onFocus={e => e.target.select()}
          onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); commit(); const next = document.querySelector(`[data-timebox="${idx + 1}"]`); if (next) next.focus(); else e.target.blur(); } }}
          style={{ width: 86, background: "#FFFFFF", border: `2px solid ${TM.line}`, borderRadius: 6, padding: "8px 8px", fontSize: 17, textAlign: "right", fontVariantNumeric: "tabular-nums", boxSizing: "border-box" }} />;
      }
      function SwimTimesEntry({ meet, setMeet }) {
        const [watches, setWatchesRaw] = useState(() => { try { return +localStorage.getItem("swim-watch-count") || 1; } catch (_) { return 1; } });
        const setWatches = n => { setWatchesRaw(n); try { localStorage.setItem("swim-watch-count", String(n)); } catch (_) {} };
        const [mode, setModeRaw] = useState(() => { try { return localStorage.getItem("swim-times-mode") || "lane"; } catch (_) { return "lane"; } });
        const setMode = m => { setModeRaw(m); try { localStorage.setItem("swim-times-mode", m); } catch (_) {} };
        const [lane, setLane] = useState(1);
        const [evNum, setEvNum] = useState(() => (meet.events[0] || {}).eventNum);
        const nLanes = meet.lanes || 8;
        const chip = on => ({ ...btnStyle(TM.ink, !on), minHeight: 44, padding: "0 12px", fontSize: 16 });
        const patchLane = (en, hn, ln, fn) => setMeet(m => ({ ...m, events: m.events.map(ev => ev.eventNum !== en ? ev : {
          ...ev, heats: ev.heats.map(h => h.heatNum !== hn ? h : { ...h, lanes: h.lanes.map(l => l.lane !== ln ? l : fn(l)) }) }) }));
        const setWatch = (ev, h, l, k, ms) => patchLane(ev.eventNum, h.heatNum, l.lane, x => {
          const nx = { ...x, [k]: ms };
          return { ...nx, finalMs: officialTime([nx.watch1, nx.watch2, nx.watch3]) };
        });

        // rows in the order they're on the timer sheets
        let rows = [];
        if (mode === "lane") {
          meet.events.forEach(ev => ev.heats.forEach(h => { const l = h.lanes.find(x => x.lane === lane && x.name); if (l) rows.push({ ev, h, l }); }));
        } else {
          const ev = meet.events.find(e => e.eventNum === evNum);
          if (ev) ev.heats.forEach(h => h.lanes.filter(l => l.name).sort((a, b) => a.lane - b.lane).forEach(l => rows.push({ ev, h, l })));
        }
        const done = rows.filter(r => r.l.finalMs != null || r.l.dq || r.l.scratch).length;
        const laneDone = n => { let t = 0, d = 0; meet.events.forEach(ev => ev.heats.forEach(h => { const l = h.lanes.find(x => x.lane === n && x.name); if (l) { t++; if (l.finalMs != null || l.dq || l.scratch) d++; } })); return [d, t]; };

        return (
          <div>
            <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
              <button onClick={() => setMode("lane")} aria-pressed={mode === "lane"} style={{ ...chip(mode === "lane"), flex: 1 }}>Lane by lane</button>
              <button onClick={() => setMode("event")} aria-pressed={mode === "event"} style={{ ...chip(mode === "event"), flex: 1 }}>Event by event</button>
            </div>
            <div role="radiogroup" aria-label="Watches per lane" style={{ display: "flex", gap: 6, marginBottom: 10, alignItems: "center", flexWrap: "wrap" }}>
              <b style={{ fontSize: 15 }}>Watches per lane</b>
              {[1, 2, 3].map(n => <button key={n} role="radio" aria-checked={watches === n} onClick={() => setWatches(n)} style={{ ...chip(watches === n), minHeight: 40, padding: "0 14px" }}>{n}</button>)}
            </div>
            {mode === "lane" ? (
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
                {Array.from({ length: nLanes }, (_, i) => i + 1).map(n => {
                  const [d, t] = laneDone(n);
                  return <button key={n} onClick={() => setLane(n)} aria-pressed={lane === n} style={{ ...chip(lane === n), flexDirection: "column", lineHeight: 1.1, padding: "4px 12px" }}>
                    <span>Lane {n}</span><span style={{ fontSize: 12, fontWeight: 700 }}>{t ? `${d}/${t}` : "—"}</span></button>;
                })}
              </div>
            ) : (
              <select value={evNum ?? ""} onChange={e => setEvNum(+e.target.value)} aria-label="Event"
                style={{ width: "100%", background: "#FFFFFF", border: `2px solid ${TM.line}`, borderRadius: 6, padding: "10px 12px", fontSize: 16, marginBottom: 10 }}>
                {meet.events.map(ev => <option key={ev.eventNum} value={ev.eventNum}>#{evLabel(ev)} {ev.gender} {ev.ageGroup} {ev.distance} {ev.stroke}</option>)}
              </select>
            )}
            <div style={{ ...TM_CAPTION, marginBottom: 8 }}>
              Type the watch times as digits — 2345 is 23.45, 10345 is 1:03.45. Enter goes to the next box.{watches === 2 ? " Two watches are averaged." : watches === 3 ? " With three watches the middle time counts." : ""}
              {rows.length > 0 && <b> {done} of {rows.length} done.</b>}
            </div>
            {rows.length === 0 && <div style={{ ...rowStyle(), ...TM_CAPTION }}>{mode === "lane" ? `Nobody is seeded in lane ${lane}.` : "Nobody is seeded in this event."} Seed the meet first.</div>}
            {rows.map(({ ev, h, l }, i) => (
              <div key={`${ev.eventNum}-${h.heatNum}-${l.lane}`} style={{ ...rowStyle(l.finalMs != null ? TM.run : l.dq ? TM.live : undefined), marginBottom: 6, padding: "8px 10px" }}>
                <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
                  <b style={{ fontSize: 15, whiteSpace: "nowrap" }}>{mode === "lane" ? `E${evLabel(ev)} · H${h.heatNum}` : `H${h.heatNum} · L${l.lane}`}</b>
                  <span style={{ flex: 1, fontSize: 15, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{l.name}</span>
                  <span style={TM_CAPTION}>{l.team}</span>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 6, flexWrap: "wrap" }}>
                  {[1, 2, 3].slice(0, watches).map(k => (
                    <SwimTimeBox key={`w${k}-${l["watch" + k]}`} idx={i * watches + k - 1}
                      value={k === 1 ? (l.watch1 ?? (l.watch2 == null && l.watch3 == null ? l.finalMs : null)) : l["watch" + k]}
                      label={`Watch ${k}, ${l.name}`} onCommit={ms => setWatch(ev, h, l, "watch" + k, ms)} />
                  ))}
                  <span style={{ flex: 1, textAlign: "right", fontSize: 18, fontWeight: 900, fontVariantNumeric: "tabular-nums", color: l.dq ? TM.live : TM.ink }}>
                    {l.dq ? "DQ" : l.finalMs != null ? formatSwimTime(l.finalMs) : ""}
                  </span>
                  <button onClick={() => patchLane(ev.eventNum, h.heatNum, l.lane, x => ({ ...x, dq: !x.dq }))} aria-pressed={!!l.dq}
                    style={{ ...btnStyle(TM.live, !l.dq), minHeight: 38, padding: "0 10px", fontSize: 14 }}>DQ</button>
                </div>
              </div>
            ))}
          </div>
        );
      }

      // ── Swimmer profiles and results history ─────────────────────────────────
      // A swimmer (swimAthletes) is kept for good: { id, name, firstName,
      // lastName, team (code), gender, dob, age, results: [{ date, meetName,
      // distance, stroke, course, timeMs, place, eventLabel, age }],
      // personalBests: { "50_Freestyle_25y": { ms, time, date, meetName } } }.
      // Age always comes from the birthday when there is one.
      const SDIF_STROKES = { 1: "Freestyle", 2: "Backstroke", 3: "Breaststroke", 4: "Butterfly", 5: "IM" };
      const SDIF_COURSE = { Y: "25y", S: "25m", L: "50m" };
      function normName(s) { return String(s || "").toLowerCase().replace(/[^a-z ]/g, "").replace(/\s+/g, " ").trim(); }
      function ageToday(sw) { return swimAgeOn(sw, new Date().toLocaleDateString("en-CA")); }
      function resultKey(r) { return `${r.distance}_${r.stroke}_${r.course || "25y"}`; }
      function strokeShort(st) { return { Freestyle: "Free", Backstroke: "Back", Breaststroke: "Breast", Butterfly: "Fly" }[st] || st; }
      function bestsOf(sw) {
        const best = {};
        (sw.results || []).forEach(r => {
          if (r.timeMs == null || r.dq) return;
          const k = resultKey(r);
          if (!best[k] || r.timeMs < best[k].ms) best[k] = { ms: r.timeMs, time: formatSwimTime(r.timeMs), date: r.date, meetName: r.meetName };
        });
        Object.entries(sw.personalBests || {}).forEach(([k, pb]) => { if (pb && pb.ms && (!best[k] || pb.ms < best[k].ms)) best[k] = pb; });
        return best;
      }
      // Add swims to swimmer profiles. A swim is { name, firstName, lastName,
      // team, gender, age, dob, distance, stroke, course, timeMs, place, date,
      // meetName, eventLabel, dq }. Swimmers are matched by name and team; new
      // ones are created. The same swim twice (same day and event) is skipped.
      function addSwimsToAthletes(athletes, swims) {
        const list = (athletes || []).map(a => ({ ...a, results: [...(a.results || [])] }));
        let added = 0, created = 0;
        swims.forEach(sw => {
          const nm = normName(sw.name);
          let a = list.find(x => normName(x.name) === nm && sameTeam(x.team, sw.team));
          if (!a) {
            a = { id: newId("swa"), name: sw.name, firstName: sw.firstName || sw.name.split(" ")[0], lastName: sw.lastName || sw.name.split(" ").slice(1).join(" "),
              team: sw.team, gender: sw.gender || "", dob: sw.dob || null, age: sw.age || null, results: [], personalBests: {}, timeHistory: [] };
            list.push(a); created++;
          }
          if (!a.dob && sw.dob) a.dob = sw.dob;
          if (!a.gender && sw.gender) a.gender = sw.gender;
          if (sw.age && (!a.ageOn || (sw.date || "") >= a.ageOn)) { a.age = sw.age; a.ageOn = sw.date || null; }
          if (sw.timeMs == null && !sw.dq) return;
          const dup = a.results.some(r => r.date === sw.date && r.distance === sw.distance && r.stroke === sw.stroke && (r.course || "25y") === (sw.course || "25y") && r.timeMs === sw.timeMs);
          if (dup) return;
          a.results.push({ date: sw.date || null, meetName: sw.meetName || "", distance: sw.distance, stroke: sw.stroke, course: sw.course || "25y",
            timeMs: sw.timeMs, place: sw.place || null, eventLabel: sw.eventLabel || "", age: sw.age || null, dq: !!sw.dq });
          added++;
        });
        list.forEach(a => { a.results.sort((x, y) => String(y.date || "").localeCompare(String(x.date || ""))); a.personalBests = bestsOf(a); });
        return { athletes: list, added, created };
      }

      // Hy-Tek / SDIF results (.cl2). One D0 line per individual swim; the C1
      // line before it says which team. Relay legs (F0) carry birthdays.
      function parseSdifResults(text) {
        const lines = text.split(/\r?\n/);
        const f = (l, a, n) => (l.substr(a - 1, n) || "").trim();
        const mdY = s => /^\d{8}$/.test(s) ? `${s.slice(4)}-${s.slice(0, 2)}-${s.slice(2, 4)}` : null;
        const t2ms = s => { const m = String(s).match(/^(?:(\d+):)?(\d+)\.(\d+)$/); return m ? ((+(m[1] || 0) * 60 + +m[2]) * 1000 + Math.round(+("0." + m[3]) * 1000)) : null; };
        const nameOf = raw => { const [last, rest] = raw.split(","); const first = (rest || "").trim().split(/\s+/)[0] || ""; return { first, last: (last || "").trim(), name: `${first} ${(last || "").trim()}`.trim() }; };
        let meetName = "", team = null;
        const teams = [], swims = [], dobs = {};
        lines.forEach(l => {
          const rec = l.slice(0, 2);
          if (rec === "B1") meetName = f(l, 12, 30);
          else if (rec === "C1") {
            const raw = f(l, 12, 6);
            const code = (raw.length > 4 ? raw.slice(-4) : raw).toUpperCase();
            team = code; if (!teams.some(t => t.code === code)) teams.push({ code, name: f(l, 18, 30) || code });
          } else if (rec === "D0") {
            const n = nameOf(f(l, 12, 28));
            const finalRaw = f(l, 116, 8), course = SDIF_COURSE[l.charAt(123)] || SDIF_COURSE[l.charAt(96)] || "25y";
            const stroke = SDIF_STROKES[+l.charAt(71)];
            if (!stroke) return;
            const timeMs = t2ms(finalRaw);
            swims.push({ ...n, firstName: n.first, lastName: n.last, team, gender: l.charAt(65) === "F" ? "Girls" : "Boys", age: +f(l, 64, 2) || null,
              dob: mdY(f(l, 56, 8)), distance: +f(l, 68, 4), stroke, course, timeMs: timeMs ? Math.round(timeMs / 10) * 10 : null,
              dq: /DQ/i.test(finalRaw), place: +f(l, 136, 3) || null, date: mdY(f(l, 81, 8)), meetName, eventLabel: f(l, 73, 4) });
          } else if (rec === "F0") {
            const n = nameOf(f(l, 23, 28)), dob = mdY(f(l, 63, 8));
            if (dob) dobs[normName(n.name) + "|" + team] = dob;
          }
        });
        swims.forEach(s => { if (!s.dob) s.dob = dobs[normName(s.name) + "|" + s.team] || null; });
        return { meetName, teams, swims };
      }

      // A meet's finished swims, ready for profiles or a results file.
      function meetSwims(meet) {
        const out = [];
        resultEvents(meet.events).forEach(ev => {
          if (isRelayEv(ev)) return;
          const all = ev.heats.flatMap(h => h.lanes.filter(l => l.name && (l.finalMs != null || l.dq)).map(l => ({ l, h })));
          const ranked = all.filter(x => !x.l.dq && x.l.finalMs != null).sort((a, b) => a.l.finalMs - b.l.finalMs);
          all.forEach(({ l }) => {
            const ent = (meet.meetEntries || []).find(e => e.id === l.entryId) || (meet.meetEntries || []).find(e => e.name === l.name && e.team === l.team);
            out.push({ name: l.name, firstName: l.firstName, lastName: l.lastName, team: l.team, gender: ent ? ent.gender : (ev.gender.startsWith("M") ? "" : ev.gender),
              age: l.age || null, dob: ent ? ent.dob : null, distance: ev.distance, stroke: ev.stroke, course: ev.course || meet.pool || "25y",
              timeMs: l.dq ? null : l.finalMs, dq: !!l.dq, place: l.dq ? null : ranked.findIndex(x => x.l === l) + 1,
              date: meet.date || new Date().toLocaleDateString("en-CA"), meetName: meet.meetName || "Swim Meet", eventLabel: evLabel(ev) });
          });
        });
        return out;
      }

      // ── Swim Teams: teams, their swimmers, each swimmer's history ──
      function SwimTeamsView({ teams, saveTeams, athletes, saveAthletes, onOpenFiles }) {
        const [teamCode, setTeamCode] = useState(null);
        const [swId, setSwId] = useState(null);
        const [newTeam, setNewTeam] = useState(null);
        const [newSw, setNewSw] = useState(null);
        const [imp, setImp] = useState(null);       // { files, meets, teams: [{code,name,n,on}], swims }
        const [msg, setMsg] = useState(null);
        const fileRef = useRef(null);
        const input = { width: "100%", background: "#FFFFFF", border: `2px solid ${TM.line}`, borderRadius: 6, padding: "10px 12px", color: TM.ink, fontSize: 16, boxSizing: "border-box" };
        const team = teams.find(t => t.code === teamCode);
        const sw = athletes.find(a => a.id === swId);
        const membersOf = code => athletes.filter(a => sameTeam(a.team, code));

        async function readResultFiles(fileList) {
          setMsg(null);
          const texts = [];
          for (const file of Array.from(fileList)) {
            try {
              if (/\.zip$/i.test(file.name)) {
                const JSZip = await loadJSZip();
                const zip = await JSZip.loadAsync(file);
                for (const n of Object.keys(zip.files).filter(n => /\.cl2$/i.test(n))) texts.push(await zip.files[n].async("string"));
              } else if (/\.(cl2|sd3|txt)$/i.test(file.name)) texts.push(await file.text());
            } catch (_) {}
          }
          if (!texts.length) { setMsg({ ok: false, text: "No results found. Pick Hy-Tek Meet Results files (.cl2, or the .zip they came in)." }); return; }
          const found = {}, swims = [], meets = new Set();
          texts.forEach(t => { const r = parseSdifResults(t); if (r.meetName) meets.add(r.meetName);
            r.teams.forEach(tm => { found[tm.code] = found[tm.code] || { ...tm, n: 0, on: true }; });
            r.swims.forEach(s => { swims.push(s); if (found[s.team]) found[s.team].n++; }); });
          const tlist = Object.values(found).sort((a, b) => b.n - a.n);
          setImp({ files: texts.length, meets: meets.size, teams: tlist, swims });
        }
        function doImport() {
          const on = new Set(imp.teams.filter(t => t.on).map(t => t.code));
          const swims = imp.swims.filter(s => on.has(s.team));
          const r = addSwimsToAthletes(athletes, swims);
          saveAthletes(r.athletes);
          const nt = [...teams];
          imp.teams.filter(t => t.on && !nt.some(x => x.code === t.code)).forEach(t => nt.push({ code: t.code, name: t.name.replace(/\b\w+/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase()) }));
          saveTeams(nt);
          setMsg({ ok: true, text: `Added ${r.added} results from ${imp.meets} meet${imp.meets === 1 ? "" : "s"}${r.created ? ` and ${r.created} new swimmers` : ""}.` });
          setImp(null);
        }

        const back = (fn, label) => <button onClick={fn} style={{ ...btnStyle(TM.ink, true), marginBottom: 12 }}>← {label}</button>;

        // ── one swimmer ──
        if (sw) {
          const age = ageToday(sw);
          const best = bestsOf(sw);
          const bestRows = Object.entries(best).map(([k, b]) => { const [d, st, c] = k.split("_"); return { d: +d, st, c, b }; })
            .sort((x, y) => x.st.localeCompare(y.st) || x.d - y.d);
          const upd = patch => saveAthletes(athletes.map(a => a.id === sw.id ? { ...a, ...patch } : a));
          return (
            <div>
              {back(() => setSwId(null), team ? team.name : "Team")}
              <h1 style={{ ...TM_DISPLAY, fontSize: 34, marginTop: 4 }}>{sw.name}</h1>
              <div style={{ ...TM_CAPTION, fontSize: 16 }}>{team ? team.name : sw.team} · {sw.gender || "—"}{age != null ? ` · ${age} years old` : ""}</div>
              <div style={{ ...rowStyle(), marginTop: 14, display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                <label style={{ flex: "1 1 160px" }}><span style={TM_LABEL}>Birthday</span>
                  <input type="date" value={sw.dob || ""} onChange={e => upd({ dob: e.target.value || null })} style={input} /></label>
                <label style={{ flex: "1 1 120px" }}><span style={TM_LABEL}>Girl / boy</span>
                  <select value={sw.gender || ""} onChange={e => upd({ gender: e.target.value })} style={input}>
                    <option value="">—</option><option value="Girls">Girl</option><option value="Boys">Boy</option></select></label>
              </div>
              {!sw.dob && <div style={{ ...TM_CAPTION, marginTop: 6 }}>Add the birthday once — age is worked out from it for every meet.</div>}
              <h2 style={{ ...TM_H2, marginTop: 22 }}>Best times</h2>
              {bestRows.length === 0 ? <div style={{ ...rowStyle(), ...TM_CAPTION, marginTop: 8 }}>No times yet.</div> : (
                <div style={{ marginTop: 8 }}>
                  {bestRows.map(({ d, st, c, b }) => (
                    <div key={`${d}${st}${c}`} style={{ display: "flex", gap: 10, padding: "8px 0", borderBottom: `1px solid ${TM.line}`, alignItems: "baseline" }}>
                      <span style={{ flex: 1, fontSize: 16, fontWeight: 700 }}>{d} {strokeShort(st)} <span style={TM_CAPTION}>{c}</span></span>
                      <span style={{ fontSize: 18, fontWeight: 900, fontVariantNumeric: "tabular-nums" }}>{b.time}</span>
                      <span style={{ ...TM_CAPTION, width: 90, textAlign: "right" }}>{b.date || ""}</span>
                    </div>
                  ))}
                </div>
              )}
              <h2 style={{ ...TM_H2, marginTop: 22 }}>Every swim</h2>
              {(sw.results || []).length === 0 ? <div style={{ ...rowStyle(), ...TM_CAPTION, marginTop: 8 }}>Results show up here after each meet.</div> : (
                <div style={{ marginTop: 8 }}>
                  {(sw.results || []).map((r, i) => (
                    <div key={i} style={{ padding: "8px 0", borderBottom: `1px solid ${TM.line}` }}>
                      <div style={{ display: "flex", gap: 10, alignItems: "baseline" }}>
                        <span style={{ flex: 1, fontSize: 15, fontWeight: 700 }}>{r.distance} {strokeShort(r.stroke)}{r.place ? ` · ${placeSuffix(r.place)}` : ""}</span>
                        <span style={{ fontSize: 16, fontWeight: 900, fontVariantNumeric: "tabular-nums", color: r.dq ? TM.live : TM.ink }}>{r.dq ? "DQ" : formatSwimTime(r.timeMs)}</span>
                      </div>
                      <div style={TM_CAPTION}>{r.date || ""} · {r.meetName}</div>
                    </div>
                  ))}
                </div>
              )}
              <div style={{ ...TM_CAPTION, marginTop: 16 }}>A / B / BB time standards will show here once your league's standards are added.</div>
              <button onClick={() => { if (window.confirm(`Delete ${sw.name} and all their times?`)) { saveAthletes(athletes.filter(a => a.id !== sw.id)); setSwId(null); } }}
                style={{ ...btnStyle(TM.live, true), marginTop: 20 }}>Delete swimmer</button>
            </div>
          );
        }

        // ── one team ──
        if (team) {
          const members = membersOf(team.code).sort((a, b) => (a.lastName || a.name).localeCompare(b.lastName || b.name));
          return (
            <div>
              {back(() => setTeamCode(null), "Teams")}
              <h1 style={{ ...TM_DISPLAY, fontSize: 34, marginTop: 4 }}>{team.name}</h1>
              <div style={{ ...TM_CAPTION, fontSize: 16 }}>{team.code} · {members.length} swimmer{members.length === 1 ? "" : "s"}</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 14 }}>
                {members.map(a => {
                  const age = ageToday(a), n = (a.results || []).length;
                  return (
                    <button key={a.id} onClick={() => setSwId(a.id)} style={{ ...rowStyle(), display: "flex", alignItems: "center", gap: 10, width: "100%", cursor: "pointer", textAlign: "left", color: TM.ink, minHeight: 56 }}>
                      <span style={{ flex: 1 }}>
                        <span style={{ display: "block", fontSize: 16, fontWeight: 800 }}>{a.name}</span>
                        <span style={TM_CAPTION}>{a.gender || "—"}{age != null ? ` · ${age}` : ""}{a.dob ? "" : " · no birthday"} · {n} swim{n === 1 ? "" : "s"}</span>
                      </span>
                      <ArrowIcon size={20} />
                    </button>
                  );
                })}
              </div>
              {newSw ? (
                <div style={{ ...rowStyle(TM.swim), display: "flex", flexDirection: "column", gap: 8, marginTop: 12 }}>
                  <input value={newSw.name} onChange={e => setNewSw(f => ({ ...f, name: e.target.value }))} placeholder="First and last name" aria-label="Swimmer name" style={input} autoFocus />
                  <div style={{ display: "flex", gap: 8 }}>
                    {["Girls", "Boys"].map(g => <button key={g} onClick={() => setNewSw(f => ({ ...f, gender: g }))} aria-pressed={newSw.gender === g} style={{ ...btnStyle(TM.ink, newSw.gender !== g), flex: 1 }}>{g === "Girls" ? "Girl" : "Boy"}</button>)}
                  </div>
                  <label><span style={TM_LABEL}>Birthday</span><input type="date" value={newSw.dob} onChange={e => setNewSw(f => ({ ...f, dob: e.target.value }))} aria-label="Birthday" style={input} /></label>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button disabled={!newSw.name.trim()} onClick={() => {
                      const nm = newSw.name.trim();
                      saveAthletes([...athletes, { id: newId("swa"), name: nm, firstName: nm.split(/\s+/)[0], lastName: nm.split(/\s+/).slice(1).join(" "), team: team.code, gender: newSw.gender, dob: newSw.dob || null, age: null, results: [], personalBests: {}, timeHistory: [] }]);
                      setNewSw({ name: "", gender: newSw.gender, dob: "" });
                    }} style={{ ...btnStyle(TM.swim), flex: 1, opacity: newSw.name.trim() ? 1 : 0.5 }}>Add swimmer</button>
                    <button onClick={() => setNewSw(null)} style={{ ...btnStyle(TM.ink, true), padding: "0 16px" }}>Done</button>
                  </div>
                </div>
              ) : (
                <button onClick={() => setNewSw({ name: "", gender: "Girls", dob: "" })} style={{ ...btnStyle(TM.ink), width: "100%", marginTop: 12 }}>+ Add swimmer</button>
              )}
              <button onClick={() => {
                const nm = window.prompt("Team name", team.name); if (nm && nm.trim()) saveTeams(teams.map(t => t.code === team.code ? { ...t, name: nm.trim() } : t));
              }} style={{ ...btnStyle(TM.ink, true), marginTop: 18 }}>Rename team</button>
            </div>
          );
        }

        // ── all teams ──
        return (
          <div>
            <h1 style={{ ...TM_DISPLAY, marginTop: 4 }}>Swim teams</h1>
            <div style={{ ...TM_CAPTION, fontSize: 16, marginTop: 6 }}>Each team keeps its swimmers and every time they swim. Meets pick teams from here.</div>
            {msg && <div role="status" style={{ ...rowStyle(msg.ok ? TM.run : TM.live), marginTop: 12, fontSize: 15, fontWeight: 700 }}>{msg.ok ? "✓ " : "✕ "}{msg.text}</div>}
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 14 }}>
              {teams.length === 0 && <div style={{ ...rowStyle(), ...TM_CAPTION }}>No teams yet — add yours, or import past results below.</div>}
              {teams.map(t => {
                const n = membersOf(t.code).length;
                return (
                  <button key={t.code} onClick={() => setTeamCode(t.code)} style={{ ...rowStyle(TM.swim), display: "flex", alignItems: "center", gap: 10, width: "100%", cursor: "pointer", textAlign: "left", color: TM.ink, minHeight: 64 }}>
                    <span style={{ flex: 1 }}>
                      <span style={{ display: "block", fontSize: 17, fontWeight: 800 }}>{t.name}</span>
                      <span style={TM_CAPTION}>{t.code} · {n} swimmer{n === 1 ? "" : "s"}</span>
                    </span>
                    <ArrowIcon size={22} />
                  </button>
                );
              })}
            </div>
            {newTeam ? (
              <div style={{ ...rowStyle(TM.swim), display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12 }}>
                <input value={newTeam.code} onChange={e => setNewTeam(t => ({ ...t, code: e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) }))} placeholder="Short: COOP" aria-label="Team short name" style={{ ...input, flex: "0 1 120px" }} autoFocus />
                <input value={newTeam.name} onChange={e => setNewTeam(t => ({ ...t, name: e.target.value }))} placeholder="Full: Cooper Cyclones" aria-label="Team full name" style={{ ...input, flex: "1 1 180px" }} />
                <button disabled={!newTeam.code} onClick={() => { saveTeams([...teams.filter(t => t.code !== newTeam.code), { code: newTeam.code, name: newTeam.name.trim() || newTeam.code }]); setNewTeam(null); }}
                  style={{ ...btnStyle(TM.swim), flex: "1 1 100%", opacity: newTeam.code ? 1 : 0.5 }}>Save team</button>
              </div>
            ) : (
              <button onClick={() => setNewTeam({ code: "", name: "" })} style={{ ...btnStyle(TM.ink), width: "100%", marginTop: 12 }}>+ New team</button>
            )}

            <div style={{ ...rowStyle(), marginTop: 22 }}>
              <div style={{ fontSize: 17, fontWeight: 900 }}>⬆ Import swimmers or past results</div>
              <button onClick={onOpenFiles} style={{ ...btnStyle(TM.ink), width: "100%", marginTop: 8 }}>From Team Manager → Import / Export</button>
              <div style={{ ...TM_CAPTION, marginTop: 8 }}>Or pick Hy-Tek results here and choose teams:</div>
              <div style={{ ...TM_CAPTION, marginTop: 4 }}>Pick Hy-Tek <b>Meet Results</b> files (.cl2, or the .zip Meet Manager made) — as many as you like at once. Every swimmer and time goes into their profile.</div>
              <input ref={fileRef} type="file" multiple accept=".cl2,.zip,.sd3,.CL2,.ZIP" style={{ display: "none" }} onChange={e => { const fl = Array.from(e.target.files || []); e.target.value = ""; if (fl.length) readResultFiles(fl); }} />
              {!imp ? (
                <button onClick={() => fileRef.current && fileRef.current.click()} style={{ ...btnStyle(TM.ink, true), width: "100%", marginTop: 10 }}>Choose results files</button>
              ) : (
                <div style={{ marginTop: 10 }}>
                  <div style={{ fontWeight: 800 }}>{imp.swims.length} swims from {imp.meets} meet{imp.meets === 1 ? "" : "s"}. Which teams?</div>
                  {imp.teams.map(t => (
                    <label key={t.code} style={{ display: "flex", gap: 10, alignItems: "center", padding: "8px 0", borderBottom: `1px solid ${TM.line}`, cursor: "pointer" }}>
                      <input type="checkbox" checked={t.on} onChange={e => setImp(x => ({ ...x, teams: x.teams.map(y => y.code === t.code ? { ...y, on: e.target.checked } : y) }))} style={{ width: 22, height: 22 }} />
                      <span style={{ flex: 1 }}><b>{t.code}</b> {t.name}</span><span style={TM_CAPTION}>{t.n} swims</span>
                    </label>
                  ))}
                  <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                    <button onClick={doImport} style={{ ...btnStyle(TM.swim), flex: 1 }}>Add these results</button>
                    <button onClick={() => setImp(null)} style={{ ...btnStyle(TM.ink, true), padding: "0 16px" }}>Cancel</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ── Ribbon labels: Avery 5160 / 8160 (3 across, 10 down, 1" × 2⅝") ──────
      // Every label to print: individual swims, plus one label per swimmer on
      // a relay (the relay's place and time, with the relay letter).
      function ribbonRows(meet, { team, maxPlace, sort }) {
        const rows = meetSwims(meet).filter(s => !s.dq && s.timeMs != null).map(s => ({ ...s, ev: meet.events.find(ev => evLabel(ev) === s.eventLabel) || {} }));
        resultEvents(meet.events).filter(isRelayEv).forEach(ev => {
          const done = ev.heats.flatMap(h => h.lanes.filter(l => l.name && l.finalMs != null && !l.dq)).sort((x, y) => x.finalMs - y.finalMs);
          done.forEach((l, i) => (l.legs || []).filter(Boolean).forEach(leg => {
            const parts = String(leg.name || "").split(/\s+/);
            rows.push({ name: leg.name, firstName: parts[0], lastName: parts.slice(1).join(" "), team: l.team, age: leg.age, relayLetter: l.lastName || "",
              distance: ev.distance, stroke: ev.stroke, course: ev.course || meet.pool, timeMs: l.finalMs, place: i + 1, eventLabel: evLabel(ev), ev });
          }));
        });
        let out = rows.filter(r => (!maxPlace || r.place <= maxPlace) && (!team || r.team === team));
        const evOrder = Object.fromEntries(meet.events.map((ev, i) => [evLabel(ev), i]));
        out.sort(sort === "event"
          ? (a, b) => (evOrder[a.eventLabel] - evOrder[b.eventLabel]) || (a.place - b.place) || String(a.name).localeCompare(b.name)
          : (a, b) => String(a.team).localeCompare(b.team) || String(a.lastName || a.name).localeCompare(b.lastName || b.name) || String(a.name).localeCompare(b.name) || (evOrder[a.eventLabel] - evOrder[b.eventLabel]));
        return out;
      }
      function ribbonLabelsHtml(meet, opts) {
        const rows = ribbonRows(meet, opts);
        const hytek = opts.style === "hytek";
        const teamFull = code => ((meet.teams || []).find(t => t.code === code) || {}).name || code;
        const dateUS = d => { const m = String(d || "").match(/^(\d{4})-(\d\d)-(\d\d)$/); return m ? `${+m[2]}/${+m[3]}/${m[1]}` : ""; };
        const bare = ms => formatSwimTime(ms).replace(/^:/, "");
        const unit = c => (c === "25m" || c === "50m") ? "Meter" : "Yard";
        const one = r => {
          const ev = r.ev || {};
          if (hytek) {
            // Hy-Tek's award label: five plain lines.
            return `<div class="lab hy"><div>Place:&nbsp; ${escHtml(placeSuffix(r.place))}&nbsp;&nbsp;&nbsp; Time:&nbsp; ${escHtml(bare(r.timeMs))}</div>
              <div>#${escHtml(r.eventLabel)}&nbsp; ${escHtml(ev.gender || "")} ${escHtml(ev.ageGroup || "")} ${escHtml(r.distance)} ${unit(r.course)} ${escHtml(r.stroke)}</div>
              <div>${escHtml(r.lastName ? `${r.lastName}, ${r.firstName}` : r.name)}&nbsp;&nbsp; ${escHtml(r.age || "")}</div>
              <div>${escHtml(teamFull(r.team))}${r.relayLetter ? " - " + escHtml(r.relayLetter) : " -"}&nbsp;&nbsp; ${escHtml(dateUS(meet.date))}</div>
              <div>${escHtml(meet.meetName || "")}</div></div>`;
          }
