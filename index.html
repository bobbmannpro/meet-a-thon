                          <button onClick={() => { setSwimConfirmNewMeet(false); setSwimMeet({ meetName:"", pool:"25y", events:[], code: friendlyCode() }); setSwimSetupStep(1); setSwimLiveCode(null); setSwimView("setup"); }}

                          </button>
                          <button onClick={() => setSwimConfirmNewMeet(false)}
                            style={{ ...btnStyle("#3D434B", true), padding:"11px", fontSize:14 }}>
                            Cancel
                          </button>
                        </div>
                      </div>
                    </div>

                  {/* Save-before-live prompt */}
                  {swimShowSaveBefore && (

                      onClick={e => { if (e.target === e.currentTarget) setSwimShowSaveBefore(false); }}>
                      <div style={{ background:"#EFEDE8", border:"2px solid #04613F", borderRadius:8, padding:"24px 20px", width:"100%", maxWidth:420 }}>

                            disabled={!swimSaveBeforeName.trim()}
                            style={{ ...btnStyle("#04613F"), flex:1, padding:"11px", fontSize:14, opacity: swimSaveBeforeName.trim() ? 1 : 0.4, cursor: swimSaveBeforeName.trim() ? "pointer" : "default" }}>

                        </div>
                      </div>
                    </div>
                  )}

                  </div>
                );
              })()}

            {/* ── LANE TIMER ── */}
            {view === "swimlane" && (() => {

              const connected = !!swimLaneSession;
              const status = swimLaneSession?.status || "waiting";
              function laneStop(e) {
                if (status !== "racing" || swimLaneFinished || !swimLaneSession.startedAt) return;
                const finalMs = Math.max(0, Math.round(eventEpoch(e) + SERVER_CLOCK.offset - swimLaneSession.startedAt));
                if (navigator.vibrate) { try { navigator.vibrate(60); } catch (_) {} }
                rtdb.ref(`swimLive/${swimLaneCode}/results/${swimLaneNum}`).update({ finalMs }).catch(console.error);
                setSwimLaneFinished(true);
              }

              return (
                <div style={{ maxWidth:640, margin:"0 auto", padding:"0 16px 40px" }}>
                  {!connected && <div style={{ padding:"20px 0 10px", fontSize:20, fontWeight:700, color:"#0B0D10" }}>🏊 Lane Timer</div>}

                  {/* Swim meets live right now: tap one instead of typing its code */}
                  {!connected && (todayRaces || []).some(r => r.kind === "swim" && r.status === "live") && (
                    <div style={{ marginBottom: 12 }}>
                      <div style={{ ...TM_LABEL, marginBottom: 6 }}>Swim meets happening now</div>

                          <span style={{ flex: 1 }}><span style={{ display: "block", fontSize: 16, fontWeight: 800 }}>{r.name || "Swim meet"}</span>

                        </button>

                    </div>
                  )}

                  {/* Join form */}
                  {!connected && (
                    <div style={{ background:"#EFEDE8", border:"2px solid #C9C5BC", borderRadius:8, padding:"14px 16px", marginBottom:12 }}>
                      <div style={{ fontSize:14, fontWeight:700, letterSpacing:1.2, textTransform:"uppercase", color:"#3D434B", marginBottom:8 }}>Join Session</div>
                      <div style={{ display:"flex", gap:8, alignItems:"flex-end", flexWrap:"wrap" }}>
                        <div style={{ flex:2, minWidth:120 }}>
                          <div style={{ fontSize:14, color:"#3D434B", marginBottom:3 }}>Meet Code</div>
                          <input
                            value={swimLaneCode}
                            onChange={e => setSwimLaneCode(normCode(e.target.value))}
                            onKeyDown={e => e.key === "Enter" && joinLaneTimer()}
                            maxLength={12}
                            placeholder="Type code"
                            style={{ background:"#FFFFFF", border:"2px solid #C9C5BC", borderRadius:4, padding:"8px 12px", color:"#0B0D10", fontSize:16, fontFamily:"monospace", letterSpacing:1.2, outline:"none", width:"100%", boxSizing:"border-box" }}
                          />
                        </div>
                        <div style={{ flex:1, minWidth:70 }}>
                          <div style={{ fontSize:14, color:"#3D434B", marginBottom:3 }}>Lane #</div>
                          <NumInput
                            type="number" min={1} max={10}
                            value={swimLaneNum}
                            onChange={e => setSwimLaneNum(parseInt(e.target.value) || 1)}
                            style={{ background:"#FFFFFF", border:"2px solid #C9C5BC", borderRadius:4, padding:"8px 12px", color:"#0B0D10", fontSize:16, outline:"none", width:"100%", boxSizing:"border-box" }}
                          />
                        </div>
                        <div>
                          <button style={{ ...btnStyle("#0B3FCC"), padding:"9px 20px", fontSize:14, opacity: swimLaneConnecting ? 0.6 : 1 }} onClick={() => joinLaneTimer()} disabled={swimLaneConnecting}>
                            {swimLaneConnecting ? "Connecting…" : "Join"}
                          </button>
                        </div>
                      </div>
                      {swimLaneError && <div style={{ marginTop:8, fontSize:14, color:"#B3001B", fontWeight:600 }}>{swimLaneError}</div>}
                    </div>
                  )}

                  {/* Connected view */}
                  {connected && (() => {
                    const activeEvData = swimLaneSession?.events?.find(e => e.eventNum === swimLaneSession?.activeEvent);
                    const activeHtData = activeEvData?.heats?.find(h => h.heatNum === swimLaneSession?.activeHeat);
                    const mySwimmer = activeHtData?.lanes?.find(l => l.lane === swimLaneNum);
                    const totalHeats = activeEvData?.heats?.length || 0;
                    return (
                    <div>
                      {/* Top bar */}
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", margin:"12px 0 10px" }}>
                        <div>
                          <div style={{ fontSize:15, fontWeight:700, color:"#0B0D10" }}>{swimLaneSession.meetName || "Unnamed Meet"}</div>
                          <div style={{ fontSize:14, color:"#3D434B", marginTop:1 }}>
                            Code: <span style={{ fontFamily:"monospace", color:"#04613F", letterSpacing:1.2 }}>{swimLaneCode}</span>
                          </div>
                        </div>
                        <button style={{ background:"transparent", border:"2px solid #C9C5BC", borderRadius:6, padding:"6px 14px", fontSize:14, color:"#3D434B", cursor:"pointer" }} onClick={() => {
                          if (swimLaneListenerRef.current) {
                            swimLaneListenerRef.current.ref.off("value", swimLaneListenerRef.current.fn);
                            swimLaneListenerRef.current = null;
                          }
                          setSwimLaneSession(null);
                          setSwimLaneFinished(false);
                        }}>Leave</button>
                      </div>

                      {/* Connected to the host? Green only while the host's heartbeat is fresh. */}
                      {(() => {
                        const on = heartbeatFresh(swimLaneSession.hostAt);
                        return (
                          <div role="status" aria-live="polite" style={{ borderRadius: 8, padding: "8px 14px", marginBottom: 10, fontSize: 17, fontWeight: 900,
                            background: on ? "#04613F" : "#EFEDE8", color: on ? "#FFFFFF" : "#B3001B", border: `3px solid ${on ? "#04613F" : "#B3001B"}` }}>
                            {on ? `✓ Connected to host — Lane ${swimLaneNum}` : "✕ Not connected to the host"}
                            <div style={{ fontSize: 14, fontWeight: 700, marginTop: 2, opacity: 0.9 }}>
                              {on ? "Keep this screen open." : "Keep this screen open — it reconnects by itself. Use your stopwatch until this is green."}
                            </div>
                          </div>
                        );
                      })()}

                      {/* Lane + event/heat pill row */}
                      <div style={{ display:"flex", gap:8, marginBottom:10, flexWrap:"wrap" }}>
                        <div style={{ background:"#EFEDE8", border:"2px solid #C9C5BC", borderRadius:8, padding:"5px 14px", fontSize:14, fontWeight:700, color:"#0B3FCC" }}>
                          Lane {swimLaneNum}
                        </div>
                        {swimLaneSession.activeEvent && (
                          <div style={{ background:"#EFEDE8", border:"2px solid #C9C5BC", borderRadius:8, padding:"5px 14px", fontSize:14, color:"#3D434B" }}>
                            Event {activeEvData ? evLabel(activeEvData) : swimLaneSession.activeEvent}
                            {activeEvData?.eventName ? ` · ${activeEvData.eventName}` : ""}
                          </div>
                        )}
                        {swimLaneSession.activeHeat && (
                          <div style={{ background:"#EFEDE8", border:"2px solid #C9C5BC", borderRadius:8, padding:"5px 14px", fontSize:14, color:"#3D434B" }}>
                            Heat {swimLaneSession.activeHeat}{totalHeats > 1 ? ` of ${totalHeats}` : ""}
                          </div>
                        )}
                      </div>

                      {/* Swimmer card */}
                      <div style={{ background:"#EFEDE8", border:"2px solid #C9C5BC", borderRadius:8, padding:"10px 16px", marginBottom:10, minHeight:64 }}>
                        {mySwimmer ? (
                          <div>
                            <div style={{ fontSize:26, fontWeight:700, color:"#0B0D10", marginBottom:2 }}>{mySwimmer.name || "—"}</div>
                            {mySwimmer.scratch && <div style={{ fontSize: 16, fontWeight: 900, color: "#B3001B" }}>Scratched — no swimmer in your lane this heat</div>}
                            {(mySwimmer.legs || []).some(Boolean) && <div style={{ fontSize: 14, color: "#3D434B" }}>{mySwimmer.legs.map((l, i) => l ? `${i + 1}. ${l.name}` : `${i + 1}. —`).join("  ")}</div>}
                            <div style={{ fontSize:14, color:"#3D434B" }}>
                              {mySwimmer.team && <span style={{ color:"#04613F", fontWeight:700 }}>{mySwimmer.team}</span>}
                              {mySwimmer.team && mySwimmer.seedMs ? " · " : ""}
                              {mySwimmer.seedMs ? `Seed ${formatSwimTime(mySwimmer.seedMs)}` : ""}
                            </div>
                          </div>
                        ) : (
                          <div style={{ color:"#3D434B", fontSize:14, paddingTop:8 }}>
                            {swimLaneSession.activeEvent ? "No swimmer assigned to this lane" : "Waiting for host to select event…"}
                          </div>
                        )}
                      </div>

                      {/* Clock */}
                      <div style={{ textAlign:"center", marginBottom:12 }}>
                        <div style={{ fontSize:56, fontWeight:700, letterSpacing:1.2, color: status === "racing" ? "#0B3FCC" : "#3D434B", fontVariantNumeric:"tabular-nums", lineHeight:1 }}>
                          {formatSwimTime(swimLaneFinished && swimLaneSession?.results?.[swimLaneNum] ? swimLaneSession.results[swimLaneNum].finalMs : status === "racing" ? swimLaneClockMs : 0)}
                        </div>
                        <div style={{ fontSize:14, color:"#3D434B", marginTop:8 }}>
                          {status === "waiting" ? "⏳ Waiting for start…" :
                           status === "racing" && !swimLaneFinished ? "🏁 Race in progress" :
                           swimLaneFinished ? `✓ Recorded — waiting for next heat` :
                           "Heat finished"}
                        </div>
                      </div>

                      {/* STOP button — big phone-friendly */}
                      <button
                        disabled={status !== "racing" || swimLaneFinished}
                        onPointerDown={e => laneStop(e)}
                        onClick={e => { if (e.detail === 0) laneStop(e); }}
                        style={{
                          // Huge on purpose: timers hit it without looking down at the phone.
                          width:"100%", minHeight:"max(200px, 34vh)", padding:"24px 20px",
                          fontSize: swimLaneFinished ? 30 : 64, fontWeight:900, letterSpacing:2,
                          borderRadius:16, marginBottom:16, userSelect:"none", WebkitUserSelect:"none", touchAction:"manipulation",
                          cursor: status === "racing" && !swimLaneFinished ? "pointer" : "default",
                          background: swimLaneFinished ? "#FFFFFF" : status === "racing" ? "#B3001B" : "#EFEDE8",
                          border: `4px solid ${swimLaneFinished ? "#0B3FCC" : status === "racing" ? "#B3001B" : "#C9C5BC"}`,
                          color: swimLaneFinished ? "#0B3FCC" : status === "racing" ? "#FFFFFF" : "#8A8F96",
                          boxShadow: status === "racing" && !swimLaneFinished ? "0 6px 28px rgba(179,0,27,0.35)" : "none",
                          transition:"background 0.15s, color 0.15s"
                        }}>
                        {swimLaneFinished ? "✓ FINISH RECORDED" : "STOP"}
                      </button>
                      <div style={{ ...TM_CAPTION, textAlign: "center", marginTop: -8, marginBottom: 14 }}>
                        {swimLaneClockErr ? `Clock matched to the host within ±${swimLaneClockErr} ms` : "Matching clock to the host…"}
                      </div>
                      {(() => {
                        const dq = !!(swimLaneSession.results && swimLaneSession.results[swimLaneNum] && swimLaneSession.results[swimLaneNum].dqFromLane);
                        const can = status === "racing" || swimLaneFinished || dq;
                        return (
                          <button disabled={!can} onClick={() => rtdb.ref(`swimLive/${swimLaneCode}/results/${swimLaneNum}/dqFromLane`).set(!dq).catch(console.error)}
                            aria-pressed={dq}
                            style={{ ...btnStyle(TM.live, !dq), width: "100%", minHeight: 52, fontSize: 18, marginBottom: 16, opacity: can ? 1 : 0.4 }}>
                            {dq ? "DQ sent to host — tap to undo" : "DQ this swimmer"}
                          </button>
                        );
                      })()}

                      {/* Clicker configuration */}
                      <div style={{ background:"#EFEDE8", border:"2px solid #C9C5BC", borderRadius:8, padding:"12px 14px" }}>
                        <div style={{ fontSize:14, fontWeight:700, letterSpacing:1.2, textTransform:"uppercase", color:"#3D434B", marginBottom:8 }}>Bluetooth Clicker</div>
                        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                          <span style={{ fontSize:14, color:"#0B0D10" }}>Key:</span>
                          <span style={{ background:"#FFFFFF", border:"2px solid #C9C5BC", borderRadius:4, padding:"4px 12px", fontFamily:"monospace", fontSize:14, color:"#0B3FCC", minWidth:40, textAlign:"center" }}>
                            {swimClickerKey === " " ? "Space" : swimClickerKey === "AudioVolumeUp" || swimClickerKey === "VolumeUp" ? "🔊 Vol Up" : swimClickerKey === "AudioVolumeDown" || swimClickerKey === "VolumeDown" ? "🔉 Vol Down" : swimClickerKey}
                          </span>
                          <button
                            style={{ background: swimClickerDetecting ? "#8A5A00" : "transparent", border:`2px solid ${swimClickerDetecting ? "#8A5A00" : "#04613F"}`, color: swimClickerDetecting ? "#FFFFFF" : "#04613F", padding:"5px 14px", fontSize:14, borderRadius:4, fontWeight:700, cursor:"pointer" }}
                            onClick={() => {
                              if (swimClickerDetecting) { setSwimClickerDetecting(false); return; }
                              setSwimClickerDetecting(true);
                              const detect = (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                                setSwimClickerKey(e.key);
                                setSwimClickerDetecting(false);
                                window.removeEventListener("keydown", detect, true);
                              };
                              window.addEventListener("keydown", detect, true);
                            }}>
                            {swimClickerDetecting ? "⏳ Press any key…" : "Detect"}
                          </button>
                        </div>
                        <div style={{ marginTop:8, fontSize:14, color:"#3D434B" }}>
                          ● Connected · Lane {swimLaneNum} · {swimLaneSession.pool || ""}
                        </div>
                      </div>
                    </div>
                  );})()}
                </div>
              );
            })()}

            
            

            {/* ── SWIM MEET VIEWER ── */}
            {view === "swimwatch" && (() => {
              function joinSwimWatch() { joinSwimWatchCode(swimWatchCode); }

              const session = swimWatchSession;
              const connected = !!session;
              const status = session?.status || "waiting";

              // Build sorted swimmer list from events for the "cheer on" picker
              const allSwimmers = connected && session.events
                ? session.events.flatMap(ev => ev.heats.flatMap(ht => ht.lanes.filter(s => s.name).map(s => ({ name: s.name, team: s.team||"", ev: ev.eventNum, ht: ht.heatNum, lane: s.lane, gender: ev.gender, distance: ev.distance, stroke: ev.stroke }))))
                : [];
              const uniqueNames = [...new Set(allSwimmers.map(s => s.name))];

              // Get active heat lane data
              const activeEv = connected && session.events ? session.events.find(e => e.eventNum === session.activeEvent) : null;
              const activeHt = activeEv ? activeEv.heats.find(h => h.heatNum === session.activeHeat) : null;

              return (
                <div style={{ maxWidth:640, margin:"0 auto", padding:"0 16px 40px" }}>
                  <div style={{ padding:"20px 0 10px", fontSize:20, fontWeight:700, color:"#0B0D10" }}>🏊 Watch a Meet</div>

                  {!connected && (todayRaces || []).some(r => r.status === "live") && (
                    <div style={{ marginBottom: 12 }}>
                      <div style={{ ...TM_LABEL, marginBottom: 6 }}>Meets happening now</div>
                      {(todayRaces || []).filter(r => r.status === "live").map(r => (
                        <button key={r.code} onClick={() => { setSwimWatchCode(r.code); joinSwimWatchCode(r.code); }}
                          style={{ ...rowStyle(TM.swim), display: "block", width: "100%", marginBottom: 6, cursor: "pointer", textAlign: "left", color: TM.ink }}>
                          <span style={{ display: "block", fontSize: 16, fontWeight: 800 }}>{r.name || "Swim meet"}</span>
                          <span style={TM_CAPTION}>Code {r.code}{r.hostName ? ` · ${r.hostName}` : ""}</span>
                        </button>
                      ))}
                    </div>
                  )}

                  {/* Join form */}
                  {!connected && (
                    <div style={{ background:"#EFEDE8", border:"2px solid #C9C5BC", borderRadius:8, padding:"14px 16px", marginBottom:12 }}>
                      <div style={{ fontSize:14, fontWeight:700, letterSpacing:1.2, textTransform:"uppercase", color:"#3D434B", marginBottom:10 }}>Join a Meet</div>
                      <div style={{ display:"flex", gap:8, alignItems:"flex-end" }}>
                        <div style={{ flex:1 }}>
                          <div style={{ fontSize:14, color:"#3D434B", marginBottom:3 }}>Meet Code</div>
                          <input
                            value={swimWatchCode}
                            onChange={e => setSwimWatchCode(normCode(e.target.value))}
                            onKeyDown={e => e.key === "Enter" && joinSwimWatch()}
                            maxLength={12}
                            placeholder="Type code"
                            style={{ background:"#FFFFFF", border:"2px solid #C9C5BC", borderRadius:4, padding:"10px 14px", color:"#0B0D10", fontSize:18, fontFamily:"monospace", letterSpacing:1.2, outline:"none", width:"100%", boxSizing:"border-box" }}
                          />
                        </div>
                        <button style={{ padding:"10px 24px", fontWeight:700, fontSize:14, background:"#0B3FCC", border:"none", borderRadius:4, color:"#FFFFFF", cursor:"pointer" }} onClick={joinSwimWatch}>
                          Watch
                        </button>
                      </div>
                      {swimWatchError && <div style={{ marginTop:8, fontSize:14, color:"#B3001B" }}>{swimWatchError}</div>}
                    </div>
                  )}

                  {/* Connected view */}
                  {connected && (
                    <div>
                      {/* Meet header */}
                      <div style={{ background:"#EFEDE8", border:"2px solid #C9C5BC", borderRadius:8, padding:"12px 14px", marginBottom:12, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                        <div>
                          <div style={{ fontSize:15, fontWeight:700, color:"#0B0D10" }}>{session.meetName || "Swim Meet"}</div>
                          <div style={{ fontSize:14, color:"#3D434B", marginTop:2 }}>
                            {session.pool || ""} · Code: <span style={{ fontFamily:"monospace", color:"#04613F", letterSpacing:1.2 }}>{swimWatchCode}</span>
                          </div>
                        </div>
                        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                          <button style={{ background:"transparent", border:"2px solid #C9C5BC", borderRadius:4, padding:"5px 12px", fontSize:14, color:"#04613F", cursor:"pointer" }}
                            onClick={() => setSwimWatchChooserOpen(o => !o)}>
                            {swimWatchCheering ? `⭐ ${swimWatchCheering.split(" ")[0]}` : "⭐ Cheer"}
                          </button>
                          <button style={{ background:"transparent", border:"2px solid #C9C5BC", borderRadius:4, padding:"5px 10px", fontSize:14, color:"#3D434B", cursor:"pointer" }} onClick={() => {
                            if (swimWatchListenerRef.current) {
                              swimWatchListenerRef.current.ref.off("value", swimWatchListenerRef.current.fn);
                              swimWatchListenerRef.current = null;
                            }
                            setSwimWatchSession(null);
                            setSwimWatchCheering(null);
                          }}>Leave</button>
                        </div>
                      </div>
                      {/* Volunteers timing a lane start here: same code, their lane's Stop button */}
                      <button onClick={() => { setSwimLaneCode(swimWatchCode); setView("swimlane"); }}
                        style={{ ...btnStyle(TM.swim), width: "100%", marginBottom: 12, fontSize: 16 }}>
                        ⏱ I'm timing a lane
                      </button>

                      {/* Swimmer chooser */}
                      {swimWatchChooserOpen && (
                        <div style={{ background:"#FFFFFF", border:"2px solid #C9C5BC", borderRadius:8, padding:"12px 14px", marginBottom:12 }}>
                          <div style={{ fontSize:14, fontWeight:700, letterSpacing:1.2, textTransform:"uppercase", color:"#3D434B", marginBottom:8 }}>Who are you cheering for?</div>
                          {swimWatchCheering && (
                            <button style={{ ...btnStyle("#B3001B", true), fontSize:14, padding:"4px 12px", marginBottom:8 }} onClick={() => { setSwimWatchCheering(null); setSwimWatchChooserOpen(false); }}>
                              ✕ Stop cheering
                            </button>
                          )}
                          <div style={{ display:"flex", flexDirection:"column", gap:4, maxHeight:200, overflowY:"auto" }}>
                            {uniqueNames.map(name => (
                              <button key={name} onClick={() => { setSwimWatchCheering(name); setSwimWatchChooserOpen(false); }}
                                style={{ textAlign:"left", background: swimWatchCheering === name ? "#0B3FCC" : "#FFFFFF", border: swimWatchCheering === name ? "2px solid #C9C5BC" : "2px solid transparent", borderRadius:4, padding:"7px 10px", color: swimWatchCheering === name ? "#FFFFFF" : "#0B0D10", cursor:"pointer", fontSize:14 }}>
                                {swimWatchCheering === name ? "⭐ " : ""}{name}
                              </button>
                            ))}
                            {uniqueNames.length === 0 && <div style={{ fontSize:14, color:"#3D434B" }}>No swimmer names in this meet yet.</div>}
                          </div>
                        </div>
                      )}

                      {/* Current heat */}
                      {status === "finished" ? (
                        <div style={{ background:"#EFEDE8", border:"2px solid #C9C5BC", borderRadius:8, padding:"16px", marginBottom:12, textAlign:"center" }}>
                          <div style={{ fontSize:14, color:"#04613F", fontWeight:700 }}>🏁 Meet Complete</div>
                        </div>
                      ) : activeHt ? (
                        <div style={{ background:"#EFEDE8", border:"2px solid #C9C5BC", borderRadius:8, padding:"14px 16px", marginBottom:12 }}>
                          <div style={{ fontSize:14, fontWeight:700, letterSpacing:1.2, textTransform:"uppercase", color:"#3D434B", marginBottom:6 }}>
                            Event {evLabel(activeEv)} — {activeEv.gender} {activeEv.ageGroup} {activeEv.distance} {activeEv.stroke}
                          </div>
                          <div style={{ fontSize:14, color:"#04613F", marginBottom:10 }}>
                            Heat {session.activeHeat} of {activeEv.heats.length}
                          </div>
                          {/* Live clock */}
                          <div style={{ fontSize:44, fontWeight:700, letterSpacing:1.2, color: status === "racing" ? "#0B3FCC" : "#3D434B", fontVariantNumeric:"tabular-nums", textAlign:"center", marginBottom:10 }}>
                            {status === "racing" ? formatSwimTime(swimWatchClockMs) : (status === "waiting" ? "⏳ Waiting…" : formatSwimTime(swimWatchClockMs))}
                          </div>
                          {/* Lane results */}
                          {activeHt.lanes.sort((a,b) => a.lane - b.lane).map(sw => {
                            const res = session.results?.[sw.lane];
                            const finalMs = res?.finalMs ?? null;
                            const isCheering = swimWatchCheering && sw.name && sw.name === swimWatchCheering;
                            return (
                              <div key={sw.lane} style={{ display:"flex", alignItems:"center", gap:10, padding:"6px 10px", borderRadius:6, marginBottom:4, background: isCheering ? "#EFEDE8" : "transparent", border: isCheering ? "2px solid #C9C5BC" : "2px solid transparent" }}>
                                <span style={{ fontSize:14, color:"#3D434B", width:46, flexShrink:0 }}>Lane {sw.lane}</span>
                                <span style={{ flex:1, fontSize:14, fontWeight: isCheering ? 700 : 400, color: isCheering ? "#0B3FCC" : "#0B0D10" }}>
                                  {isCheering && "⭐ "}{sw.name || "(empty)"}{sw.team ? <span style={{ fontSize:14, color:"#3D434B", fontWeight:400 }}> · {sw.team}</span> : ""}
                                </span>
                                <span style={{ fontSize:14, fontWeight:700, fontVariantNumeric:"tabular-nums", color: finalMs != null ? "#0B3FCC" : "#3D434B" }}>
                                  {finalMs != null ? formatSwimTime(finalMs) : (res?.dq ? "DQ" : "--:--.--")}
                                </span>
                              </div>
                            );
                          })}
                        </div>
                      ) : (
                        <div style={{ background:"#EFEDE8", border:"2px solid #C9C5BC", borderRadius:8, padding:"24px", marginBottom:12, textAlign:"center", color:"#3D434B", fontSize:14 }}>
                          ⏳ Waiting for host to start a heat…
                        </div>
                      )}

                      {/* Completed heats */}
                      {session.heatResults && Object.keys(session.heatResults).length > 0 && (
                        <div style={{ marginTop:16 }}>
                          <div style={{ fontSize:14, fontWeight:700, letterSpacing:1.2, textTransform:"uppercase", color:"#3D434B", marginBottom:10 }}>Completed Heats</div>
                          {Object.entries(session.heatResults).sort().map(([key, results]) => {
                            const [evNum, htNum] = key.split("_").map(Number);
                            const ev = session.events?.find(e => e.eventNum === evNum);
                            const ht = ev?.heats.find(h => h.heatNum === htNum);
                            const sorted = Object.entries(results).filter(([,r]) => r.finalMs != null && !r.dq).sort(([,a],[,b]) => a.finalMs - b.finalMs);
                            return (
                              <div key={key} style={{ background:"#EFEDE8", border:"2px solid #C9C5BC", borderRadius:8, padding:"10px 14px", marginBottom:8 }}>
                                <div style={{ fontSize:14, color:"#04613F", fontWeight:700, marginBottom:6 }}>
                                  {ev ? `Event ${evLabel(ev)} — ${ev.gender} ${ev.ageGroup} ${ev.distance} ${ev.stroke}` : `Event ${evNum}`} · Heat {htNum}
                                </div>
                                {sorted.map(([lane, r], rank) => {
                                  const isCheering = swimWatchCheering && r.name && r.name === swimWatchCheering;
                                  return (
                                    <div key={lane} style={{ display:"flex", alignItems:"center", gap:8, padding:"3px 0", borderRadius:4, background: isCheering ? "#EFEDE8" : "transparent" }}>
                                      <span style={{ fontSize:14, color:"#3D434B", width:20 }}>{rank + 1}.</span>
                                      <span style={{ flex:1, fontSize:14, color: isCheering ? "#0B3FCC" : "#0B0D10", fontWeight: isCheering ? 700 : 400 }}>
                                        {isCheering && "⭐ "}{r.name || `Lane ${lane}`}{r.team ? <span style={{ fontSize:14, color:"#3D434B", fontWeight:400 }}> {r.team}</span> : ""}
                                      </span>
                                      <span style={{ fontSize:14, fontVariantNumeric:"tabular-nums", color:"#0B3FCC", fontWeight:700 }}>{formatSwimTime(r.finalMs)}</span>
                                    </div>
                                  );
                                })}
                                {Object.entries(results).filter(([,r]) => r.dq).map(([lane, r]) => (
                                  <div key={`dq${lane}`} style={{ display:"flex", alignItems:"center", gap:8, padding:"3px 0", opacity:0.5 }}>
                                    <span style={{ fontSize:14, color:"#B3001B", width:20 }}>DQ</span>
                                    <span style={{ flex:1, fontSize:14, color:"#0B0D10" }}>{r.name || `Lane ${lane}`}</span>
                                    <span style={{ fontSize:14, color:"#B3001B" }}>Disqualified</span>
                                  </div>
                                ))}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })()}

            {/* ══ BIKE LIVE FEED ══════════════════════════════════════════════ */}
            
          </div>
        );
      }

      // A crash shows what went wrong and a way back, never a blank screen.
      class Boundary extends React.Component {
        constructor(p) { super(p); this.state = { err: null }; }
        static getDerivedStateFromError(err) { return { err }; }
        componentDidCatch(err, info) {
          const rep = { at: Date.now(), msg: String(err && err.message || err), stack: String(err && err.stack || "").slice(0, 1500),
                        comp: String(info && info.componentStack || "").slice(0, 800), ua: navigator.userAgent.slice(0, 200) };
          try { localStorage.setItem("tm-last-crash", JSON.stringify(rep)); } catch (_) {}
          // So the developer can see what broke on a real phone.
          try { if (window.firebase && firebase.auth().currentUser) { firebase.database().ref("crashReports/" + rep.at + "_" + firebase.auth().currentUser.uid.slice(0, 6)).set({ ...rep, uid: firebase.auth().currentUser.uid }).catch(() => {}); } } catch (_) {}
        }
        render() {
          if (!this.state.err) return this.props.children;
          return (
            <div style={{ fontFamily: "Archivo, Arial, sans-serif", padding: "32px 20px", maxWidth: 560, margin: "0 auto", color: "#0B0D10" }}>
              <h1 style={{ fontSize: 28, fontWeight: 900, margin: "0 0 10px" }}>Something went wrong</h1>
              <p style={{ fontSize: 17, lineHeight: 1.4, margin: "0 0 16px" }}>Your meet is saved. Tap Reload to carry on.</p>
              <button onClick={() => location.reload()} style={{ minHeight: 56, padding: "0 28px", fontSize: 18, fontWeight: 800, background: "#0B0D10", color: "#fff", border: "none", borderRadius: 8 }}>Reload</button>
              <p style={{ fontSize: 13, color: "#3D434B", marginTop: 20, wordBreak: "break-word" }}>Error: {String(this.state.err && this.state.err.message || this.state.err)}</p>
            </div>
          );
        }
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<Boundary><App /></Boundary>);
      const splash = document.getElementById("splash");
      if (splash) {
        // Let the hands finish their spin and land in the logo, then fade.
        const loop = window.__splashLoop || 3000, end = window.__splashEnd || 0.86;
        const f = ((performance.now() - (window.__splashStart || 0)) % loop) / loop;
        const wait = f < end ? (end - f) * loop : 0;
        setTimeout(() => { splash.classList.add("hide"); setTimeout(() => splash.remove(), 350); }, wait);
      }
    </script>
  </body>
</html>
