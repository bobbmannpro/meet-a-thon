                                <div key={ev.eventNum} style={{ background:"#FFFFFF", borderRadius:6, marginBottom:6, overflow:"hidden", border:"2px solid #C9C5BC" }}>
                                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 12px", cursor:"pointer" }}
                                    onClick={() => setSwimExpandedEvents(x => ({...x, [ev.eventNum]: !x[ev.eventNum]}))}>
                                    <div>
                                      <span style={{ color:"#0B3FCC", fontWeight:700, marginRight:8, fontSize:14 }}>Event {evLabel(ev)}</span>
                                      <span style={{ color:"#0B0D10", fontSize:14 }}>{ev.gender} {ev.ageGroup} {ev.distance} {ev.stroke}</span>
                                      <span style={{ color:"#3D434B", fontSize:14, marginLeft:8 }}>{ev.heats.length} heat{ev.heats.length !== 1 ? "s" : ""}{ev.entries && ev.entries.length > 0 ? ` · ${ev.entries.length} entries` : ""}</span>
                                    </div>
                                    <div style={{ display:"flex", gap:6, alignItems:"center" }}>
                                      <button onClick={e => { e.stopPropagation(); seedOneEvent(ev.eventNum); }}
                                        style={{ fontSize:14, padding:"4px 10px", borderRadius:4, background:"#EFEDE8", border:"2px solid #C9C5BC", color:"#04613F", cursor:"pointer", fontWeight:700 }}>
                                        🌱 Seed
                                      </button>
                                      <button onClick={e => { e.stopPropagation(); setSwimAddSwimmerEvt(x => x === ev.eventNum ? null : ev.eventNum); setSwimNewSwimmerForm({ name:"", team:"", seedTime:"" }); }}
                                        style={{ fontSize:14, padding:"4px 10px", borderRadius:4, background: showAddForm ? "#EFEDE8" : "#EFEDE8", border:"2px solid #C9C5BC", color:"#0B3FCC", cursor:"pointer", fontWeight:700 }}>
                                        + Swimmer
                                      </button>
                                      <button onClick={e => { e.stopPropagation(); setSwimActiveEvent(ev.eventNum); setSwimActiveHeat(ev.heats[0] ? ev.heats[0].heatNum : 1); setSwimView("race"); }}
                                        style={{ fontSize:14, padding:"4px 10px", borderRadius:4, background:"#EFEDE8", border:"2px solid #C9C5BC", color:"#0B3FCC", cursor:"pointer", fontWeight:700 }}>
                                        ▶ Start
                                      </button>
                                      <span style={{ color:"#3D434B", fontSize:14 }}>{expanded ? "▲" : "▼"}</span>
                                    </div>
                                  </div>
                                  {expanded && (
                                    <div style={{ padding:"8px 16px", borderTop:"2px solid #C9C5BC", background:"#FFFFFF" }}>
                                      {swimEditEvt === ev.eventNum && swimEditForm ? (
                                        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                                          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                                            <label style={{ flex:"0 1 80px" }}><div style={S.label}>Event #</div>
                                              <input value={swimEditForm.eventLabel} onChange={e => setSwimEditForm(f => ({ ...f, eventLabel: e.target.value.toUpperCase().replace(/[^0-9A-Z]/g, "") }))} style={{ ...S.input }} /></label>
                                            <label style={{ flex:"1 1 100px" }}><div style={S.label}>Who</div>
                                              <select value={swimEditForm.gender} onChange={e => setSwimEditForm(f => ({ ...f, gender: e.target.value }))} style={{ ...S.input }}>
                                                {["Girls","Boys","Mixed"].map(g => <option key={g}>{g}</option>)}</select></label>
                                            <label style={{ flex:"1 1 110px" }}><div style={S.label}>Ages</div>
                                              <input value={swimEditForm.ageGroup} onChange={e => setSwimEditForm(f => ({ ...f, ageGroup: e.target.value }))} placeholder="e.g. 9-10, 6 & Under" style={{ ...S.input }} /></label>
                                          </div>
                                          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                                            <label style={{ flex:"0 1 100px" }}><div style={S.label}>Distance</div>
                                              <select value={swimEditForm.distance} onChange={e => setSwimEditForm(f => ({ ...f, distance: +e.target.value }))} style={{ ...S.input }}>
                                                {[25,50,100,200,400,500].map(d => <option key={d} value={d}>{d}</option>)}</select></label>
                                            <label style={{ flex:"1 1 160px" }}><div style={S.label}>Stroke</div>
                                              <select value={swimEditForm.stroke} onChange={e => setSwimEditForm(f => ({ ...f, stroke: e.target.value }))} style={{ ...S.input }}>
                                                {["Freestyle","Backstroke","Breaststroke","Butterfly","IM","Freestyle Relay","Medley Relay"].map(st => <option key={st}>{st}</option>)}</select></label>
                                          </div>
                                          <div style={{ display:"flex", gap:8 }}>
                                            <button onClick={() => saveMeetEvent(ev)} style={{ ...btnStyle(TM.swim), flex:1, fontSize:15 }}>Save event</button>
                                            <button onClick={() => { setSwimEditEvt(null); setSwimEditForm(null); }} style={{ ...btnStyle(TM.ink, true), fontSize:15, padding:"0 16px" }}>Cancel</button>
                                          </div>
                                        </div>
                                      ) : (
                                        <div style={{ display:"flex", gap:8 }}>
                                          <button onClick={() => { setSwimEditEvt(ev.eventNum); setSwimEditForm({ eventLabel: evLabel(ev), gender: ev.gender, ageGroup: ev.ageGroup, distance: ev.distance, stroke: ev.stroke }); }}
                                            style={{ ...btnStyle(TM.ink, true), minHeight:40, fontSize:15, padding:"0 14px" }}>✎ Edit event</button>
                                          <button onClick={() => deleteMeetEvent(ev)}
                                            style={{ ...btnStyle(TM.live, true), minHeight:40, fontSize:15, padding:"0 14px" }}>Delete event</button>
                                        </div>
                                      )}
                                    </div>
                                  )}
                                  {expanded && ev.heats.map(ht => (
                                    <div key={ht.heatNum} style={{ padding:"6px 16px", borderTop:"2px solid #C9C5BC" }}>
                                      <div style={{ fontSize:14, color:"#04613F", fontWeight:700, marginBottom:4 }}>Heat {ht.heatNum}</div>
                                      {ht.lanes.map(sw => (
                                        <div key={sw.lane} style={{ display:"flex", gap:8, fontSize:14, color:"#0B0D10", padding:"2px 0" }}>
                                          <span style={{ color:"#3D434B", width:50 }}>Lane {sw.lane}</span>
                                          <span style={{ flex:1 }}>{sw.name || "(empty)"}</span>
                                          <span style={{ color:"#3D434B" }}>{sw.team}</span>
                                          <span style={{ color:"#3D434B", width:60, textAlign:"right" }}>{sw.seedTime}</span>
                                        </div>
                                      ))}
                                    </div>
                                  ))}
                                  {/* Entries list */}
                                  {ev.entries && ev.entries.length > 0 && (
                                    <div style={{ padding:"6px 16px 8px", borderTop:"2px solid #C9C5BC" }}>
                                      <div style={{ fontSize:14, color:"#04613F", fontWeight:700, marginBottom:4 }}>
                                        Entries ({ev.entries.length}) — {ev.heats.some(h => h.lanes.some(l => l.name)) ? "seeded above; tap 🌱 Seed again after adding swimmers" : "tap 🌱 Seed to put them in heats and lanes"}
                                      </div>
                                      {ev.entries.map((en, idx) => (
                                        <div key={idx} style={{ display:"flex", gap:8, fontSize:14, color:"#0B0D10", padding:"2px 0", alignItems:"center" }}>
                                          <span style={{ flex:1 }}>{en.name}</span>
                                          <span style={{ color:"#3D434B", fontSize:14 }}>{en.team}</span>
                                          <span style={{ color:"#3D434B", width:60, textAlign:"right" }}>{en.seedTime || "NT"}</span>
                                          <button onClick={() => removeSwimmerEntry(ev.eventNum, idx)}
                                            style={{ background:"none", border:"none", color:"#B3001B", cursor:"pointer", fontSize:14, padding:"0 4px" }}>×</button>
                                        </div>
                                      ))}
                                    </div>
                                  )}
                                  {/* Add-swimmer form */}
                                  {showAddForm && (
                                    <div style={{ padding:"10px 16px", borderTop:"2px solid #C9C5BC", background:"#EFEDE8" }}>
                                      {swimAthletes.length > 0 && (
                                        <div style={{ marginBottom:8 }}>
                                          <select onChange={e => {
                                            if (!e.target.value) return;
                                            const a = swimAthletes.find(x => x.id === e.target.value);
                                            if (a) setSwimNewSwimmerForm(f => ({ ...f, name: a.name, team: a.team }));
                                            e.target.value = "";
                                          }} style={{ ...S.input, marginBottom:0 }}>
                                            <option value="">— Pick from roster —</option>
                                            {swimAthletes.map(a => <option key={a.id} value={a.id}>{a.name} ({a.team || "no team"})</option>)}
                                          </select>
                                        </div>
                                      )}
                                      <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                                        <input placeholder="Name *" value={swimNewSwimmerForm.name}
                                          onChange={e => setSwimNewSwimmerForm(f => ({...f, name:e.target.value}))}
                                          style={{ ...S.input, flex:2, minWidth:120, marginBottom:0 }} />
                                        <input placeholder="Team" value={swimNewSwimmerForm.team}
                                          onChange={e => setSwimNewSwimmerForm(f => ({...f, team:e.target.value}))}
                                          style={{ ...S.input, flex:1, minWidth:80, marginBottom:0 }} />
                                        <input placeholder="Seed (1:23.45 or NT)" value={swimNewSwimmerForm.seedTime}
                                          onChange={e => setSwimNewSwimmerForm(f => ({...f, seedTime:e.target.value}))}
                                          style={{ ...S.input, flex:1, minWidth:100, marginBottom:0 }} />
                                        <button onClick={() => addSwimmerEntry(ev.eventNum)}
                                          disabled={!swimNewSwimmerForm.name.trim()}
                                          style={{ ...btnStyle("#0B3FCC"), padding:"8px 16px", fontSize:14, opacity: swimNewSwimmerForm.name.trim() ? 1 : 0.4 }}>
                                          Add
                                        </button>
                                      </div>
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        )}

                        {/* Add event manually */}
                        <div style={S.card}>
                          <button onClick={() => { setSwimAddEventOpen(o => !o); setSwimNewEvent(f => ({ ...f, lanes: swimMeet.lanes || 8 })); }}
                            style={{ ...btnStyle("#04613F", true), fontSize:14, width:"100%" }}>
                            {swimAddEventOpen ? "✕ Cancel" : "+ Add Event Manually"}
                          </button>
                          {swimAddEventOpen && (
                            <div style={{ marginTop:12, display:"flex", flexDirection:"column", gap:8 }}>
                              <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                                <div style={{ flex:1, minWidth:120 }}>
                                  <div style={S.label}>Gender</div>
                                  <select value={swimNewEvent.gender} onChange={e => setSwimNewEvent(x => ({...x, gender:e.target.value}))}
                                    style={{...S.input}}>
                                    {["Girls","Boys","Mixed"].map(g => <option key={g} value={g}>{g}</option>)}
                                  </select>
                                </div>
                                <div style={{ flex:1, minWidth:120 }}>
                                  <div style={S.label}>Age Group</div>
                                  <select value={swimNewEvent.ageGroup} onChange={e => setSwimNewEvent(x => ({...x, ageGroup:e.target.value}))}
                                    style={{...S.input}}>
                                    {["6 & Under","7-8","8 & Under","9-10","11-12","13-14","15-17","15-18","13 & Over","Open"].map(g => <option key={g} value={g}>{g}</option>)}
                                  </select>
                                </div>
                                <div style={{ flex:1, minWidth:100 }}>
                                  <div style={S.label}>Distance</div>
                                  <select value={swimNewEvent.distance} onChange={e => setSwimNewEvent(x => ({...x, distance:parseInt(e.target.value)}))}
                                    style={{...S.input}}>
                                    {[25,50,100,200,400,500,800,1000,1500,1650].map(d => <option key={d} value={d}>{d}</option>)}
                                  </select>
                                </div>
                              </div>
                              <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                                <div style={{ flex:2, minWidth:150 }}>
                                  <div style={S.label}>Stroke</div>
                                  <select value={swimNewEvent.stroke} onChange={e => setSwimNewEvent(x => ({...x, stroke:e.target.value}))}
                                    style={{...S.input}}>
                                    {["Freestyle","Backstroke","Breaststroke","Butterfly","IM","Freestyle Relay","Medley Relay"].map(s => <option key={s} value={s}>{s}</option>)}
                                  </select>
                                </div>
                                <div style={{ flex:1, minWidth:80 }}>
                                  <div style={S.label}>Heats</div>
                                  <NumInput type="number" min={1} max={99} value={swimNewEvent.heats}
                                    onChange={e => setSwimNewEvent(x => ({...x, heats:parseInt(e.target.value)||1}))}
                                    style={{...S.input}} />
                                </div>
                                <div style={{ flex:1, minWidth:80 }}>
                                  <div style={S.label}>Lanes</div>
                                  <NumInput type="number" min={1} max={10} value={swimNewEvent.lanes}
                                    onChange={e => setSwimNewEvent(x => ({...x, lanes:parseInt(e.target.value)||8}))}
                                    style={{...S.input}} />
                                </div>
                              </div>
                              <button style={{ ...btnStyle("#0B3FCC"), fontSize:14 }}
                                onClick={() => {
                                  const nextNum = swimMeet.events.length > 0 ? Math.max(...swimMeet.events.map(e => e.eventNum)) + 1 : 1;
                                  const nextLabel = String(Math.max(nextNum - 1, ...swimMeet.events.map(e => parseInt(evLabel(e), 10) || 0)) + 1);
                                  const heats = Array.from({length: swimNewEvent.heats}, (_, hi) => ({
                                    heatNum: hi + 1,
                                    lanes: Array.from({length: swimNewEvent.lanes}, (_, li) => ({
                                      lane: li + 1, lastName:"", firstName:"", name:"", age:0, team:"", seedTime:"NT", seedMs:null, finalMs:null, dq:false, scratch:false
                                    }))
                                  }));
                                  setSwimMeet(m => ({...m, events: [...m.events, { eventNum:nextNum, eventLabel:nextLabel, gender:swimNewEvent.gender, ageGroup:swimNewEvent.ageGroup, distance:swimNewEvent.distance, stroke:swimNewEvent.stroke, course:m.pool, heats }]}));
                                  setSwimAddEventOpen(false);
                                }}>
                                Add Event
                              </button>
                            </div>
                          )}
                        </div>

                            </>
                          )}
                          {st === 4 && (
                            <>
                        <SwimEntriesPanel meet={swimMeet} setMeet={setSwimMeet} athletes={swimAthletes} saveAthletes={persistSwimAthletes} teamLib={swimTeamLib} onManageTeams={() => setSwimView("athletes")} />
                            </>
                          )}
                          {st === 5 && (
                            <div>
                              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                                {summaries.slice(0, 4).map((x, i) => (
                                  <div key={i} style={{ ...rowStyle(x.done ? TM.swim : TM.line) }}>
                                    <div style={{ fontSize: 17, fontWeight: 800 }}>{x.title}</div>
                                    <div style={TM_CAPTION}>{x.summary}</div>
                                  </div>
                                ))}
                              </div>
                              <div style={{ display: "flex", gap: 8, marginTop: 18, flexWrap: "wrap" }}>
                                <button style={{ ...btnStyle(TM.ink, true), flex: 1 }} disabled={nEvents === 0}
                                  onClick={() => { saveCurentMeet(); setSwimSavedAt(Date.now()); }}>{swimSavedAt && Date.now() - swimSavedAt < 5000 ? "✓ Saved" : "Save meet"}</button>
                                <button style={{ ...btnStyle(TM.ink, true), flex: 1 }} disabled={nEvents === 0}
                                  onClick={() => { persistSwimArchive(swimMeet); alert("Meet saved to archive!"); }}>Save to archive</button>
                              </div>
                              {nEvents === 0 && <div style={{ ...TM_CAPTION, marginTop: 8 }}>Add at least one event (step 3) before saving.</div>}
                              <div style={{ marginTop: 18 }}>
                                <SwimShareCard meet={swimMeet} setMeet={setSwimMeet} onImport={importMeetJson} onSeed={seedAllEvents} onOpenFiles={() => setSwimView("files")} />
                              </div>
                            </div>
                          )}
                        </>
                      );
                      if (st === 0) {
                        return (
                          <WizardStepList heading="Meet setup" subheading={swimMeet.meetName || "Swim meet"} steps={summaries} onJump={setSwimSetupStep}>
                            {swimFileMsg && (
                              <div role="status" style={{ ...rowStyle(TM.run), marginTop: 16, fontSize: 15, fontWeight: 700 }}>✓ {swimFileMsg.text}</div>
                            )}
                            <button onClick={() => setSwimView("race")} disabled={nEvents === 0}
                              style={{ ...btnStyle(TM.ink), width: "100%", marginTop: 24, opacity: nEvents === 0 ? 0.45 : 1 }}>Go to race →</button>
                            <div style={{ marginTop: 16 }}>
                              <SwimShareCard meet={swimMeet} setMeet={setSwimMeet} onImport={importMeetJson} onSeed={seedAllEvents} onOpenFiles={() => setSwimView("files")} />
                            </div>
                          </WizardStepList>
                        );
                      }
                      return (
                        <WizardFrame step={st} titles={SWIM_STEPS} title={SWIM_STEPS[st - 1]}
                          onJump={setSwimSetupStep} onList={() => setSwimSetupStep(0)}
                          onBack={st > 1 ? () => setSwimSetupStep(st - 1) : () => setView("myraces")}
                          onNext={st === 5 ? () => setSwimView("race") : () => { if (st === 1 && codeBlocksNext) return; setSwimSetupStep(st + 1); }}
                          nextLabel={st === 5 ? "Go to race →" : "Next →"}
                          nextDisabled={st === 5 && nEvents === 0}
                          nextHint={st === 5 ? (nEvents ? `${nEvents} event${nEvents !== 1 ? "s" : ""} ready` : "Add an event first") : null}>
                          {content}
                        </WizardFrame>
                      );
                    })()}

                    {/* ── RACE ── */}
                    {swimView === "race" && (
                      <div>
                        {swimDayOpen && renderSwimDay()}
                        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
                          <button onClick={() => setSwimDayOpen("swimmers")} style={{ ...btnStyle(TM.ink, true), minHeight: 42, padding: "0 12px", fontSize: 15, flex: "1 1 140px" }}>👥 Scratch swimmers & events</button>
                          <button onClick={() => setSwimDayOpen("relays")} style={{ ...btnStyle(TM.ink, true), minHeight: 42, padding: "0 12px", fontSize: 15, flex: "1 1 100px" }}>Relays</button>
                          <button onClick={() => setSwimDayOpen("combine")} style={{ ...btnStyle(TM.ink, true), minHeight: 42, padding: "0 12px", fontSize: 15, flex: "1 1 140px" }}>⇄ Combine events</button>
                        </div>
                        {!activeEv || !activeHt ? (
                          <div>
                            <h2 style={{ ...TM_H2, marginTop: 4 }}>Pick a heat to start</h2>
                            {swimMeet.events.length === 0 ? (
                              <div style={{ ...rowStyle(), ...TM_CAPTION, marginTop: 10 }}>No events yet — add them in Setup.</div>
                            ) : !swimMeet.events.some(ev => swimEvHasSwimmers(swimMeet, ev)) && (
                              <div style={{ ...rowStyle(), ...TM_CAPTION, marginTop: 10 }}>No swimmers entered yet. Events with nobody in them are skipped on race day.</div>
                            )}
                            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 10 }}>
                              {swimMeet.events.filter(ev => swimEvHasSwimmers(swimMeet, ev)).map(ev => (
                                <div key={ev.eventNum} style={{ ...rowStyle(TM.swim) }}>
                                  <div style={{ fontSize: 16, fontWeight: 900 }}>{swimMeet.events.some(o => o.mergedInto === ev.eventNum)
                                    ? <>Events {combinedLabel(swimMeet, ev)} · {[ev, ...swimMeet.events.filter(o => o.mergedInto === ev.eventNum)].map(x => `${x.gender} ${x.ageGroup}`).join(" + ")} {ev.distance} {ev.stroke} <span style={{ color: TM.run }}>· combined</span></>
                                    : <>Event {evLabel(ev)} · {ev.gender} {ev.ageGroup} {ev.distance} {ev.stroke}</>}</div>
                                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
                                    {ev.heats.filter(h => h.lanes.some(l => l.name && !l.scratch)).map(h => {
                                      const n = h.lanes.filter(l => l.name && !l.scratch).length;
                                      const done = n > 0 && h.lanes.filter(l => l.name && !l.scratch).every(l => l.finalMs != null || l.dq);
                                      return (
                                        <button key={h.heatNum} onClick={() => { setSwimActiveEvent(ev.eventNum); setSwimActiveHeat(h.heatNum); }}
                                          style={{ ...btnStyle(TM.ink, done), minHeight: 44, padding: "0 14px", fontSize: 15 }}>
                                          {done ? "✓ " : "▶ "}Heat {h.heatNum} · {n} {isRelayEv(ev) ? "relay" : "swimmer"}{n === 1 ? "" : "s"}
                                        </button>
                                      );
                                    })}
                                  </div>
                                  {ev.heats.every(h => !h.lanes.some(l => l.name)) && (ev.entries || []).length > 0 && (
                                    <div style={{ ...TM_CAPTION, marginTop: 6, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                                      <span>Not seeded yet — heats and lanes aren't set.</span>
                                      <button onClick={() => seedAllEvents()} style={{ ...btnStyle(TM.swim), minHeight: 40, padding: "0 12px", fontSize: 14 }}>🌱 Seed every event now</button>
                                    </div>
                                  )}
                                </div>
                              ))}
                            </div>
                            <button style={{ ...btnStyle("#04613F", true), marginTop: 16 }} onClick={() => { setSwimSetupStep(0); setSwimView("setup"); }}>← Back to Setup</button>
                          </div>
                        ) : (
                          <div>
                            {/* Event / heat header */}
                            <div style={{ ...S.card, marginBottom:10 }}>
                              <div style={{ fontSize:14, color:"#3D434B", fontWeight:700, letterSpacing:1.2, textTransform:"uppercase" }}>
                                Event {combinedLabel(swimMeet, activeEv)} &mdash; {[activeEv, ...swimMeet.events.filter(o => o.mergedInto === activeEv.eventNum)].map(x => `${x.gender} ${x.ageGroup}`).join(" + ")} {activeEv.distance} {activeEv.stroke}
                              </div>
                              <div style={{ fontSize:14, color:"#04613F", marginTop:2 }}>
                                Heat {heatIndex + 1} of {totalHeats}
                              </div>
                            </div>

                            {/* Clock */}
                            <div style={{ background:"#FFFFFF", border:"2px solid #C9C5BC", borderRadius:8, padding:"20px 16px", textAlign:"center", marginBottom:14 }}>
                              <div style={{ fontSize:52, fontWeight:700, letterSpacing:1.2, color: swimClockRunning ? "#0B3FCC" : "#0B0D10", fontVariantNumeric:"tabular-nums" }}>
                                {formatSwimTime(swimClockMs)}
                              </div>
                              <div style={{ display:"flex", gap:10, justifyContent:"center", marginTop:12, flexWrap:"wrap" }}>
                                {!swimClockStarted ? (<>
                                  <div style={{ width: "100%", display: "flex", gap: 8, alignItems: "center", justifyContent: "center", flexWrap: "wrap", marginBottom: 4 }}>
                                    <label style={{ fontSize: 14, fontWeight: 700 }}>Start sound{" "}
                                      <select defaultValue={startSoundChoice()} onChange={e => { try { localStorage.setItem("swim-start-sound", e.target.value); } catch (_) {} }}
                                        style={{ fontSize: 15, padding: "6px 8px", borderRadius: 6, border: `2px solid ${TM.line}` }}>
                                        {Object.entries(START_SOUNDS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                                      </select>
                                    </label>
                                    <button onClick={() => playStartTone()} style={{ ...btnStyle(TM.ink, true), minHeight: 36, padding: "0 12px", fontSize: 14 }}>🔈 Test</button>
                                  </div>
                                  <button onClick={sayTakeYourMarks}
                                    style={{ ...btnStyle(TM.ink, true), fontSize:16, padding:"12px 18px" }}>
                                    🔊 Take your marks
                                  </button>
                                  <button onPointerDown={e => startAll(e)} onClick={e => { if (e.detail === 0) startAll(e); }} style={{ ...btnStyle("#0B3FCC"), fontSize:16, padding:"12px 40px", letterSpacing:1.2 }}>
                                    ▶ START ALL
                                  </button>
                                </>) : (
                                  <>
                                    <button onClick={() => setSwimClockRunning(r => !r)}
                                      style={{ ...btnStyle(swimClockRunning ? "#8A5A00" : "#0B3FCC"), fontSize:14, padding:"8px 20px" }}>
                                      {swimClockRunning ? "⏸ Pause" : "▶ Resume"}
                                    </button>
                                    <button onClick={restartHeat}
                                      style={{ ...btnStyle("#B3001B", true), fontSize:14, padding:"8px 16px" }}>
                                      ↺ Reset
                                    </button>
                                  </>
                                )}
                              </div>
                            </div>

                            {/* Live Session panel */}
                            <div style={{ background:"#FFFFFF", border:"2px solid #C9C5BC", borderRadius:8, padding:"12px 14px", marginBottom:14 }}>
                              <div style={{ fontSize:14, fontWeight:700, letterSpacing:1.2, textTransform:"uppercase", color:"#3D434B", marginBottom:8 }}>📡 Live Session</div>
                              {!swimLiveCode ? (
                                <button style={{ ...btnStyle("#04613F"), fontSize:14, padding:"8px 20px" }} onClick={async () => {
                                  const savedMeet = swimSavedMeets.find(m => m.id === swimMeet._id);
                                  if (!swimMeet._id || !savedMeet) {
                                    if ((swimMeet.meetName || "").trim()) { saveAndStartLiveSession(swimMeet.meetName); return; }
                                    setSwimSaveBeforeName(n => n || swimMeet.meetName || ""); setSwimShowSaveBefore(true); return;
                                  }
                                  const code = savedMeet.code || swimMeet.code || generateSwimCode();
                                  // swimLive is writable by any signed-in user, so never
                                  // take over a code another host's meet is using.
                                  const free = await codeIsFree(code);
                                  if (!free) { alert(`The code ${code} is already in use by another race. Pick a different code in step 1 of setup.`); return; }
                                  persistSwimMeets(swimSavedMeets.map(m => m.id === swimMeet._id ? { ...m, code, live: true } : m));
                                  if (swimMeet.listed !== false) listRace(code, "swim", { name: swimMeet.meetName || "Swim meet", status: "live", ...eventWhen(swimMeet.date, swimMeet.startTime, swimMeet.liveLeadMin) }); else unlistRace(code);
                                  rtdb.ref(`swimLive/${code}`).set({
                                    hostUid: currentUser ? currentUser.uid : null,
                                    meetName: swimMeet.meetName || "Unnamed Meet",
                                    pool: swimMeet.pool,
                                    activeEvent: swimActiveEvent,
                                    activeHeat: swimActiveHeat,
                                    status: "waiting",
                                    startedAt: null,
                                    events: swimMeet.events,
                                    results: null,
                                    heatResults: null,
                                  }).catch(console.error);
                                  setSwimLiveCode(code);
                                  syncServerClock(`swimLive/${code}/clock/host`);
                                }}>
                                  Start Live Session
                                </button>
                              ) : (
                                <div>
                                  <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap", marginBottom:6 }}>
                                    <span style={{ fontSize:14, color:"#3D434B" }}>Code:</span>
                                    <span style={{ fontSize:24, fontWeight:700, letterSpacing:1.2, color:"#0B3FCC", fontFamily:"monospace" }}>{swimLiveCode}</span>
                                    <button style={{ ...btnStyle("#04613F", true), padding:"4px 10px", fontSize:14 }} onClick={() => navigator.clipboard?.writeText(swimLiveCode).catch(() => {})}>
                                      📋 Copy
                                    </button>
                                    <button style={{ ...btnStyle("#B3001B", true), padding:"4px 10px", fontSize:14 }} onClick={() => {
                                      rtdb.ref(`swimLive/${swimLiveCode}`).remove().catch(console.error); unlistRace(swimLiveCode);
                                      // Not live any more: a reload must not bring the session back.
                                      persistSwimMeets(swimSavedMeets.map(m => m.code === swimLiveCode ? { ...m, live: false } : m));
                                      setSwimLiveCode(null);
                                    }}>
                                      Stop
                                    </button>
                                  </div>
                                  <div style={{ fontSize:14, color:"#3D434B" }}>Lane timers: open the app → <b>Lane timer</b> → this code → their lane. Parents: <b>Parent</b> → this code. Or send a link:</div>
                                  <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginTop:8 }}>
                                    <button style={{ ...btnStyle(TM.ink, true), minHeight:40, padding:"0 12px", fontSize:14 }} onClick={() => navigator.clipboard?.writeText(location.origin + location.pathname + "?lane=" + swimLiveCode).catch(() => {})}>🔗 Copy lane timer link</button>
                                    <button style={{ ...btnStyle(TM.ink, true), minHeight:40, padding:"0 12px", fontSize:14 }} onClick={() => navigator.clipboard?.writeText(location.origin + location.pathname + "?meet=" + swimLiveCode).catch(() => {})}>🔗 Copy parent link</button>
                                  </div>
                                  <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginTop: 8 }} aria-label="Lane timers connected">
                                    {Array.from({ length: swimMeet.lanes || 8 }, (_, i) => i + 1).map(n => {
                                      const on = timerOn(n), t = swimTimersLive[n];
                                      return <div key={n} title={on && t && t.name ? t.name : ""} style={{ flex: "1 0 40px", minWidth: 40, textAlign: "center", borderRadius: 6, padding: "6px 2px", overflow: "hidden", fontWeight: 900, fontSize: 15,
                                        background: on ? "#04613F" : "#FFFFFF", color: on ? "#FFFFFF" : "#3D434B", border: `2px solid ${on ? "#04613F" : "#C9C5BC"}` }}>
                                        {n}<div style={{ fontSize: 11, fontWeight: 700 }}>{on ? (t && t.name ? String(t.name).slice(0, 8) : "on") : "—"}</div></div>;
                                    })}
                                  </div>
                                </div>
                              )}
                            </div>

                            {/* Lane cards */}
                            {activeHt.lanes.sort((a,b) => a.lane - b.lane).map(sw => {
                              const finished = sw.finalMs != null;
                              const isDq = sw.dq;
                              const tOn = swimLiveCode && timerOn(sw.lane);
                              return (
                                <div key={sw.lane} style={{ background: tOn ? "#CDEFD8" : "#EFEDE8", boxShadow: tOn ? "inset 0 0 0 3px #04613F" : "none", border: `2px solid ${swimHostClickerDetecting === sw.lane ? "#8A5A00" : finished ? "#C9C5BC" : isDq ? "#C9C5BC" : "#C9C5BC"}`, borderRadius:8, padding:"12px 14px", marginBottom:8 }}>
                                  <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
                                    <div style={{ background: swimLiveCode && timerOn(sw.lane) ? "#04613F" : "#EFEDE8", borderRadius:4, padding:"4px 10px", fontSize:14, fontWeight:700, color: swimLiveCode && timerOn(sw.lane) ? "#FFFFFF" : "#04613F", textAlign: "center" }}>
                                      Lane {sw.lane}
                                      {swimLiveCode && <div style={{ fontSize: 11, fontWeight: 800 }}>{timerOn(sw.lane) ? "● timer" : "no timer"}</div>}
                                    </div>
                                    <div style={{ flex:1 }}>
                                      <div style={{ fontSize:14, fontWeight:600, color: isDq ? "#B3001B" : "#0B0D10" }}>
                                        {sw.name || "(Empty Lane)"} {isDq && <span style={{ fontSize:14, color:"#B3001B" }}>DQ</span>}
                                      </div>
                                      <div style={{ fontSize:14, color:"#3D434B" }}>{sw.team}{sw.age ? ` · Age ${sw.age}` : ""}{sw.seedTime && sw.seedTime !== "NT" ? ` · Seed: ${sw.seedTime}` : ""}
                                        {sw.fromEvent && swimMeet.events.some(o => o.mergedInto === activeEv.eventNum) && (() => { const fe = swimMeet.events.find(o => o.eventNum === sw.fromEvent); return fe ? <span style={{ fontWeight: 800, color: TM.swim }}> · Ev {evLabel(fe)} {fe.ageGroup}</span> : null; })()}</div>
                                      {(sw.legs || []).some(Boolean) && <div style={{ fontSize: 13, color: "#3D434B" }}>{(sw.legs || []).map((l, i) => l ? `${i + 1}. ${l.name}` : `${i + 1}. —`).join("  ")}</div>}
                                    </div>
                                    {(() => {
                                      const assigned = swimHostClickers.find(c => c.lane === sw.lane);
                                      const detecting = swimHostClickerDetecting === sw.lane;
                                      if (detecting) return (
                                        <div style={{ fontSize:14, color:"#8A5A00", fontWeight:700, whiteSpace:"nowrap" }}>⏳ Press clicker… (Esc to cancel)</div>
                                      );
                                      if (assigned) return (
                                        <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                                          <span style={{ background:"#EFEDE8", border:"2px solid #C9C5BC", borderRadius:4, padding:"2px 8px", fontSize:14, color:"#04613F", fontFamily:"monospace" }}>
                                            🎯 {assigned.key === " " ? "Space" : assigned.key}
                                          </span>
                                          <button onClick={() => setSwimHostClickers(cs => cs.filter(c => c.lane !== sw.lane))}
                                            style={{ background:"none", border:"none", color:"#3D434B", cursor:"pointer", fontSize:14, lineHeight:1, padding:"0 2px" }}>×</button>
                                        </div>
                                      );
                                      return (
                                        <button onClick={() => setSwimHostClickerDetecting(sw.lane)}
                                          style={{ background:"none", border:"2px dashed #C9C5BC", borderRadius:4, padding:"2px 8px", fontSize:14, color:"#3D434B", cursor:"pointer", whiteSpace:"nowrap" }}>
                                          🎯 +
                                        </button>
                                      );
                                    })()}
                                    <div style={{ fontSize:20, fontWeight:700, fontVariantNumeric:"tabular-nums", color: finished ? "#0B3FCC" : "#3D434B" }}>
                                      {finished ? formatSwimTime(sw.finalMs) : "--:--.--"}
                                    </div>
                                  </div>
                                  <div style={{ display:"flex", gap:8 }}>
                                    <button
                                      onPointerDown={e => { if (!sw.scratch) recordFinish(activeEv.eventNum, activeHt.heatNum, sw.lane, eventEpoch(e)); }}
                                      onClick={e => { if (e.detail === 0 && !sw.scratch) recordFinish(activeEv.eventNum, activeHt.heatNum, sw.lane, eventEpoch(e)); }}
                                      disabled={sw.scratch || isDq}
                                      style={{ flex:1, padding:"10px", fontSize:14, fontWeight:700, letterSpacing:1, borderRadius:6, cursor: sw.scratch || isDq ? "default" : "pointer", background: finished ? "#EFEDE8" : "#EFEDE8", border: `2px solid ${finished ? "#0B3FCC" : "#C9C5BC"}`, color: finished ? "#0B3FCC" : "#0B0D10", opacity: sw.scratch || isDq ? 0.4 : 1 }}>
                                      {finished ? `✓ ${formatSwimTime(sw.finalMs)}` : "FINISH"}
                                    </button>
                                    <button onClick={() => toggleDq(activeEv.eventNum, activeHt.heatNum, sw.lane)}
                                      style={{ padding:"10px 14px", fontSize:14, fontWeight:700, borderRadius:6, cursor:"pointer", background: isDq ? "#B3001B" : "#FFFFFF", border:`2px solid ${isDq ? "#B3001B" : "#C9C5BC"}`, color: isDq ? "#FFFFFF" : "#3D434B" }}>
                                      DQ
                                    </button>
                                    <button onClick={() => setSwimMeet(m => ({...m, events: m.events.map(ev => ev.eventNum !== activeEv.eventNum ? ev : { ...ev, heats: ev.heats.map(h => h.heatNum !== activeHt.heatNum ? h : { ...h, lanes: h.lanes.map(s => s.lane !== sw.lane ? s : {...s, scratch: !s.scratch, finalMs: null}) }) }) }))}
                                      style={{ padding:"10px 10px", fontSize:14, fontWeight:700, borderRadius:6, cursor:"pointer", background: sw.scratch ? "#8A5A00" : "#FFFFFF", border:`2px solid ${sw.scratch ? "#8A5A00" : "#C9C5BC"}`, color: sw.scratch ? "#FFFFFF" : "#3D434B" }}>
                                      SCR
                                    </button>
                                  </div>
                                </div>
                              );
                            })}

                            {/* Footer buttons */}
                            <div style={{ display:"flex", gap:10, marginTop:16 }}>
                              <button onClick={() => { setSwimSetupStep(0); setSwimView("setup"); }}
                                style={{ ...btnStyle("#04613F", true), flex:1, fontSize:14 }}>
                                ← Back to Setup
                              </button>
                              <button onClick={saveAndAdvance}
                                style={{ ...btnStyle("#0B3FCC"), flex:2, fontSize:14 }}>
                                Save &amp; Next Heat →
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    )}

                    {/* ── RESULTS ── */}
                    {swimView === "results" && (
                      <div>
                        {swimMeet.events.length === 0 ? (
                          <div style={{ textAlign:"center", padding:"40px 0", color:"#3D434B" }}>No events. Import or create events in Setup.</div>
                        ) : (
                          <div>
                            {/* Event selector — opens on the latest event with times in it */}
                            <div style={S.card}>
                              <div style={S.label}>Select Event</div>
                              <select value={swimResultsEvent || swimAutoResultsEvent || ""} onChange={e => setSwimResultsEvent(parseInt(e.target.value))}
                                style={{...S.input}}>
                                <option value="">-- choose event --</option>
                                {swimMeet.events.map(ev => (
                                  <option key={ev.eventNum} value={ev.eventNum}>
                                    Event {evLabel(ev)} — {ev.gender} {ev.ageGroup} {ev.distance} {ev.stroke}
                                  </option>
                                ))}
                              </select>
                            </div>

                            {/* Results tabs */}
                            <div style={{ display:"flex", gap:6, marginBottom:12 }}>
                              <button style={swimTabStyle(swimResultsTab === "results")} onClick={() => setSwimResultsTab("results")}>Event Results</button>
                              <button style={swimTabStyle(swimResultsTab === "scores")} onClick={() => setSwimResultsTab("scores")}>Team Scores</button>
                              <button style={swimTabStyle(swimResultsTab === "enter")} onClick={() => setSwimResultsTab("enter")}>✍️ Enter times</button>
                            </div>
                            {swimResultsTab === "enter" && <SwimTimesEntry meet={swimMeet} setMeet={setSwimMeet} />}
                            {(() => {
                              const swims = meetSwims(swimMeet);
                              if (!swims.length) return null;
                              const mine = new Set(swimTeamLib.map(t => t.code));
                              const known = swims.filter(x => mine.has(x.team));
                              return (
                                <div style={{ ...rowStyle(TM.run), margin: "0 0 12px", display: "flex", flexDirection: "column", gap: 8 }}>
                                  <div style={{ fontWeight: 800 }}>{swims.length} times recorded in this meet</div>
                                  <button disabled={!known.length} onClick={() => {
                                    const r = addSwimsToAthletes(swimAthletes, known); persistSwimAthletes(r.athletes);
                                    alert(`Saved ${r.added} new time${r.added === 1 ? "" : "s"} to swimmer profiles${r.created ? ` (${r.created} new swimmers)` : ""}.`);
                                  }} style={{ ...btnStyle(TM.ink), opacity: known.length ? 1 : 0.5 }}>💾 Save times to my swimmers' profiles</button>
                                  {!known.length && <div style={TM_CAPTION}>None of these teams are in your Swim Teams yet.</div>}
                                  <button onClick={() => shareOrDownload(`${safeFileName(swimMeet.meetName)} - results.json`,
                                      JSON.stringify({ app: "swimmeet.studio", kind: "results", version: 1, meet: { meetName: swimMeet.meetName, date: swimMeet.date || null, meetUid: swimMeet.meetUid || null }, swims }, null, 1))}
                                    style={btnStyle(TM.ink, true)}>⬇ Export results</button>
                                  <SwimLabelsCard meet={swimMeet} />
                                </div>
                              );
                            })()}

                            {swimResultsTab === "results" && (() => {
                              const selEv = resultEvents(swimMeet.events).find(e => e.eventNum === (swimResultsEvent || swimAutoResultsEvent));
                              if (!selEv) return <div style={{ color:"#3D434B", textAlign:"center", padding:24 }}>No times yet — pick an event above once a heat has been swum.</div>;

                              const allSwimmers = selEv.heats.flatMap(h => h.lanes.map(sw => ({...sw, heatNum: h.heatNum})));
                              const finishers = allSwimmers.filter(s => s.finalMs != null && !s.dq && !s.scratch).sort((a,b) => a.finalMs - b.finalMs);
                              const dqs = allSwimmers.filter(s => s.dq);
                              const scratches = allSwimmers.filter(s => s.scratch && !s.dq);
                              const dnf = allSwimmers.filter(s => s.finalMs == null && !s.dq && !s.scratch);
                              const pts = [6,4,3,2,1];

                              return (
                                <div>
                                  {/* Heat breakdown */}
                                  {selEv.heats.map(ht => {
                                    const heatSwimmers = ht.lanes.slice().sort((a,b) => {
                                      if (a.finalMs != null && b.finalMs != null) return a.finalMs - b.finalMs;
                                      if (a.finalMs != null) return -1;
                                      return 1;
                                    });
                                    return (
                                      <div key={ht.heatNum} style={{ ...S.card, marginBottom:8 }}>
                                        <div style={{ fontSize:14, fontWeight:700, color:"#04613F", marginBottom:8 }}>Heat {ht.heatNum}</div>
                                        <table style={{ width:"100%", borderCollapse:"collapse", fontSize:14 }}>
                                          <thead>
                                            <tr>
                                              {["Ln","Name","Age","Team","Seed","Final"].map(h => (
                                                <th key={h} style={{ textAlign: h === "Ln" || h === "Age" ? "center" : "left", padding:"4px 6px", color:"#3D434B", fontSize:14, fontWeight:700, letterSpacing:1, textTransform:"uppercase", borderBottom:"2px solid #C9C5BC" }}>{h}</th>
                                              ))}
                                            </tr>
                                          </thead>
                                          <tbody>
                                            {heatSwimmers.map(sw => (
                                              <tr key={sw.lane}>
                                                <td style={{ textAlign:"center", padding:"5px 6px", color:"#04613F" }}>{sw.lane}</td>
                                                <td style={{ padding:"5px 6px", color: sw.dq ? "#B3001B" : "#0B0D10" }}>{sw.name || "—"}{sw.dq ? " DQ" : sw.scratch ? " SCR" : ""}</td>
                                                <td style={{ textAlign:"center", padding:"5px 6px", color:"#3D434B" }}>{sw.age || ""}</td>
                                                <td style={{ padding:"5px 6px", color:"#3D434B" }}>{sw.team}</td>
                                                <td style={{ padding:"5px 6px", color:"#3D434B" }}>{sw.seedTime || "NT"}</td>
                                                <td style={{ padding:"5px 6px", fontWeight: sw.finalMs != null && !sw.dq ? 700 : 400, color: sw.dq ? "#B3001B" : sw.finalMs != null ? "#0B3FCC" : "#3D434B" }}>
                                                  {sw.dq ? "DQ" : sw.scratch ? "SCR" : sw.finalMs != null ? formatSwimTime(sw.finalMs) : "--"}
                                                </td>
                                              </tr>
                                            ))}
                                          </tbody>
                                        </table>
                                      </div>
                                    );
                                  })}

                                  {/* Overall standings */}
                                  <div style={{ ...S.card }}>
                                    <div style={{ fontSize:14, fontWeight:700, color:"#8A5A00", marginBottom:8 }}>Overall Event Standings</div>
                                    <table style={{ width:"100%", borderCollapse:"collapse", fontSize:14 }}>
                                      <thead>
                                        <tr>
                                          {["Pl","Name","Age","Team","Seed","Final","Pts"].map(h => (
                                            <th key={h} style={{ textAlign: ["Pl","Age","Pts"].includes(h) ? "center" : "left", padding:"4px 6px", color:"#3D434B", fontSize:14, fontWeight:700, letterSpacing:1, textTransform:"uppercase", borderBottom:"2px solid #C9C5BC" }}>{h}</th>
                                          ))}
                                        </tr>
                                      </thead>
                                      <tbody>
                                        {finishers.map((sw, i) => (
                                          <tr key={`${sw.heatNum}-${sw.lane}`} style={{ background: i % 2 === 0 ? "transparent" : "#EFEDE8" }}>
                                            <td style={{ textAlign:"center", padding:"5px 6px", fontWeight:700, color: i === 0 ? "#8A5A00" : i === 1 ? "#3D434B" : i === 2 ? "#B44A00" : "#0B0D10" }}>{i+1}</td>
                                            <td style={{ padding:"5px 6px", color:"#0B0D10" }}>{sw.name}{(sw.legs || []).some(Boolean) && <div style={{ fontSize: 12, color: "#3D434B" }}>{sw.legs.map((l, k) => l ? `${k + 1}. ${l.name}` : "").filter(Boolean).join(", ")}</div>}</td>
                                            <td style={{ textAlign:"center", padding:"5px 6px", color:"#3D434B" }}>{sw.age}</td>
                                            <td style={{ padding:"5px 6px", color:"#3D434B" }}>{sw.team}</td>
                                            <td style={{ padding:"5px 6px", color:"#3D434B" }}>{sw.seedTime || "NT"}</td>
                                            <td style={{ padding:"5px 6px", fontWeight:700, color:"#0B3FCC" }}>{formatSwimTime(sw.finalMs)}</td>
                                            <td style={{ textAlign:"center", padding:"5px 6px", fontWeight:700, color:"#8A5A00" }}>{i < pts.length ? pts[i] : ""}</td>
                                          </tr>
                                        ))}
                                        {dqs.map(sw => (
                                          <tr key={`dq-${sw.heatNum}-${sw.lane}`}>
                                            <td style={{ textAlign:"center", padding:"5px 6px", color:"#B3001B" }}>DQ</td>
                                            <td colSpan={5} style={{ padding:"5px 6px", color:"#B3001B" }}>{sw.name} — {sw.team}</td>
                                            <td></td>
                                          </tr>
                                        ))}
                                        {scratches.map(sw => (
                                          <tr key={`scr-${sw.heatNum}-${sw.lane}`}>
                                            <td style={{ textAlign:"center", padding:"5px 6px", color:"#3D434B" }}>SCR</td>
                                            <td colSpan={5} style={{ padding:"5px 6px", color:"#3D434B" }}>{sw.name} — {sw.team}</td>
                                            <td></td>
                                          </tr>
                                        ))}
                                        {dnf.map(sw => (
                                          <tr key={`dnf-${sw.heatNum}-${sw.lane}`}>
                                            <td style={{ textAlign:"center", padding:"5px 6px", color:"#3D434B" }}>—</td>
                                            <td colSpan={5} style={{ padding:"5px 6px", color:"#3D434B" }}>{sw.name} — {sw.team}</td>
                                            <td></td>
                                          </tr>
                                        ))}
                                      </tbody>
                                    </table>
                                  </div>

                                  {/* Print buttons */}
                                  <div style={{ display:"flex", gap:8, marginTop:8 }}>
                                    <button style={{ ...btnStyle("#3D434B", true), flex:1, fontSize:14 }}
                                      onClick={() => printSwimResults(selEv, swimMeet.meetName)}>
                                      🖨 Print Results
                                    </button>
                                    <button style={{ ...btnStyle("#8A5A00", true), flex:1, fontSize:14 }}
                                      onClick={() => printRibbonLabels(selEv, swimMeet.meetName)}>
                                      🏷 Print Ribbon Labels
                                    </button>
                                  </div>
                                </div>
                              );
                            })()}

                            {swimResultsTab === "scores" && (() => {
                              const teamScores = computeTeamScores(swimMeet.events);
                              return (
                                <div style={S.card}>
                                  <div style={{ fontSize:14, fontWeight:700, color:"#8A5A00", marginBottom:12 }}>Team Scores — All Events</div>
                                  {teamScores.length === 0 ? (
                                    <div style={{ color:"#3D434B", fontSize:14 }}>No results recorded yet.</div>
                                  ) : (
                                    <table style={{ width:"100%", borderCollapse:"collapse", fontSize:14 }}>
                                      <thead>
                                        <tr>

                                          <th style={{ textAlign:"right", padding:"6px 8px", color:"#3D434B", fontSize:14, fontWeight:700, letterSpacing:1, textTransform:"uppercase", borderBottom:"2px solid #C9C5BC" }}>Points</th>

                                              {i === 0 ? "🏆 " : `${i+1}. `}{team}
                                            </td>
                                            <td style={{ padding:"8px 8px", textAlign:"right", fontWeight:700, color: i === 0 ? "#8A5A00" : "#0B0D10" }}>{pts}</td>
                                          </tr>
                                        ))}
                                      </tbody>
                                    </table>
                                  )}
                                </div>
                              );
                            })()}

                            <button style={{ ...btnStyle("#8A5A00"), width:"100%", marginTop:8 }}
                              onClick={() => { persistSwimArchive(swimMeet); alert("Meet saved to archive!"); }}>
                              💾 Save Meet to Archive
                            </button>
                          </div>
                        )}
                      </div>
                    )}

                    {/* ── DEVICES ── */}
                    {swimView === "files" && (() => {
                      const myTeam = (() => { try { return localStorage.getItem("swim-my-team") || ""; } catch (_) { return ""; } })();
                      const setMyTeam = c => { try { localStorage.setItem("swim-my-team", c); } catch (_) {} setSwimFilesTick(t => t + 1); };
                      const ensureUid = () => { if (swimMeet.meetUid) return swimMeet; const m = { ...swimMeet, meetUid: newId("meet") }; setSwimMeet(m); return m; };
                      const nm = safeFileName(swimMeet.meetName);
                      async function filesImport(section, files) {
                        let lib = swimAthletes, teamsAcc = [...swimTeamLib];
                        const out = [];
                        let libChanged = false;
                        const mine = () => { try { return localStorage.getItem("swim-my-team") || ""; } catch (_) { return ""; } };
                        const addTeam = t => { if (t && t.code && !teamsAcc.some(x => x.code === t.code)) teamsAcc.push({ code: t.code, name: t.name.replace(/\b\w+/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase()) }); };
                        for (const file of files) {
                          if (/\.json$/i.test(file.name)) {
                            let d = null; try { d = JSON.parse(await file.text()); } catch (_) {}
                            if (d && ["swimmeet.studio", "Meet-a-thon", "Timeathon"].includes(d.app) && d.kind === "athletes") {
                              asList(d.teams).forEach(addTeam);
                              const inc = asList(d.athletes);
                              const r1 = addAthletesToLibrary(lib, inc);
                              const swims = inc.flatMap(a => asList(a.results).map(r => ({ ...r, name: a.name, firstName: a.firstName, lastName: a.lastName, team: a.team, gender: a.gender, dob: a.dob })));
                              const r2 = addSwimsToAthletes(r1.athletes, swims);
                              lib = r2.athletes; libChanged = true;
                              out.push(`${r1.added} new athletes, ${r1.updated} updated, ${r2.added} times`);
                            } else { const r = await importMeetJson(file); if (!r.ok) return r; out.push(r.text); }
                            continue;
                          }
                          if (/\.csv$/i.test(file.name)) {
                            const rows = (await file.text()).split(/\r?\n/).filter(Boolean).map(l => (l.match(/("([^"]|"")*"|[^,]*)(,|$)/g) || []).map(c => c.replace(/,$/, "").replace(/^"|"$/g, "").replace(/""/g, '"').trim()));
                            const h = (rows.shift() || []).map(x => x.toLowerCase());
                            const col = (...ks) => h.findIndex(x => ks.some(k => x.includes(k)));
                            const [cl, cf, cg, cb, ct] = [col("last"), col("first"), col("gender", "sex"), col("birth", "dob"), col("team code", "team")];
                            const inc = rows.filter(r => r[cl] || r[cf]).map(r => { const g = (r[cg] || "").toUpperCase(); const b = r[cb] || "";
                              const dob = /^\d{4}-\d\d-\d\d$/.test(b) ? b : (b.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/) ? b.replace(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/, (_, m, d, y) => `${y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`) : null);
                              return { name: `${r[cf] || ""} ${r[cl] || ""}`.trim(), firstName: r[cf] || "", lastName: r[cl] || "", gender: g.startsWith("F") || g.startsWith("G") ? "Girls" : g ? "Boys" : "", dob, team: (r[ct] || mine() || "").toUpperCase() }; });
                            const r1 = addAthletesToLibrary(lib, inc); lib = r1.athletes; libChanged = true;
                            out.push(`${r1.added} new athletes, ${r1.updated} updated from ${file.name}`);
                            continue;
                          }
                          let texts;
                          try { texts = await hytekTexts(file); } catch (_) { return { ok: false, text: `Couldn't open ${file.name}.` }; }
                          if (!texts.length) { out.push(`Nothing Hy-Tek in ${file.name}`); continue; }
                          for (const { name, text } of texts) {
                            if (/\.hyv$/i.test(name)) {
                              if (section !== "events") { out.push(`${name} is an events file — import it under Events`); continue; }
                              let hv; try { hv = parseHyv(text); } catch (e) { return { ok: false, text: e.message }; }
                              useMeetEvents(hv, hv.meetName || name, "Imported");
                              out.push(`${hv.events.length} events from “${hv.meetName || name}”`);
                              continue;
                            }
                            const hy3 = /\.hy3$/i.test(name);
                            const pz = hy3 ? parseHytekHy3(text) : parseSdifResults(text);
                            if (section === "entries") {
                              if (!hy3 || !pz.entries.length) { out.push(`${name} has no entries`); continue; }
                              const t = pz.teams[0] || { code: "TEAM", name: "Team" };
                              const byLabel = Object.fromEntries(swimMeet.events.map(ev => [evLabel(ev).toUpperCase(), ev]));
                              const ents = {}; let missing = 0;
                              pz.entries.forEach(x => {
                                const ev = byLabel[String(x.eventLabel).toUpperCase()];
                                if (!ev) { missing++; return; }
                                const k = normName(x.name);
                                ents[k] = ents[k] || { id: newId("me"), athleteId: null, name: x.name, firstName: x.firstName, lastName: x.lastName, team: t.code, gender: x.gender, age: x.age, dob: x.dob, events: [] };
                                ents[k].events.push({ eventNum: ev.eventNum, seedMs: x.seedMs, seedTime: x.seedMs ? formatSwimTime(x.seedMs) : "NT" });
                              });
                              const list = Object.values(ents);
                              setSwimMeet(m => syncEventEntries({ ...m, teams: [...(m.teams || []).filter(x => x.code !== t.code), { code: t.code, name: t.name }],
                                meetEntries: [...(m.meetEntries || []).filter(e => e.team !== t.code), ...list] }));
                              out.push(`${t.name}: ${list.length} swimmers, ${list.reduce((n, e) => n + e.events.length, 0)} entries${missing ? ` (${missing} for events not in this meet)` : ""}`);
                              continue;
                            }
                            // athletes or results: one team in the file → bring it in; several →
                            // only my team / teams already in Swim Teams.
                            const fileTeams = pz.teams.map(t => t.code);
                            const keep = new Set(fileTeams.length <= 1 ? fileTeams
                              : fileTeams.filter(c => c === mine() || teamsAcc.some(t => t.code === c)));
                            if (!keep.size) { out.push(`${name}: ${fileTeams.length} teams in this file — pick My team above (or make your team in Athletes) so only your swimmers come in`); continue; }
                            pz.teams.filter(t => keep.has(t.code)).forEach(addTeam);
                            const people = (pz.athletes || pz.swims).filter(a => keep.has(a.team));
                            const r1 = addAthletesToLibrary(lib, people);
                            const r2 = addSwimsToAthletes(r1.athletes, pz.swims.filter(sw => keep.has(sw.team)));
                            lib = r2.athletes; libChanged = true;
                            out.push(`${[...keep].join(", ")}: ${r1.added} new athletes, ${r2.added} times${pz.meetName ? ` (${pz.meetName})` : ""}`);
                          }
                        }
                        if (libChanged) persistSwimAthletes(lib);
                        if (teamsAcc.length !== swimTeamLib.length) persistSwimTeams(teamsAcc);
                        return { ok: true, text: out.join(" · ") || "Nothing to import." };
                      }
                      async function filesExport(section, fmt, team) {
                        const m = ensureUid();
                        const save = async (fname, text, type) => {
                          const how = await shareOrDownload(fname, text);
                          return how === "cancelled" ? null : { ok: true, text: how === "shared" ? `Shared ${fname}.` : `Saved “${fname}” — send it by text or email.` };
                        };
                        if (section === "athletes") {
                          const list = team ? swimAthletes.filter(a => sameTeam(a.team, team)) : swimAthletes;
                          const tname = team ? safeFileName((swimTeamLib.find(t => t.code === team) || {}).name || team) : "All teams";
                          if (fmt === "csv") return save(`${tname} - athletes.csv`, athletesCsv(list, swimTeamLib));
                          return save(`${tname} - athletes.json`, JSON.stringify({ app: "swimmeet.studio", kind: "athletes", version: 1, teams: swimTeamLib.filter(t => !team || t.code === team), athletes: list }, null, 1));
                        }
                        if (section === "events") {
                          if (fmt === "hyv") { exportMeetEvents(); return { ok: true, text: "Saved the Hy-Tek events file (.hyv)." }; }
                          return save(`${nm} - events.json`, meetFileText(m, "meet"));
                        }
                        if (section === "entries") return save(`${nm} - ${team} entries.json`, meetFileText(m, "entries", team));
                        if (section === "program") return save(`${nm} - program.json`, meetFileText(m, "program"));
                        if (section === "results") return save(`${nm} - results.json`, JSON.stringify({ app: "swimmeet.studio", kind: "results", version: 1,
                          meet: { meetName: m.meetName, date: m.date || null, meetUid: m.meetUid || null }, swims: meetSwims(m) }, null, 1));
                        return null;
                      }
                      return <SwimFilesPage meet={swimMeet} teams={swimTeamLib} athletes={swimAthletes} onImport={filesImport} onExport={filesExport} myTeam={myTeam} setMyTeam={setMyTeam} />;
                    })()}

                    {swimView === "devices" && (
                      <div>
                        {/* Clicker Assignments */}
                        <div style={S.card}>
                          <div style={{ fontSize:14, fontWeight:700, letterSpacing:1.2, textTransform:"uppercase", color:"#3D434B", marginBottom:10 }}>📡 Clicker Assignments</div>
                          {swimHostClickers.length === 0 ? (
                            <div style={{ fontSize:14, color:"#3D434B", marginBottom:10 }}>No custom buttons. Keys 1–9 finish lanes 1–9 (0 = lane 10) — a wired button box works with no setup.</div>
                          ) : (
                            <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:10 }}>
                              {swimHostClickers.map(c => (
                                <div key={c.lane} style={{ display:"flex", alignItems:"center", gap:10, background:"#FFFFFF", borderRadius:6, padding:"8px 12px" }}>
                                  <span style={{ fontSize:14, color:"#3D434B", width:60 }}>Lane {c.lane}</span>
                                  <span style={{ background:"#EFEDE8", border:"2px solid #C9C5BC", borderRadius:4, padding:"2px 10px", fontFamily:"monospace", fontSize:14, color:"#04613F" }}>
                                    🎯 {c.key === " " ? "Space" : c.key}
                                  </span>
                                  <button onClick={() => setSwimHostClickers(cs => cs.filter(x => x.lane !== c.lane))}
                                    style={{ marginLeft:"auto", background:"none", border:"none", color:"#B3001B", cursor:"pointer", fontSize:16, lineHeight:1 }}>×</button>
                                </div>
                              ))}
                            </div>
                          )}
                          <div style={{ fontSize:14, color:"#3D434B", marginTop:4 }}>
                            To assign a clicker, go to <strong style={{ color:"#04613F" }}>🏁 Race</strong> tab and tap <strong style={{ color:"#04613F" }}>🎯 +</strong> on any lane card.
                          </div>
                        </div>

                        {/* Lane Timer (remote phones) */}
                        <div style={S.card}>
                          <div style={{ fontSize:14, fontWeight:700, letterSpacing:1.2, textTransform:"uppercase", color:"#3D434B", marginBottom:10 }}>🏁 Lane Timer Devices</div>
                          {swimLiveCode ? (
                            <div>
                              <div style={{ fontSize:14, color:"#0B0D10", marginBottom:6 }}>Share this code with lane operators:</div>
                              <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
                                <span style={{ fontSize:28, fontWeight:700, letterSpacing:1.2, color:"#0B3FCC", fontFamily:"monospace" }}>{swimLiveCode}</span>
                                <button style={{ ...btnStyle("#04613F", true), padding:"5px 12px", fontSize:14 }} onClick={() => navigator.clipboard?.writeText(swimLiveCode).catch(() => {})}>
                                  📋 Copy
                                </button>
                              </div>
                              <div style={{ fontSize:14, color:"#3D434B", marginTop:8 }}>
                                Lane timers: open this app → Lane timer → this code → their lane.
                              </div>
                            </div>
                          ) : (
                            <div style={{ fontSize:14, color:"#3D434B" }}>
                              No live session active. Start a session from the <strong style={{ color:"#04613F" }}>🏁 Race</strong> tab to share a code with lane timer operators.
                            </div>
                          )}
                        </div>
                      </div>
                    )}

                    {swimView === "athletes" && (
                      <div style={{ padding: "10px 0 20px" }}>
                        <SwimTeamsView teams={swimTeamLib} saveTeams={persistSwimTeams} athletes={swimAthletes} saveAthletes={persistSwimAthletes} onOpenFiles={() => setSwimView("files")} />
                      </div>
                    )}

                    {swimView === "archive" && (
                      <div>
                        <div style={{ fontSize:14, color:"#3D434B", fontWeight:700, letterSpacing:1.2, textTransform:"uppercase", marginBottom:12 }}>
                          Past Meets ({swimArchive.length})
                        </div>
                        {swimArchive.length === 0 ? (
                          <div style={{ ...S.card, textAlign:"center", color:"#3D434B" }}>No archived meets yet. Save a meet from Setup or Results.</div>
                        ) : swimArchive.map(entry => (
                          <div key={entry.id} style={S.card}>
                            <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between" }}>
                              <div>
                                <div style={{ fontWeight:700, color:"#0B0D10", fontSize:14 }}>{entry.meetName || "Unnamed Meet"}</div>
                                <div style={{ fontSize:14, color:"#3D434B", marginTop:2 }}>
                                  {entry.date} &middot; {entry.pool} &middot; {entry.events.length} event{entry.events.length !== 1 ? "s" : ""}

                              </div>
                              <div style={{ display:"flex", gap:6 }}>

                                      printSwimResults(ev, entry.meetName, allSwimmers);
                                    }
                                  }}
                                  style={{ fontSize:14, padding:"5px 10px", borderRadius:4, background:"transparent", border:"2px solid #C9C5BC", color:"#0B3FCC", cursor:"pointer" }}>
                                  🖨 View
                                </button>
                                <button
                                  onClick={() => {
                                    if (window.confirm(`Delete "${entry.meetName}"?`)) {
                                      const updated = swimArchive.filter(a => a.id !== entry.id);
                                      setSwimArchive(updated);
                                      try { localStorage.setItem("swim-archive", JSON.stringify(updated)); } catch(e) {}
                                      if (currentUser) rtdb.ref("users/"+currentUser.uid+"/swimArchive").set(updated).catch(console.error);
                                    }
                                  }}
                                  style={{ fontSize:14, padding:"5px 10px", borderRadius:4, background:"transparent", border:"2px solid #C9C5BC", color:"#B3001B", cursor:"pointer" }}>
                                  Delete
                                </button>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                  {/* New meet — save current first */}
                  {swimConfirmNewMeet && (
                    <div style={{ position:"fixed", inset:0, background:"rgba(255,255,255,0.92)", zIndex:300, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 20px" }}
                      onClick={e => { if (e.target === e.currentTarget) setSwimConfirmNewMeet(false); }}>
                      <div style={{ background:"#EFEDE8", border:"2px solid #8A5A00", borderRadius:8, padding:"24px 20px", width:"100%", maxWidth:420 }}>
                        <div style={{ fontSize:14, fontWeight:700, color:"#0B0D10", marginBottom:6 }}>Save current meet?</div>
                        <div style={{ fontSize:14, color:"#3D434B", marginBottom:20 }}>
                          {swimMeet.meetName ? `"${swimMeet.meetName}"` : "This meet"} has unsaved changes. Save it before starting a new one?
                        </div>
                        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                          <button onClick={() => { saveCurentMeet(); setSwimConfirmNewMeet(false); setSwimMeet({ meetName:"", pool:"25y", events:[], code: friendlyCode() }); setSwimSetupStep(1); setSwimLiveCode(null); setSwimView("setup"); }}
                            style={{ ...btnStyle("#8A5A00"), padding:"11px", fontSize:14 }}>
