      // ── Hy-Tek .hy3 (Team Manager / Meet Manager) ─────────────────────────────
      // C1 = team, D1 = swimmer (name, birthday, age), E1 = one swim (event
      // number, distance, stroke, seed time), E2 after an E1 = its result.
      // Athlete exports and meet-entry exports from Team Manager carry
      // birthdays; results exports carry times.
      const HY3_STROKES = { A: "Freestyle", B: "Backstroke", C: "Breaststroke", D: "Butterfly", E: "IM" };
      function parseHytekHy3(text) {
        const lines = text.split(/\r?\n/);
        const mdY = s => /^\d{8}$/.test(s) ? `${s.slice(4)}-${s.slice(0, 2)}-${s.slice(2, 4)}` : null;
        const t2ms = s => { const m = String(s).trim().match(/^(?:(\d+):)?(\d+)\.(\d\d)$/); return m ? ((+(m[1] || 0) * 60 + +m[2]) * 100 + +m[3]) * 10 : null; };
        let meetName = "", date = null, team = "";
        const teams = [], athletes = {}, swims = [], entries = [];
        for (let i = 0; i < lines.length; i++) {
          const l = lines[i], rec = l.slice(0, 2);
          if (rec === "B1") { meetName = l.slice(2, 47).trim(); const m = l.slice(47).match(/(\d{8})/); date = m ? mdY(m[1]) : null; }
          else if (rec === "C1") { team = l.slice(2, 7).trim().toUpperCase(); if (team && !teams.some(t => t.code === team)) teams.push({ code: team, name: l.slice(7, 37).trim() || team }); }
          else if (rec === "D1") {
            const id = l.slice(3, 8).trim(), last = l.slice(8, 28).trim(), first = l.slice(28, 48).trim(), nick = l.slice(48, 68).trim();
            const fn = nick || first;
            athletes[team + "|" + id] = { name: `${fn} ${last}`.trim(), firstName: fn, lastName: last, team, gender: l.charAt(2) === "F" ? "Girls" : "Boys",
              dob: mdY(l.slice(88, 96)), age: +l.slice(96, 99) || null };
          } else if (rec === "E1") {
            const a = athletes[team + "|" + l.slice(3, 8).trim()];
            const stroke = HY3_STROKES[l.charAt(21)];
            if (!a || !stroke) continue;
            const base = { distance: +l.slice(15, 21) || 0, stroke, eventLabel: l.slice(38, 42).trim() };
            const seeds = (l.slice(42, 62).match(/(\d+:)?\d+\.\d\d/g) || []).map(t2ms).filter(x => x > 0);
            const nx = lines[i + 1] || "";
            const res = nx.startsWith("E2") ? t2ms(nx.slice(3, 11)) : null;
            if (res > 0) {
              const tok = nx.slice(12).trim().split(/\s+/);
              swims.push({ ...a, ...base, course: { Y: "25y", S: "25m", L: "50m" }[nx.charAt(11)] || "25y", timeMs: res, place: +tok[4] || null, date, meetName });
            } else entries.push({ ...a, ...base, seedMs: seeds[0] || null });
          }
        }
        return { meetName, date, teams, athletes: Object.values(athletes), swims, entries };
      }
      // Add or update swimmers (no times): match by name and team; fill in a

      function addAthletesToLibrary(lib, incoming) {
        const list = (lib || []).map(a => ({ ...a }));
        let added = 0, updated = 0;
        incoming.forEach(x => {
          const a = list.find(y => normName(y.name) === normName(x.name) && sameTeam(y.team, x.team));
          if (!a) { list.push({ id: newId("swa"), name: x.name, firstName: x.firstName, lastName: x.lastName, team: x.team, gender: x.gender || "", dob: x.dob || null, age: x.age || null, results: [], personalBests: {}, timeHistory: [] }); added++; return; }
          let ch = false;
          if (x.dob && a.dob !== x.dob) { a.dob = x.dob; ch = true; }
          if (x.gender && !a.gender) { a.gender = x.gender; ch = true; }
          if (ch) updated++;

        return { athletes: list, added, updated };

        const [swimResultsEvent, setSwimResultsEvent] = useState(null);
        // Results tab opens on the latest event that has a time in it, so the host sees something straight away.

          const done = (swimMeet.events || []).filter(ev => (ev.heats || []).some(h => (h.lanes || []).some(l => l.finalMs != null)));
          return done.length ? done[done.length - 1].eventNum : null;

        const [swimResultsTab, setSwimResultsTab] = useState("results"); // "results" | "scores"

        const [swimNewEvent, setSwimNewEvent] = useState({ gender:"Girls", ageGroup:"Open", distance:100, stroke:"Freestyle", heats:1, lanes:8 });

        // Live session state (host side)
        const [swimLiveCode, setSwimLiveCode] = useState(null);
        // Every change to the meet (no-shows, scratches, combined events, relay
        // swaps, re-seeds) goes out to the lane timers and watchers within a second.
        const swimPushRef = useRef("");
        useEffect(() => {
          if (!swimLiveCode) { swimPushRef.current = ""; return; }
          const t = setTimeout(() => {
            const evs = JSON.parse(JSON.stringify((swimMeet.events || []).map(({ entries, ...rest }) => rest)));
            const key = JSON.stringify(evs);
            if (key === swimPushRef.current) return;
            swimPushRef.current = key;
            rtdb.ref(`swimLive/${swimLiveCode}/events`).set(evs).catch(console.error);
          }, 700);
          return () => clearTimeout(t);
        }, [swimLiveCode, swimMeet.events]);
        // ── Meet-day changes panel ──
        const [swimDayOpen, setSwimDayOpen] = useState(null);   // null | "swimmers" | "relays" | "combine"
        const [swimDayTeam, setSwimDayTeam] = useState("");
        const [swimDayOpenEntry, setSwimDayOpenEntry] = useState(null);
        // The heat on the blocks is only frozen once its start has gone.
        const swimHold = () => (swimActiveEvent && swimActiveHeat && swimClockStarted ? { eventNum: swimActiveEvent, heatNum: swimActiveHeat } : null);
        // A re-seed or combine can renumber the open event's heats: follow it.
        useEffect(() => {
          if (!swimActiveEvent) return;
          const ev = (swimMeet.events || []).find(e => e.eventNum === swimActiveEvent);
          if (!ev) return;
          if (ev.mergedInto) { setSwimActiveEvent(ev.mergedInto); setSwimActiveHeat(1); return; }
          if (swimActiveHeat && !(ev.heats || []).some(h => h.heatNum === swimActiveHeat) && (ev.heats || []).length) setSwimActiveHeat(ev.heats[0].heatNum);
        }, [swimMeet.events, swimActiveEvent, swimActiveHeat]);
        function meetDay(fn) { const hold = swimHold(); setSwimMeet(m => applyRosterChanges(fn(m), hold)); }
        function renderSwimDay() {
          const m = swimMeet;
          const ageDate = meetAgeDate(m);
          const teams = (m.teams && m.teams.length ? m.teams.map(t => t.code)
            : [...new Set((m.meetEntries || []).map(e => e.team).filter(Boolean))]);
          const team = teams.includes(swimDayTeam) ? swimDayTeam : (teams[0] || "");
          const evById = new Map((m.events || []).map(ev => [ev.eventNum, ev]));
          const evText = ev => `${evLabel(ev)} · ${ev.gender} ${ev.ageGroup} ${ev.distance} ${ev.stroke}`;
          const hostOf = ev => ev.mergedInto ? evById.get(ev.mergedInto) || ev : ev;
          const swum = ev => swimEventStarted(hostOf(ev));
          const anyAge = !!m.anyAge;

          const tabBtn = (k, label) => (

          const anyAgeToggle = (

              Fun meet: let swimmers enter any age group
            </label>
          );
          const setEntry = (id, fn) => meetDay(mm => ({ ...mm, meetEntries: (mm.meetEntries || []).map(e => e.id === id ? fn(e) : e) }));

          let body = null;
          if (swimDayOpen === "swimmers") {
            const noShows = roster.filter(e => e.noShow).length;
            body = (
              <div>
                {teamPick}{anyAgeToggle}
                <div style={{ ...TM_CAPTION, marginTop: 8 }}>

                    const open = swimDayOpenEntry === e.id;

                    const evs = (e.events || []).map(x => evById.get(x.eventNum)).filter(Boolean);
                    const canAdd = (m.events || []).filter(ev => !isRelayEv(ev) && !(e.events || []).some(x => x.eventNum === ev.eventNum)
                      && !swum(ev) && (anyAge || swimQualifies(e, ev, ageDate, false)));
                    return (
                      <div key={e.id} style={{ border: `2px solid ${e.noShow ? TM.live : TM.line}`, borderRadius: 6, padding: "8px 10px", background: e.noShow ? "#FBEDEE" : "#FFFFFF" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <button onClick={() => setSwimDayOpenEntry(open ? null : e.id)} aria-expanded={open}
                            style={{ flex: 1, minWidth: 0, textAlign: "left", background: "none", border: "none", padding: 0, cursor: "pointer", color: TM.ink }}>
                            <div style={{ fontSize: 16, fontWeight: 800, textDecoration: e.noShow ? "line-through" : "none" }}>{e.name}</div>

                            style={{ ...btnStyle(TM.live, !e.noShow), minHeight: 40, padding: "0 12px", fontSize: 14, flexShrink: 0 }}>

          } else if (swimDayOpen === "relays") {
            const relayEvents = (m.events || []).filter(ev => isRelayEv(ev) && (anyAge || (ev.gender || "").toLowerCase().startsWith("mix") || roster.some(e => swimQualifies(e, ev, ageDate, true))));
            const setRelays = fn => meetDay(mm => ({ ...mm, relays: fn(mm.relays || []) }));
            body = (
              <div>
                {teamPick}{anyAgeToggle}
                <div style={{ ...TM_CAPTION, marginTop: 8 }}>Swap swimmers on a relay any time — even after it's swum — and the heat sheet, lane timers and results use the new names.</div>
                {relayEvents.length === 0 && <div style={{ ...TM_CAPTION, marginTop: 10 }}>No relay events for this team.</div>}
                {relayEvents.map(ev => {
                  const rs = (m.relays || []).filter(r => r.eventNum === ev.eventNum && sameTeam(r.team, team));
                  const pool = roster.filter(e => !e.noShow && (anyAge || swimQualifies(e, ev, ageDate, true)));
                  return (
                    <div key={ev.eventNum} style={{ ...rowStyle(TM.swim), marginTop: 10 }}>
                      <div style={{ fontSize: 15, fontWeight: 800 }}>{evText(ev)}</div>
                      {rs.map(r => {
                        const used = new Set(rs.flatMap(o => (o.legs || []).filter(Boolean).map(l => l.id)));
                        return (
                          <div key={r.id} style={{ marginTop: 8 }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                              <strong style={{ flex: 1 }}>{team} {r.letter}</strong>
                              {!swum(ev) && <button onClick={() => setRelays(list => list.filter(x => x.id !== r.id))}
                                style={{ background: "none", border: "none", color: TM.live, fontWeight: 800, cursor: "pointer", fontSize: 14 }}>Remove relay</button>}
                            </div>
                            {[0, 1, 2, 3].map(i => {
                              const leg = (r.legs || [])[i];
                              const legEntry = leg && (m.meetEntries || []).find(e => e.id === leg.id);
                              const gone = legEntry && legEntry.noShow;
                              return (
                                <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4 }}>
                                  <span style={{ width: 54, fontSize: 14, fontWeight: 700 }}>Leg {i + 1}</span>
                                  <select value={leg ? leg.id : ""} onChange={x => {
                                    const e = (m.meetEntries || []).find(y => y.id === x.target.value);
                                    setRelays(list => list.map(rr => rr.id !== r.id ? rr : { ...rr, legs: [0, 1, 2, 3].map(k => k === i ? (e ? { id: e.id, name: e.name, age: swimAgeOn(e, ageDate) } : null) : ((rr.legs || [])[k] || null)) }));
                                  }} style={{ flex: 1, minWidth: 0, minHeight: 40, fontSize: 15, border: `2px solid ${gone ? TM.live : TM.line}`, borderRadius: 6, padding: "0 6px" }}>

                                  </select>
                                  {gone && <span style={{ color: TM.live, fontWeight: 800, fontSize: 13 }}>⚠ scratched</span>}
                                </div>
                              );
                            })}

                      {!swum(ev) && (

                        {!started && (
                          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 6 }}>

            const mine = new Set(swimTeamLib.map(t => t.code));
            const swims = asList(d.swims).filter(x => mine.has(x.team));
            if (!swims.length) return { ok: false, text: "None of the teams in these results are in your Swim Teams. Make your team there first." };
            const r = addSwimsToAthletes(swimAthletes, swims);
            setSwimAthletes(r.athletes); localStorage.setItem("swim-athletes", JSON.stringify(r.athletes));
            if (currentUser) rtdb.ref("users/" + currentUser.uid + "/swimAthletes").set(r.athletes).catch(console.error);
            return { ok: true, text: `Added ${r.added} times from “${fm.meetName}” to your swimmers' profiles.` };
          }
          if (d.kind === "meet" || d.kind === "program") {
            const prog = d.kind === "program";
            if (swimMeet.events.length && swimMeet.meetUid !== fm.meetUid && !window.confirm(`Replace the meet on screen with “${fm.meetName}”?`)) return { ok: false, text: "Not opened." };
            const keep = !prog && swimMeet.meetUid && swimMeet.meetUid === fm.meetUid;
            setSwimMeet(m => syncEventEntries({ ...m, ...info, _id: prog ? m._id : (keep ? m._id : undefined),
              events: prog ? evs : evs.map(ev => ({ ...ev, heats: [{ heatNum: 1, lanes: [] }] })),
              meetEntries: prog ? entriesOf(d.meetEntries) : (keep ? m.meetEntries : []),
              relays: prog ? relaysOf(d.relays) : (keep ? m.relays : []) }));
            setSwimExpandedEvents({});
            return { ok: true, text: prog
              ? `Opened the program for “${fm.meetName}” — print your team list, heat sheet or lane sheets below.`
              : `Opened “${fm.meetName}”: ${evs.length} events. Add your swimmers in Who's swimming, then send your entries back.` };
          }
          return { ok: false, text: "That file type isn't supported." };
        }

        function joinSwimWatchCode(codeIn, quiet) {
          const code = normCode(codeIn);
          if (!code) return;
          try { localStorage.setItem("swim-watch-last", JSON.stringify({ code, at: Date.now() })); } catch (_) {}
          if (swimWatchListenerRef.current) {
            swimWatchListenerRef.current.ref.off("value", swimWatchListenerRef.current.fn);
          }
          setSwimWatchError("");
          setSwimWatchSession(null);
          const ref = rtdb.ref(`swimLive/${code}`);
          let had = false;
          const fn = snap => {
            if (!snap.exists() || !(snap.val() && (snap.val().hostUid || snap.val().meetName))) { setSwimWatchError(had ? "This meet has ended. Thanks for watching!" : quiet ? "" : "Meet not found. Check the code with your host."); setSwimWatchSession(null); try { localStorage.removeItem("swim-watch-last"); } catch (_) {} return; }
            had = true;
            setSwimWatchError("");
            setSwimWatchSession(snap.val());
          };
          ref.on("value", fn);
          swimWatchListenerRef.current = { ref, fn };
        }

        // Auth loading screen
        // After sign-in: follow a ?lane= / ?meet= link, or go back to the meet this phone was on.
        const swimResumeRef = useRef(false);
        useEffect(() => {
          if (authLoading || !signedIn || swimResumeRef.current) return;
          swimResumeRef.current = true;
          const lane = normCode(linkParams.get("lane") || ""), meet = normCode(linkParams.get("meet") || "");
          if (lane || meet) { try { history.replaceState(history.state, "", location.pathname); } catch (_) {} }
          if (lane) { setSwimLaneCode(lane); return; }
          if (meet) { setSwimWatchCode(meet); joinSwimWatchCode(meet); return; }
          const fresh = x => x && x.code && Date.now() - (x.at || 0) < 12 * 3600e3;
          let last = null;
          if (effectiveRole === "timer") {
            try { last = JSON.parse(localStorage.getItem("swim-lane-last") || "null"); } catch (_) {}
            if (fresh(last)) joinLaneTimer(last.code, last.lane, true);
          } else if (effectiveRole === "spectator") {
            try { last = JSON.parse(localStorage.getItem("swim-watch-last") || "null"); } catch (_) {}
            if (fresh(last)) { setSwimWatchCode(last.code); joinSwimWatchCode(last.code, true); }
          }
        }, [authLoading, signedIn]);

        if (authLoading) return (
          <div style={{ minHeight: "100vh", background: TM.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <div style={{ textAlign: "center" }}>
              <SwimLockup size={44} wordSize={28} rule />
              <div style={{ fontSize: 14, fontWeight: 800, color: TM.inkMuted, letterSpacing: 1.2, marginTop: 16 }}>LOADING…</div>
            </div>
          </div>
        );

        // ── Role picker: three full-bleed blocks, the whole block is the target ──
        if (rolePickerOpen || !effectiveRole) {
          const lanes = [
            ["host",      TM.swim, "Host",       "I'm running the meet",            <RoleIcon kind="host" />],
            ["timer",     TM.ink,  "Lane timer", "I'm timing a lane",               <RoleIcon kind="timer" />],
            ["spectator", TM.run,  "Parent",     "I'm watching — live heats and times",  <RoleIcon kind="spectator" />],
          ];
          return (
            <div style={{ minHeight: "100vh", background: TM.bg, color: TM.ink, display: "flex", flexDirection: "column" }}>
              <div style={{ padding: "36px 20px 26px" }}>
                <SwimLockup size={34} wordSize={26} center={false} />
                <h1 style={{ ...TM_DISPLAY, marginTop: 30 }}>What are you<br/>here to do?</h1>
                <div style={{ fontSize: 16, fontWeight: 600, color: TM.inkMuted, marginTop: 12 }}>
                  We'll remember this. You can switch any time from the top of the screen.
                </div>
              </div>
              <div>
                {lanes.map(([role, bg, title, sub, icon]) => (
                  <button key={role} onClick={() => chooseRole(role)} aria-label={`${title}: ${sub}`}
                    style={{ display: "flex", alignItems: "center", gap: 16, width: "100%", minHeight: 108,
                             padding: "22px 24px", background: bg, color: "#FFFFFF", border: "none",
                             borderRadius: 0, textAlign: "left", cursor: "pointer" }}>
                    {icon}
                    <span style={{ flex: 1, minWidth: 0 }}>
                      <span style={{ display: "block", fontWeight: 900, fontSize: 27, textTransform: "uppercase", letterSpacing: -0.4, lineHeight: 1 }}>{title}</span>
                      <span style={{ display: "block", fontWeight: 600, fontSize: 15, marginTop: 6 }}>{sub}</span>
                    </span>
                    <ArrowIcon />
                  </button>
                ))}
              </div>
              <div style={{ padding: "22px 20px 40px", display: "flex", flexWrap: "wrap", gap: 12, alignItems: "center" }}>
                {rolePickerOpen && effectiveRole && (
                  <button onClick={() => setRolePickerOpen(false)} style={btnStyle(TM.ink, true)}>Cancel</button>
                )}
                {signedIn && (
                  <div style={{ fontSize: 14, fontWeight: 600, color: TM.inkMuted }}>
                    Signed in as {currentUser.email}
                  </div>
                )}
              </div>
            </div>
          );
        }

        // ── Sign in / create account — hosts and athletes only ──────────────────
        // Spectators skip this entirely unless they ask to sign in.
              function joinLaneTimer(codeIn, laneIn, silent) {
                const code = String(codeIn || swimLaneCode).trim().toUpperCase();
                const lane = laneIn || swimLaneNum;
                if (!code) { setSwimLaneError("Enter a meet code."); return; }
                if (!lane || lane < 1) { setSwimLaneError("Enter a lane number."); return; }
                if (swimLaneListenerRef.current) {
                  swimLaneListenerRef.current.ref.off("value", swimLaneListenerRef.current.fn);
                  swimLaneListenerRef.current = null;
                }
                setSwimLaneError("");
                setSwimLaneSession(null);
                setSwimLaneConnecting(true);
                const ref = rtdb.ref(`swimLive/${code}`);
                let had = false;
                const fn = snap => {
                  setSwimLaneConnecting(false);
                  // A node with no host data is one this phone's own heartbeat re-created after the host removed it.
                  if (!snap.exists() || !(snap.val() && (snap.val().hostUid || snap.val().meetName))) {
                    setSwimLaneSession(null);
                    setSwimLaneError(had ? "The host ended the live session. Thanks for timing!" : silent ? "" : "Code not found. Check with the host.");
                    return;
                  }
                  had = true;
                  setSwimLaneError("");
                  setSwimLaneSession(snap.val());
                };
                const errFn = err => {
                  setSwimLaneConnecting(false);
                  setSwimLaneError("Connection error: " + err.message);
                };
                ref.on("value", fn, errFn);
                swimLaneListenerRef.current = { ref, fn };
                setSwimLaneCode(code); setSwimLaneNum(lane);
                try { localStorage.setItem("swim-lane-last", JSON.stringify({ code, lane, at: Date.now() })); } catch (_) {}
                syncServerClock(`swimLive/${code}/clock/lane${lane}`).then(err => setSwimLaneClockErr(err));
              }


        const needsLogin = !signedIn;   // live meets are only readable when signed in
        if (needsLogin) {
          const roleColour = isHost ? TM.swim : effectiveRole === "timer" ? TM.ink : TM.run;
          const roleName = isHost ? "Host" : effectiveRole === "timer" ? "Lane timer" : "Parent";
          const submit = () => (authMode === "login" ? authSignIn() : authSignUp());
          const field = (id, label, input) => (
            <div>
              <label htmlFor={id} style={TM_LABEL}>{label}</label>
              {input}
            </div>
          );
          const inp = { width: "100%", background: "#FFFFFF", border: `2px solid ${TM.line}`, borderRadius: 6,
                        padding: "10px 14px", color: TM.ink, outline: "none" };
          return (
            <div style={{ minHeight: "100vh", background: TM.bg, color: TM.ink }}>
              <div style={{ background: roleColour, color: "#FFFFFF", padding: "14px 16px 22px" }}>

              <div style={{ maxWidth: 440, margin: "0 auto", padding: "22px 20px 48px" }}>

                </div>
                <form onSubmit={e => { e.preventDefault(); submit(); }} style={{ display: "flex", flexDirection: "column", gap: 16 }}>

                    </div>

                  {field("au-pass", "Password",

                      autoComplete={authMode === "login" ? "current-password" : "new-password"} style={inp} />)}
                  {authError && (
                    <div role="alert" style={{ fontSize: 16, fontWeight: 600, color: TM.ink, background: TM.bgAlt,
                      borderLeft: `8px solid ${authError.includes("sent") ? TM.run : TM.live}`, padding: "10px 14px" }}>
                      {authError}
                    </div>

                  <button type="submit" disabled={authWorking}
                    style={{ ...btnStyle(TM.ink), width: "100%", opacity: authWorking ? 0.7 : 1 }}>
                    {authWorking ? "Please wait…" : authMode === "login" ? "Sign in →" : "Create account →"}
                  </button>
                  {authMode === "signup" && (
                    <p style={{ margin: 0, fontSize: 15, color: TM.inkMuted, textAlign: "center" }}>
                      By creating an account you agree to the{" "}
                      <a href="https://timeathon.com/privacy.html" target="_blank" rel="noopener" style={{ color: TM.ink, fontWeight: 700 }}>Privacy Policy</a>.
                    </p>
                  )}
                  {authMode === "login" && (
                    <button type="button" onClick={authResetPassword}
                      style={{ background: "none", border: "none", color: TM.ink, fontSize: 16, fontWeight: 700,
                               textDecoration: "underline", cursor: "pointer" }}>
                      Forgot password?
                    </button>
                  )}
                </form>
              </div>
            </div>
          );
        }

        if (isHost && signedIn && hostAccess === null) {
          return (
            <div style={{ minHeight: "100vh", background: TM.bg, color: TM.ink }}>
              <div style={{ background: TM.swim, color: "#FFFFFF", padding: "24px 20px 28px" }}>
                <button onClick={() => { setChosenRole(null); setRolePickerOpen(true); try { localStorage.removeItem("tm-role"); } catch (_) {} }}
                  style={{ ...btnStyle("#FFFFFF", true), color: "#FFFFFF", borderColor: "#FFFFFF", minHeight: 44 }}>← Change role</button>
                <div style={{ fontSize: 14, fontWeight: 800, letterSpacing: 1.4, marginTop: 18 }}>HOST</div>
                <h1 style={{ ...TM_DISPLAY, color: "#FFFFFF", marginTop: 4 }}>Run your meet on swimmeet.studio</h1>
              </div>
              <div style={{ maxWidth: 560, margin: "0 auto", padding: "20px 16px 60px" }}>
                <div style={{ fontSize: 17, lineHeight: 1.5 }}>
                  Lane timers on phones, heats and lanes, live results for parents, team scores and ribbons.</div>
                <div style={{ ...rowStyle(TM.swim), marginTop: 18 }}>
                  <div style={{ fontSize: 30, fontWeight: 900 }}>{HOST_PRICE}</div>
                  <div style={{ ...TM_CAPTION, marginTop: 2 }}>Cancel any time. Lane timers and parents are always free.</div>
                  {STRIPE_HOST_LINK
                    ? <a href={`${STRIPE_HOST_LINK}?client_reference_id=${encodeURIComponent(currentUser.uid)}&prefilled_email=${encodeURIComponent(currentUser.email || "")}`}
                        style={{ ...btnStyle(TM.swim), display: "flex", alignItems: "center", justifyContent: "center", textDecoration: "none", marginTop: 12 }}>Subscribe →</a>
                    : <div style={{ fontSize: 15, fontWeight: 700, marginTop: 12 }}>Have a promo code? Enter it below.</div>}
                  {subPending && <div style={{ fontSize: 15, fontWeight: 700, color: TM.run, marginTop: 10 }}>✓ Thanks for subscribing! Your hosting is being switched on — usually within a few hours. This page unlocks by itself.</div>}
                </div>
                <div style={{ marginTop: 22 }}>
                  <label htmlFor="promo" style={TM_LABEL}>Promo code</label>
                  <div style={{ display: "flex", gap: 8 }}>
                    <input id="promo" value={promoInput} onChange={e => setPromoInput(normCode(e.target.value))} placeholder="Type code" autoCapitalize="characters"
                      onKeyDown={e => { if (e.key === "Enter") redeemPromo(); }}
                      style={{ flex: 1, minWidth: 0, minHeight: 50, fontSize: 18, fontWeight: 800, letterSpacing: 2, padding: "0 12px", border: `2px solid ${TM.line}`, borderRadius: 6 }} />
                    <button onClick={redeemPromo} disabled={!promoInput || (promoMsg && promoMsg.busy)} style={{ ...btnStyle(TM.ink), minHeight: 50 }}>Apply</button>
                  </div>
                  {promoMsg && promoMsg.text && (
                    <div role="alert" style={{ marginTop: 10, fontSize: 16, fontWeight: 700, color: promoMsg.ok ? TM.run : TM.live }}>{promoMsg.text}</div>
                  )}
                </div>
                <div style={{ ...TM_CAPTION, marginTop: 26 }}>Signed in as {currentUser.email}. Here to time or watch? <button onClick={() => { setChosenRole(null); setRolePickerOpen(true); }} style={{ background: "none", border: "none", color: TM.swim, fontWeight: 800, textDecoration: "underline", cursor: "pointer", fontSize: 15, padding: 0 }}>Pick Athlete or Spectator</button>.</div>
              </div>
            </div>
          );
        }

        // Where "back" goes for athletes and spectators, who have no nav bar.
        const roleHome = roleLanding(effectiveRole);
        const atRoleHome = view === roleHome;
        function goRoleHome() { setView(roleHome); }

        return (
          <div style={{ minHeight: "100vh", background: TM.bg, fontFamily: "var(--tm-font)", color: TM.ink }}>
            {/* HEADER — brand on the left, the way out of this role on the right. */}
            <header style={{ background: TM.bg, borderBottom: `3px solid ${TM.ink}`, padding: "8px 12px",
                             display: "flex", alignItems: "center", gap: 10, minHeight: 64 }}>
              {!isHost && !atRoleHome ? (
                <button onClick={goRoleHome} aria-label="Back"
                  style={{ ...btnStyle(TM.ink, true), minWidth: 46, padding: "0 12px", fontSize: 22 }}>←</button>
              ) : null}
              <button onClick={() => { if (isHost) { setView("swim"); setSwimView("home"); window.scrollTo(0, 0); } else goRoleHome(); }}
                aria-label="swimmeet.studio home"
                style={{ background: "none", border: "none", padding: 0, cursor: "pointer", minWidth: 0,
                         display: "flex", alignItems: "center", gap: 8 }}>
                <SwimMark size={30} />
                {/* No room for the wordmark beside a back arrow on a phone. */}
                {(isHost || atRoleHome) && <span style={{ ...TM_WORD_STYLE, fontSize: 18, textTransform: "none", letterSpacing: -0.4 }}>swimmeet.studio</span>}
              </button>
              <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
                <button onClick={() => setRolePickerOpen(true)}
                  style={{ ...btnStyle(TM.ink, true), padding: "0 12px", fontSize: 15, whiteSpace: "nowrap" }}>
                  Switch
                </button>
                {signedIn && (
                  <button onClick={() => setView("profile")} aria-label="Profile" title="Profile"
                    style={{ ...btnStyle(TM.ink, view !== "profile"), minWidth: 46, width: 46, padding: 0 }}>
                    <PersonIcon />
                  </button>
                )}
              </div>
            </header>

            {/* NAV — hosts only. Athletes and spectators move with a back arrow. */}
            {isHost && (() => {
              const swimNavMap = { swimhome:"home", swimsetup:"setup", swimrace:"race", swimresults:"results", swimathletes:"athletes", swimfiles:"files", swimdevices:"devices" };
              const navTabs = [["swimhome","Meets"],["swimsetup","Setup"],["swimrace","Race"],["swimresults","Results"],["swimathletes","Swim Teams"],["swimfiles","Import / Export"],["swimdevices","Devices"]];
              return (
                <nav className="tm-nav-wrap" aria-label="Host">
                <div className="tm-nav" ref={navStripRef}>
                  {navTabs.map(([v, label]) => {
                    const isActive = view === "swim" && swimView === swimNavMap[v];
                    return (
                      <button key={v} className="tm-nav-btn"
                        data-active={isActive ? "1" : "0"} aria-current={isActive ? "page" : undefined}
                        onClick={() => {
                        setView("swim"); setSwimView(swimNavMap[v]);
                      }}>
                        {label}
                      </button>
                    );
                  })}
                </div>
                </nav>
              );
            })()}

            <div style={{ maxWidth: 640, margin: "0 auto", padding: view === "profile" ? "16px 16px 60px" : 0 }}>

              {/* ── PROFILE ── */}
              {view === "profile" && (
                <div style={{ paddingTop: 8, maxWidth: 480, margin: "0 auto" }}>
                  <div style={{ fontSize: 14, fontWeight: 700, letterSpacing: 1.2, textTransform: "uppercase", color: "#3D434B", marginBottom: 16 }}>My Profile</div>

                  {isOwner && (
                    <div style={{ background: "#FFFFFF", border: `2px solid ${TM.swim}`, borderRadius: 8, padding: "16px", marginBottom: 14 }}>
                      <div style={{ fontSize: 14, fontWeight: 800, letterSpacing: 1.2, textTransform: "uppercase", color: TM.swim, marginBottom: 6 }}>Host promo codes (owner)</div>
                      {Object.keys(pendingList).length > 0 && (
                        <div style={{ ...rowStyle(TM.run), marginBottom: 12 }}>
                          <div style={{ fontWeight: 800, marginBottom: 6 }}>New subscribers waiting</div>
                          <div style={{ ...TM_CAPTION, marginBottom: 6 }}>Check each one is in Stripe (Customers / Subscriptions), then switch on hosting.</div>
                          {Object.entries(pendingList).map(([uid, v]) => (
                            <div key={uid} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 15, marginTop: 4 }}>
                              <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis" }}>{(v && v.email) || uid}</span>
                              <button onClick={async () => { await rtdb.ref("hostAccess/" + uid).set({ via: "stripe", email: (v && v.email) || "", at: Date.now() }); rtdb.ref("hostPending/" + uid).remove().catch(() => {}); }}
                                style={{ ...btnStyle(TM.run), minHeight: 38, padding: "0 10px", fontSize: 14 }}>Switch on</button>
                              <button onClick={() => rtdb.ref("hostPending/" + uid).remove().catch(() => {})} style={{ background: "none", border: "none", color: TM.live, fontWeight: 700, cursor: "pointer" }}>Dismiss</button>
                            </div>
                          ))}

                      )}
                      <div style={{ ...TM_CAPTION, marginBottom: 10 }}>Anyone who enters one of these codes can host races for free, for as long as the code allows (counted from when they enter it).</div>
                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                        <input value={newPromo} onChange={e => setNewPromo(normCode(e.target.value))} placeholder="New code, e.g. COACHJEN" autoCapitalize="characters"
                          style={{ flex: 1, minWidth: 0, minHeight: 44, fontSize: 16, fontWeight: 800, letterSpacing: 1.5, padding: "0 10px", border: `2px solid ${TM.line}`, borderRadius: 6 }} />
                        <select value={newPromoDays} onChange={e => setNewPromoDays(+e.target.value)} aria-label="How long the code gives hosting"
                          style={{ minHeight: 44, fontSize: 15, fontWeight: 700, border: `2px solid ${TM.line}`, borderRadius: 6, padding: "0 6px" }}>
                          {PROMO_LENGTHS.map(([d, l]) => <option key={d} value={d}>{l}</option>)}
                        </select>
                        <button disabled={newPromo.length < 4} onClick={() => { rtdb.ref("promoCodes/" + newPromo).set({ createdBy: currentUser.uid, at: Date.now(), ...(newPromoDays ? { days: newPromoDays } : {}) }).catch(e => alert("Couldn't save the code: " + (e && e.message))); setNewPromo(""); }}
                          style={{ ...btnStyle(TM.swim), minHeight: 44, opacity: newPromo.length < 4 ? 0.5 : 1 }}>Add</button>
                      </div>
                      {promoList && Object.keys(promoList).length > 0 && (
                        <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>

                              <button onClick={() => rtdb.ref("promoCodes/" + code).remove().catch(() => {})} style={{ background: "none", border: "none", color: TM.live, fontWeight: 700, cursor: "pointer" }}>Delete</button>
                            </div>

                        </div>
                      )}
                    </div>
                  )}

                  <div style={{ background: "#EFEDE8", border: "2px solid #C9C5BC", borderRadius: 8, padding: "18px 16px", marginBottom: 14 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, letterSpacing: 1.2, textTransform: "uppercase", color: "#3D434B", marginBottom: 12 }}>Personal Info</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      <div style={{ display: "flex", gap: 8 }}>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 14, color: "#3D434B", marginBottom: 4 }}>First Name</div>
                          <input value={editProfile.firstName} onChange={e => setEditProfile(p => ({ ...p, firstName: e.target.value }))}

                async function importMeetFile(file) {
                  setSwimImportMsg(null);
                  if (/\.json$/i.test(file.name)) { setSwimImportMsg(await importMeetJson(file)); return; }
                  let name = file.name, text;
                  try {
                    if (/\.zip$/i.test(name)) ({ name, text } = await fileFromZip(file));
                    else text = await file.text();
                  } catch (e) { setSwimImportMsg({ ok: false, text: e.message || "Couldn't read that file." }); return; }
                  if (/\.ev3$/i.test(name)) { setSwimImportMsg({ ok: false, text: "Pick the .hyv file (or the whole .zip) — it's the one with the events." }); return; }
                  if (/\.hyv$/i.test(name)) {
                    let hv;
                    try { hv = parseHyv(text); } catch (e) { setSwimImportMsg({ ok: false, text: e.message }); return; }
                    useMeetEvents(hv, hv.meetName || name, "Imported");
                    return;
                  }
                  let parsed;
                  const lower = name.toLowerCase();
                  if (lower.endsWith(".hy3") || lower.endsWith(".cl2")) {

                  }));
                  setSwimExpandedEvents({});
                  setSwimImportMsg({ ok: true, text: `Imported ${parsed.events.length} events and ${linkedEntries.length} swimmers.` });
                }
                // Put a set of events (from a file or a ready-made meet) in this meet.
                function useMeetEvents(hv, source, verb) {
                  const had = swimMeet.events.length;
                  if (had && !window.confirm(`Replace the ${had} event${had === 1 ? "" : "s"} you have with the ${hv.events.length} from “${source}”? Swimmers already entered will need to be entered again.`)) return false;
                  const lanes = swimMeet.lanes || 8;
                  const blankHeat = () => ({ heatNum: 1, lanes: Array.from({ length: lanes }, (_, li) => ({
                    lane: li + 1, lastName: "", firstName: "", name: "", age: 0, team: "", seedTime: "NT", seedMs: null, finalMs: null, dq: false, scratch: false })) });
                  setSwimMeet(m => ({ ...m,
                    meetName: m.meetName || hv.meetName, date: hv.date || m.date, ageUpDate: hv.ageUpDate || m.ageUpDate || hv.date || m.date,
                    facility: hv.facility || m.facility, pool: hv.course || m.pool, meetUid: newId("meet"),
                    events: hv.events.map((ev, i) => ({ ...ev, eventNum: i + 1, heats: [blankHeat()] })),
                    meetEntries: had ? [] : (m.meetEntries || []), relays: had ? [] : (m.relays || []) }));
                  setSwimExpandedEvents({});
                  const relays = hv.events.filter(ev => ev.relay).length;
                  setSwimImportMsg({ ok: true, text: `${verb} ${hv.events.length} events from “${source}”${relays ? ` (${relays} relays)` : ""}. Tap an event to edit or delete it. Next: add swimmers, then 🌱 Seed.` });
                  return true;
                }
                function deleteMeetEvent(ev) {
                  const n = (ev.entries || []).length + ev.heats.reduce((k, h) => k + h.lanes.filter(l => l.name).length, 0);
                  if (n && !window.confirm(`Event ${evLabel(ev)} has swimmers in it. Delete it anyway?`)) return;
                  setSwimMeet(m => ({ ...m, events: m.events.filter(e => e.eventNum !== ev.eventNum),
                    meetEntries: (m.meetEntries || []).map(en => ({ ...en, events: (en.events || []).filter(x => x.eventNum !== ev.eventNum) })) }));
                  if (swimEditEvt === ev.eventNum) { setSwimEditEvt(null); setSwimEditForm(null); }
                }
                function saveMeetEvent(ev) {
                  const f = swimEditForm; if (!f) return;
                  const [minAge, maxAge] = ageRangeOf(f.ageGroup);
                  setSwimMeet(m => ({ ...m, events: m.events.map(e => e.eventNum !== ev.eventNum ? e : { ...e,
                    eventLabel: (f.eventLabel || "").trim() || evLabel(e), gender: f.gender, ageGroup: (f.ageGroup || "").trim() || "Open",
                    minAge, maxAge: maxAge >= 99 ? 0 : maxAge, distance: +f.distance || e.distance, stroke: f.stroke, relay: /relay/i.test(f.stroke) }) }));
                  setSwimEditEvt(null); setSwimEditForm(null);
                }

                function exportMeetEvents() {
                  const text = buildHyv(swimMeet);
                  const d = new Date((swimMeet.date || new Date().toLocaleDateString("en-CA")) + "T12:00:00");
                  const stamp = `${String(d.getDate()).padStart(2, "0")}${d.toLocaleString("en-US", { month: "short" })}${d.getFullYear()}`;
                  const safe = (swimMeet.meetName || "Swim Meet").replace(/[\\/:*?"<>|]/g, "").trim();
                  const a = document.createElement("a");
                  a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
                  a.download = `Meet Events-${safe}-${stamp}-001.hyv`;
                  document.body.appendChild(a); a.click();
                  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
                  setSwimImportMsg({ ok: true, text: `Saved “${a.download}” — anyone can import it here (Events & heats → Import) to start a meet with these events.` });
                }

                function saveAndAdvance() {
                  const ev = swimMeet.events.find(e => e.eventNum === swimActiveEvent);
                  if (!ev) return;
                  const hIdx = ev.heats.findIndex(h => h.heatNum === swimActiveHeat);
                  const ht = ev.heats[hIdx];
                  resetSwimClock();
                  // Record times to athlete profiles
                  if (ht) {
                    const today = new Date().toISOString().slice(0, 10);
                    const key = eventKey(ev);
                    const athleteUpdates = new Map();
                    ht.lanes.forEach(s => {
                      if (s.finalMs != null && !s.dq && !s.scratch) {
                        const rosterEntry = (swimMeet.meetEntries || []).find(e => e.name === s.name);
                        const aid = rosterEntry?.athleteId;
                        const athlete = aid ? swimAthletes.find(a => a.id === aid) : null;
                        if (!athlete) return;
                        const base = athleteUpdates.get(aid) || athlete;
                        const existing = base.personalBests?.[key];
                        const isFaster = !existing || s.finalMs < existing.ms;
                        const histEntry = { key, ms: s.finalMs, time: formatSwimTime(s.finalMs), date: today, meetName: swimMeet.meetName || "Meet" };
                        athleteUpdates.set(aid, {
                          ...base,
                          personalBests: isFaster ? { ...base.personalBests, [key]: { ms: s.finalMs, time: formatSwimTime(s.finalMs), date: today, meetName: swimMeet.meetName || "Meet" } } : base.personalBests,
                          timeHistory: [...(base.timeHistory || []), histEntry]
                        });
                      }
                    });
                    if (athleteUpdates.size > 0) {
                      persistSwimAthletes(swimAthletes.map(a => athleteUpdates.has(a.id) ? athleteUpdates.get(a.id) : a));
                    }
                  }
                  if (swimLiveCode) {
                    if (ht) {
                      const hrs = {};
                      ht.lanes.forEach(s => { if (s.finalMs != null) hrs[s.lane] = { finalMs: s.finalMs, dq: s.dq||false, name: s.name||"", team: s.team||"" }; });
                      if (Object.keys(hrs).length > 0) {
                        rtdb.ref(`swimLive/${swimLiveCode}/heatResults/${swimActiveEvent}_${swimActiveHeat}`).set(hrs).catch(console.error);
                      }
                    }
                    rtdb.ref(`swimLive/${swimLiveCode}`).update({ status: "waiting", startedAt: null, results: null }).catch(console.error);
                  }
                  if (hIdx < ev.heats.length - 1) {
                    const nextHeat = ev.heats[hIdx + 1];
                    setSwimActiveHeat(nextHeat.heatNum);
                    if (swimLiveCode) rtdb.ref(`swimLive/${swimLiveCode}`).update({ activeHeat: nextHeat.heatNum }).catch(console.error);
                  } else {
                    const eIdx = swimMeet.events.findIndex(e => e.eventNum === swimActiveEvent);
                    // the next event somebody is actually swimming in — empty and combined-away events are skipped
                    const nextEv = swimMeet.events.slice(eIdx + 1).find(e => swimEvHasSwimmers(swimMeet, e));
                    if (nextEv) {
                      const firstHt = nextEv.heats.find(h => h.lanes.some(l => l.name && !l.scratch)) || nextEv.heats[0];
                      const nextHt = firstHt ? firstHt.heatNum : 1;
                      setSwimActiveEvent(nextEv.eventNum);
                      setSwimActiveHeat(nextHt);
                      if (swimLiveCode) rtdb.ref(`swimLive/${swimLiveCode}`).update({ activeEvent: nextEv.eventNum, activeHeat: nextHt }).catch(console.error);
                    } else {
                      setSwimView("results");
                      if (swimLiveCode) rtdb.ref(`swimLive/${swimLiveCode}`).update({ status: "finished" }).catch(console.error);
                      return;
                    }
                  }

                          {swimImportMsg && (
                            <div role="status" style={{ ...rowStyle(swimImportMsg.ok ? TM.run : TM.live), marginTop: 10, fontSize: 15, fontWeight: 700 }}>
                              {swimImportMsg.ok ? "✓ " : "✕ "}{swimImportMsg.text}
                            </div>
                          )}
                          <button onClick={() => setSwimView("files")} style={{ ...btnStyle(TM.ink, true), fontSize: 15, width: "100%", marginTop: 10 }}>

                          </button>
                        </div>

                        {/* Event tree */}
                        {swimMeet.events.length > 0 && (
                          <div style={S.card}>
                            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
                              <div style={S.label}>Events ({swimMeet.events.length})</div>

                                <button onClick={seedAllEvents}

                                <button onClick={() => { const all = {}; swimMeet.events.forEach(ev => { all[ev.eventNum] = true; }); setSwimExpandedEvents(all); }}
                                  style={{ fontSize:14, color:"#3D434B", background:"none", border:"none", cursor:"pointer" }}>Expand All</button>
                              </div>
                            </div>
                            {swimMeet.events.map(ev => {
                              const expanded = !!swimExpandedEvents[ev.eventNum];
                              const showAddForm = swimAddSwimmerEvt === ev.eventNum;
